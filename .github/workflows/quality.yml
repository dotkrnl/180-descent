name: Quality gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-quality:
    name: Source quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install XML validator
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libxml2-utils

      - name: Install dependencies
        run: npm ci

      - name: Prepare generated source assets
        run: npx tsx scripts/cli/prepare-assets.ts

      - name: Check content contracts
        run: npm run check:content

      - name: Check JavaScript, imports, and dead code
        run: npm run check:javascript && npm run check:imports && npm run check:dead

      - name: Check source math and SVG text
        run: npm run check:math:source && npm run check:svg-text

      - name: Check appendix styles
        run: npm run check:appendix-style

      - name: Check repository contracts
        run: npm run check:clean && npm run check:workflows

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build website
        run: npm run build:site

      - name: Check built website
        run: npm run check:site
