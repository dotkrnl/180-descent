title:
  en: The 180-Day Map of Knowledge
  zh: 一百八十日知识地图
subtitle:
  en: Foundations to the 2026 research frontier
  zh: 从根基到 2026 年研究前沿
purpose:
  en: "A dependency-ordered course of daily descents: accessible entry point, core
    model, live debate, and recent trustworthy research frontier."
  zh: 一门按依赖关系排序的逐日课程：通俗易懂的切入点、核心模型、 正在进行的争论，以及新近可靠的研究前沿。
method:
  en: Each day moves from a story or analogy into a mental model, then names the
    debate and walks to the edge of current evidence with a hype filter.
  zh: 每一天都从一个故事或类比引入心智模型，再点明核心争论， 最后保持对「炒作」的警觉，直抵当前证据的边缘。
blocks:
  - id: I
    start_day: 1
    end_day: 14
    title:
      en: Foundations of Knowledge & Reasoning
      zh: 知识与推理的根基
    summary:
      en: "The epistemic toolkit comes first: everything downstream depends on knowing
        how we justify and calibrate belief."
      zh: 首要任务是建立认知工具箱：因为后续的一切内容，都取决于我们如何为信念辩护、又如何校准信念。
    days:
      - day: 1
        title:
          en: What Is Knowledge?
          zh: 知识是什么？
        entry:
          en: the "stopped clock" Gettier puzzle.
          zh: 即便停摆的大钟，每天也会准时两次——盖梯尔谜题。
        model:
          en: justified true belief and its failures.
          zh: 知识作为「证成的真信念」，及其失效的场景。
        debate:
          en: foundationalism vs coherentism vs reliabilism.
          zh: 基础主义 vs 融贯主义 vs 可靠主义。
        frontier:
          en: Bayesian epistemology and predictive-processing accounts of belief
            formation.
          zh: 贝叶斯认识论与预测加工框架下的信念形成模型。
      - day: 2
        title:
          en: The Scientific Method & Demarcation
          zh: 科学方法与划界问题
        entry:
          en: '"Will the sun rise tomorrow?"'
          zh: 太阳明天还会如期升起吗？
        model:
          en: hypothesis–prediction–test.
          zh: 假设—预测—检验的循环。
        debate:
          en: Popper's falsification vs Kuhn's paradigms vs Lakatos's research programs.
          zh: 波普尔的证伪主义 vs 库恩的范式革命 vs 拉卡托斯的研究纲领。
        frontier:
          en: the replication crisis as a real-world demarcation stress test.
          zh: 复现危机：一场真实而严酷的划界试炼。
      - day: 3
        title:
          en: Logic & Valid Inference
          zh: 逻辑与有效推理
        entry:
          en: syllogisms and everyday fallacies.
          zh: 三段论与日常生活中的逻辑陷阱。
        model:
          en: deduction vs induction vs abduction.
          zh: 演绎、归纳与溯因：三种推理引擎。
        debate:
          en: is logic discovered or invented?
          zh: 逻辑是发现还是发明？
        frontier:
          en: non-classical logics and machine-checked formal verification.
          zh: 非经典逻辑与机器辅助的形式验证。
      - day: 4
        title:
          en: Probability as Extended Logic
          zh: 概率成为逻辑的扩展
        entry:
          en: the Monty Hall problem.
          zh: 蒙提霍尔问题与直觉的翻车。
        model:
          en: Bayes' theorem as belief updating.
          zh: 贝叶斯定理：信念更新的运动定律。
        debate:
          en: frequentist vs Bayesian interpretations.
          zh: 频率派 vs 贝叶斯派诠释。
        frontier:
          en: e-values and the modern reform of statistical inference.
          zh: e 值与针对 p 值的「静默兵变」。
      - day: 5
        title:
          en: Causation
          zh: 因果性
        entry:
          en: ice cream sales and drowning correlate.
          zh: 冰淇淋、溺水与隐形的指挥家。
        model:
          en: confounders and counterfactuals.
          zh: 混杂因素、反事实与因果之梯。
        debate:
          en: can causation be inferred from observation alone?
          zh: 因果性能否仅从观察中推断？
        frontier:
          en: Pearl's do-calculus and algorithmic causal discovery.
          zh: 珀尔的 do-演算与因果发现的算法化。
      - day: 6
        title:
          en: Statistics & the Art of Not Fooling Yourself
          zh: 统计学与避免自欺的艺术
        entry:
          en: p-hacking a coin flip.
          zh: 抛硬币游戏中的 p 值操控。
        model:
          en: sampling, effect sizes, confidence intervals.
          zh: 抽样、效应量、置信区间。
        debate:
          en: null-hypothesis testing vs estimation.
          zh: 零假设显著性检验 vs 估计思维。
        frontier:
          en: 2024–25 multiverse and specification-curve analyses.
          zh: 2024–25 年兴起的多元宇宙分析与规范曲线分析。
      - day: 7
        title:
          en: Information Theory
          zh: 信息论
        entry:
          en: the game of 20 questions.
          zh: 二十个问题游戏。
        model:
          en: Shannon entropy, bits, channel capacity.
          zh: 香农熵、比特、信道容量。
        debate:
          en: is information physical?
          zh: 信息是物理的吗？
        frontier:
          en: information thermodynamics and Landauer's principle (previewing the
            physics-of-life arc).
          zh: 信息热力学与兰道尔原理（为生命的物理弧线埋下伏笔）。
      - day: 8
        title:
          en: Complexity & Emergence
          zh: 复杂性与涌现
        entry:
          en: a murmuration of starlings.
          zh: 椋鸟群的集体舞步。
        model:
          en: emergence and self-organization.
          zh: 涌现与自组织。
        debate:
          en: strong vs weak emergence.
          zh: 强涌现 vs 弱涌现。
        frontier:
          en: assembly and complexity measures — flag Assembly Theory as [CONTESTED], not
            established.
          zh: 组装与复杂性测度——注意将 Assembly Theory 标为 [有争议／炒作风险]，而非已确立。
      - day: 9
        title:
          en: Systems Thinking & Feedback
          zh: 系统思维与反馈
        entry:
          en: a household thermostat.
          zh: 家用恒温器。
        model:
          en: stocks, flows, feedback loops, nonlinearity.
          zh: 存量、流量、反馈回路与非线性。
        debate:
          en: reductionism vs holism.
          zh: 还原论 vs 整体论。
        frontier:
          en: tipping points in coupled systems (previewing climate).
          zh: 耦合系统中的临界点（为气候主题埋下伏笔）。
      - day: 10
        title:
          en: Models, Maps & Idealization
          zh: 模型、地图与理想化
        entry:
          en: '"the map is not the territory."'
          zh: 地图不等于疆域。
        model:
          en: all models are wrong, some are useful.
          zh: 所有模型都是错的，但有些很有用。
        debate:
          en: scientific realism vs instrumentalism.
          zh: 科学实在论 vs 工具主义。
        frontier:
          en: the epistemology of simulations and digital twins.
          zh: 模拟与数字孪生的认识论。
      - day: 11
        title:
          en: Heuristics, Biases & Rationality
          zh: 启发式、偏差与理性
        entry:
          en: the Linda "bank teller" problem.
          zh: 琳达「银行出纳员」问题。
        model:
          en: System 1/System 2 (with caveats).
          zh: 系统 1 / 系统 2 双过程模型。
        debate:
          en: are heuristics flaws or adaptive shortcuts?
          zh: 启发式是认知缺陷，还是适应性的捷径？
        frontier:
          en: the "rationality wars" and ecological rationality.
          zh: 「理性战争」与生态理性。
      - day: 12
        title:
          en: Networks
          zh: 网络
        entry:
          en: six degrees of separation.
          zh: 六度分隔。
        model:
          en: nodes, hubs, power laws, contagion.
          zh: 节点、枢纽、幂律与传播。
        debate:
          en: the scale-free network controversy.
          zh: 无标度网络争议。
        frontier:
          en: network neuroscience and epidemic modeling.
          zh: 网络神经科学与流行病建模。
      - day: 13
        title:
          en: Measurement & Units
          zh: 测量与单位
        entry:
          en: how long is a meter, really?
          zh: 一米到底有多长？
        model:
          en: operational definitions and the 2019 SI redefinition.
          zh: 操作定义与 2019 年国际单位制重定义。
        debate:
          en: are the constants truly constant?
          zh: 基本常数真的恒定吗？
        frontier:
          en: metrology and tests of fundamental-constant variation.
          zh: 计量学与基本常数变化的检验。
      - day: 14
        title:
          en: "Synthesis: How We Know"
          zh: 综合：我们如何知道
        note:
          en: Review the epistemic toolkit; build a personal "confidence calibration"
            framework to apply for the rest of the course.
          zh: 回顾认知工具，建立个人的「置信度校准」框架， 并将其应用于后续课程。
  - id: II
    start_day: 15
    end_day: 30
    title:
      en: Mathematics & Formal Systems
      zh: 数学与形式系统
    summary:
      en: The formal languages in which physical and biological law are written, plus
        the proven limits of those languages.
      zh: 物理与生物定律所使用的形式语言，以及这些语言已被证明的极限。
    days:
      - day: 15
        title:
          en: Number
          zh: 数
        entry:
          en: counting and the invention of zero.
          zh: 计数与零的发明。
        model:
          en: naturals → integers → rationals → reals.
          zh: 自然数 → 整数 → 有理数 → 实数。
        debate:
          en: is mathematics invented or discovered (Platonism)?
          zh: 数学是被发明还是被发现的（柏拉图主义）？
        frontier:
          en: the "unreasonable effectiveness" of mathematics in physics.
          zh: 数学在物理中的「不合理的有效性」。
      - day: 16
        title:
          en: Prime Numbers & the Riemann Hypothesis
          zh: 素数与黎曼猜想
        entry:
          en: primes as the atoms of arithmetic.
          zh: 素数作为算术的原子。
        model:
          en: prime distribution and the zeta function.
          zh: 素数分布与 zeta 函数。
        debate:
          en: RH as the great open problem.
          zh: 黎曼猜想：一个伟大的开放问题。
        frontier:
          en: recent computational and analytic progress on zeros.
          zh: 零点计算与解析进展。
      - day: 17
        title:
          en: Geometry
          zh: 几何
        entry:
          en: the shortest path on a globe.
          zh: 球面上的最短路径。
        model:
          en: Euclidean axioms vs non-Euclidean curvature.
          zh: 欧几里得公理 vs 非欧几何与曲率。
        debate:
          en: is physical space flat?
          zh: 物理空间是平的吗？
        frontier:
          en: differential geometry as the language of general relativity.
          zh: 微分几何：广义相对论的语言。
      - day: 18
        title:
          en: Algebra & Symmetry
          zh: 代数与对称
        entry:
          en: a Rubik's cube.
          zh: 一个魔方。
        model:
          en: groups and invariants.
          zh: 群与不变量。
        debate:
          en: abstraction vs intuition.
          zh: 抽象 vs 直觉。
        frontier:
          en: Noether's theorem linking symmetry to conservation laws.
          zh: 诺特定理：对称与守恒律的联系。
      - day: 19
        title:
          en: Functions & Change
          zh: 函数与变化
        entry:
          en: filling a bathtub.
          zh: 给浴缸注水。
        model:
          en: rates, slopes, and the concept of a limit.
          zh: 速率、斜率与极限。
        debate:
          en: were infinitesimals ever rigorous?
          zh: 无穷小曾经严谨吗？
        frontier:
          en: foundations via epsilon-delta and nonstandard analysis.
          zh: 通过 epsilon-delta 与非标准分析奠定严格基础。
      - day: 20
        title:
          en: "Calculus I: The Derivative"
          zh: 微积分 I：导数
        entry:
          en: speedometer vs odometer.
          zh: 速度计与里程表。
        model:
          en: instantaneous rate of change.
          zh: 瞬时变化率。
        debate:
          en: the Newton–Leibniz priority dispute.
          zh: 牛顿—莱布尼茨优先权之争。
        frontier:
          en: automatic differentiation as the engine of deep learning.
          zh: 自动微分：深度学习的引擎。
      - day: 21
        title:
          en: "Calculus II: The Integral & FTC"
          zh: 微积分 II：积分与微积分基本定理
        entry:
          en: area as accumulated change.
          zh: 面积作为累积变化。
        model:
          en: the Fundamental Theorem linking derivative and integral.
          zh: 连接导数与积分的基本定理。
        debate:
          en: what does "area under a curve" really mean?
          zh: 「曲线下面积」到底意味着什么？
        frontier:
          en: measure theory and Lebesgue integration.
          zh: 测度论与勒贝格积分。
      - day: 22
        title:
          en: Differential Equations
          zh: 微分方程
        entry:
          en: population growth and decay.
          zh: 种群增长与衰减。
        model:
          en: ODEs as the laws of motion for nearly everything.
          zh: 常微分方程：几乎所有事物的运动定律。
        debate:
          en: determinism vs chaos.
          zh: 决定论与混沌。
        frontier:
          en: neural ODEs and scientific machine learning.
          zh: 神经 ODE 与科学机器学习。
      - day: 23
        title:
          en: Chaos & Nonlinear Dynamics
          zh: 混沌与非线性动力学
        entry:
          en: the butterfly effect.
          zh: 蝴蝶效应。
        model:
          en: sensitive dependence and strange attractors.
          zh: 敏感依赖与奇异吸引子。
        debate:
          en: the limits of predictability.
          zh: 可预测性的极限在哪里？
        frontier:
          en: data-driven dynamics and reservoir computing.
          zh: 数据驱动动力学与水库计算。
      - day: 24
        title:
          en: Probability & Randomness (Formal)
          zh: 概率与随机性（形式化）
        entry:
          en: the drunkard's random walk.
          zh: 醉汉的随机游走。
        model:
          en: distributions, the central limit theorem, Markov chains.
          zh: 分布、中心极限定理、马尔可夫链。
        debate:
          en: what is randomness?
          zh: 什么是随机性？
        frontier:
          en: Monte Carlo methods and probabilistic programming.
          zh: 蒙特卡洛方法与概率编程。
      - day: 25
        title:
          en: Statistics for Inference
          zh: 统计推断
        entry:
          en: polling a nation from a sample.
          zh: 从样本推断一个国家。
        model:
          en: estimators and regression.
          zh: 估计量与回归。
        debate:
          en: causal vs predictive modeling.
          zh: 因果建模 vs 预测建模。
        frontier:
          en: high-dimensional statistics and the double-descent phenomenon.
          zh: 高维统计与双降现象。
      - day: 26
        title:
          en: Infinity & Set Theory
          zh: 无穷与集合论
        entry:
          en: Hilbert's Hotel.
          zh: 希尔伯特旅馆。
        model:
          en: countable vs uncountable infinities; Cantor's diagonal argument.
          zh: 可数与不可数无穷；康托的对角线论证。
        debate:
          en: the continuum hypothesis.
          zh: 连续统假设。
        frontier:
          en: large cardinals and independence results.
          zh: 大基数与独立性结果。
      - day: 27
        title:
          en: Computation & Turing Machines
          zh: 计算与图灵机
        entry:
          en: a recipe a machine can follow.
          zh: 机器可以遵循的菜谱。
        model:
          en: algorithm and universal computation.
          zh: 算法与通用计算。
        debate:
          en: is the mind a computer?
          zh: 心智是一台计算机吗？
        frontier:
          en: why hypercomputation proposals are viewed skeptically.
          zh: 为何超计算提案需要谨慎对待。
      - day: 28
        title:
          en: "The Limits of Formal Systems: Gödel"
          zh: 形式系统的极限：哥德尔
        entry:
          en: '"this statement is unprovable."'
          zh: 此命题不可证。
        model:
          en: the incompleteness theorems.
          zh: 不完备定理。
        debate:
          en: their implications for mind and mathematics.
          zh: 对心智与数学的深远意涵。
        frontier:
          en: reverse mathematics and proof assistants like Lean.
          zh: 逆数学与 Lean 等证明助手。
      - day: 29
        title:
          en: P vs NP & Complexity Classes
          zh: P vs NP 与复杂性类
        entry:
          en: easy to check, hard to solve (a sudoku).
          zh: 易于验证，却难以求解（以数独为例）。
        model:
          en: tractability and NP-completeness.
          zh: 可解性与 NP 完备性。
        debate:
          en: does P = NP?
          zh: P = NP 吗？
        frontier:
          en: links to cryptography and 2024 AI-for-math (AlphaProof solved the hardest
            2024 IMO problem, which only 5 of 600+ human contestants fully
            solved). [ESTABLISHED]
          zh: 与密码学的联系，以及 2024 年 AI-for-math 进展（AlphaProof 解出 2024 IMO 最难一题， 600 余名人类选手中仅 5
            人完全解出）。[已确立]
      - day: 30
        title:
          en: "Synthesis: Math as a Tower"
          zh: 综合：数学作为一座塔
        note:
          en: Map the dependency tree of mathematics and preview how each tool powers
            physics.
          zh: 绘制数学的依赖树，并预览每种工具如何驱动物理学。
  - id: III
    start_day: 31
    end_day: 48
    title:
      en: "Physics: Classical to Quantum"
      zh: 物理：从经典到量子
    summary:
      en: The behavior of matter and energy, built intuition-first through multi-day
        relativity and quantum arcs.
      zh: 物质与能量的行为，以直觉为优先，用多日的相对论与量子弧线层层构建。
    days:
      - day: 31
        title:
          en: "Classical Mechanics: Newton"
          zh: 经典力学：牛顿
        entry:
          en: why a thrown ball arcs.
          zh: 抛出的球为何划出一道弧线。
        model:
          en: F = ma and conservation laws.
          zh: F = ma 与守恒律。
        debate:
          en: the puzzle of action-at-a-distance.
          zh: 超距作用的疑难。
        frontier:
          en: chaotic long-term instability of the solar system.
          zh: 太阳系长期的混沌不稳定性。
      - day: 32
        title:
          en: Lagrangian & Hamiltonian Mechanics
          zh: 拉格朗日力学与哈密顿力学
        entry:
          en: nature's "laziness" (least action).
          zh: 自然的「懒惰」：最小作用量原理。
        model:
          en: action principles and phase space.
          zh: 作用量原理与相空间。
        debate:
          en: are these mere reformulations or something deeper?
          zh: 这些只是重新表述，还是触及了更深层的实在？
        frontier:
          en: symplectic integrators and optimal control.
          zh: 辛积分器与最优控制。
      - day: 33
        title:
          en: "Thermodynamics: The Four Laws"
          zh: 热力学：四大定律
        entry:
          en: why coffee always cools.
          zh: 咖啡为何总会变凉。
        model:
          en: energy, entropy, temperature.
          zh: 能量、熵、温度。
        debate:
          en: the origin of the arrow of time.
          zh: 时间箭头的起源。
        frontier:
          en: "fluctuation theorems (previewing the physics-of-life deep dive). KEY
            THREAD: energy/entropy reappears in life, metabolism, economics."
          zh: 涨落定理（为生命的物理专题深入埋下伏笔）。关键线索：能量与熵在生命、 新陈代谢、经济学中反复出现。
      - day: 34
        title:
          en: Statistical Mechanics
          zh: 统计力学
        entry:
          en: from jiggling molecules to temperature.
          zh: 从抖动分子到温度。
        model:
          en: microstates and the Boltzmann distribution.
          zh: 微观状态与玻尔兹曼分布。
        debate:
          en: how does irreversibility emerge from reversible microscopic laws?
          zh: 不可逆性如何从可逆的微观定律中涌现？
        frontier:
          en: non-equilibrium statistical mechanics.
          zh: 非平衡统计力学。
      - day: 35
        title:
          en: Waves & Light
          zh: 波与光
        entry:
          en: ripples in a pond.
          zh: 池塘中的涟漪。
        model:
          en: superposition and interference.
          zh: 叠加与干涉。
        debate:
          en: the historical wave-vs-particle dispute.
          zh: 历史上的波粒之争。
        frontier:
          en: metamaterials and modern photonics.
          zh: 超材料与现代光子学。
      - day: 36
        title:
          en: "Electromagnetism: Maxwell"
          zh: 电磁学：麦克斯韦
        entry:
          en: a compass needle deflecting near a wire.
          zh: 指南针靠近导线时的偏转。
        model:
          en: fields and Maxwell's equations unifying electricity, magnetism, and light.
          zh: 场与麦克斯韦方程组统一电、磁、光。
        debate:
          en: the luminiferous ether.
          zh: 光以太。
        frontier:
          en: why electromagnetic symmetry forced relativity.
          zh: 电磁对称性如何迫使相对论诞生。
      - day: 37
        title:
          en: Special Relativity I
          zh: 狭义相对论 I
        entry:
          en: the train-and-lightning thought experiment.
          zh: 火车与闪电思想实验。
        model:
          en: the constancy of c and the relativity of simultaneity.
          zh: c 的恒定性与同时性的相对性。
        debate:
          en: is time real?
          zh: 时间是真实的吗？
        frontier:
          en: precision tests of Lorentz invariance.
          zh: 洛伦兹不变性的精密检验。
      - day: 38
        title:
          en: "Special Relativity II: E=mc²"
          zh: 狭义相对论 II：E=mc²
        entry:
          en: mass as frozen energy.
          zh: 质量作为冻结的能量。
        model:
          en: spacetime and four-vectors.
          zh: 时空与四矢量。
        debate:
          en: interpretations of relativistic mass.
          zh: 相对论性质量的诠释。
        frontier:
          en: applications in particle physics.
          zh: 粒子物理中的应用。
      - day: 39
        title:
          en: General Relativity I
          zh: 广义相对论 I
        entry:
          en: a bowling ball on a trampoline.
          zh: 蹦床上的保龄球。
        model:
          en: gravity as the curvature of spacetime.
          zh: 引力作为时空弯曲。
        debate:
          en: Einstein vs Newton.
          zh: 爱因斯坦 vs 牛顿。
        frontier:
          en: gravitational-wave astronomy from 2015 to today (LIGO/Virgo/KAGRA).
            [ESTABLISHED]
          zh: 2015 年至今的引力波天文学（LIGO/Virgo/KAGRA）。[已确立]
      - day: 40
        title:
          en: "General Relativity II: Black Holes"
          zh: 广义相对论 II：黑洞
        entry:
          en: light that cannot escape.
          zh: 光无法逃逸之处。
        model:
          en: event horizons and singularities.
          zh: 事件视界与奇点。
        debate:
          en: the information paradox.
          zh: 信息悖论。
        frontier:
          en: the 2019/2022 Event Horizon Telescope images and black-hole thermodynamics.
            [ESTABLISHED]
          zh: 2019/2022 年事件视界望远镜图像与黑洞热力学。[已确立]
      - day: 41
        title:
          en: "Quantum Mechanics I: The Quantum Leap"
          zh: 量子力学 I：量子跃迁
        entry:
          en: why atoms don't collapse.
          zh: 原子为何不会坍缩。
        model:
          en: quantization and the wavefunction.
          zh: 量子化与波函数。
        debate:
          en: was nature really discrete?
          zh: 自然真的是离散的吗？
        frontier:
          en: setting up the measurement problem.
          zh: 为测量问题搭建舞台。
      - day: 42
        title:
          en: "Quantum Mechanics II: Superposition & the Double Slit"
          zh: 量子力学 II：叠加与双缝
        entry:
          en: one particle through two slits.
          zh: 一个粒子同时穿过两条缝。
        model:
          en: probability amplitudes and the Born rule.
          zh: 概率幅与玻恩定则。
        debate:
          en: what physically counts as a "measurement"?
          zh: 什么在物理上算一次「测量」？
        frontier:
          en: macroscopic superposition experiments.
          zh: 宏观叠加实验。
      - day: 43
        title:
          en: "Quantum Mechanics III: Entanglement & Bell"
          zh: 量子力学 III：纠缠与贝尔
        entry:
          en: Einstein's "spooky action at a distance."
          zh: 爱因斯坦的「幽灵般的超距作用」。
        model:
          en: entanglement and Bell inequalities.
          zh: 纠缠与贝尔不等式。
        debate:
          en: locality vs realism.
          zh: 定域性 vs 实在论。
        frontier:
          en: the 2022 Nobel (Aspect, Clauser, Zeilinger) and loophole-free Bell tests.
            [ESTABLISHED]
          zh: 2022 年诺贝尔奖（阿斯佩、克劳泽、蔡林格）与无漏洞贝尔检验。[已确立]
      - day: 44
        title:
          en: Quantum Interpretations
          zh: 量子诠释
        entry:
          en: is Schrödinger's cat alive or dead?
          zh: 薛定谔的猫到底是死是活？
        model:
          en: Copenhagen, Many-Worlds, pilot-wave, QBism.
          zh: 哥本哈根、多世界、导波、QBism。
        debate:
          en: which (if any) is testable?
          zh: 哪一个（如果有的话）是可检验的？
        frontier:
          en: objective-collapse models under experimental test.
          zh: 客观坍缩模型正在经受实验检验。
      - day: 45
        title:
          en: Quantum Field Theory & the Standard Model
          zh: 量子场论与标准模型
        entry:
          en: particles as ripples in underlying fields.
          zh: 粒子作为底层场中的涟漪。
        model:
          en: gauge symmetry and the particle zoo.
          zh: 规范对称与粒子动物园。
        debate:
          en: the naturalness/hierarchy problem.
          zh: 自然性/等级问题。
        frontier:
          en: precision Higgs measurements.
          zh: 精密希格斯测量。
      - day: 46
        title:
          en: The Muon g-2 Story
          zh: 缪子 g-2 的故事
        entry:
          en: a wobbling magnetic top.
          zh: 一个摇摆的磁陀螺。
        model:
          en: how virtual particles tweak the muon's magnetism.
          zh: 虚粒子如何微调缪子的磁性。
        debate:
          en: the decade-long anomaly that seemed to point beyond the Standard Model.
          zh: 长达十年、看似指向标准模型之外的异常。
        frontier:
          en: the June 3, 2025 Fermilab final result (aμ to 127 ppb) + the 2025 Theory
            Initiative white paper (switched to lattice-QCD for hadronic vacuum
            polarization) now show NO significant tension with the Standard
            Model. [ESTABLISHED — "new physics" interpretation now SUPERSEDED.]
          zh: 2025 年 6 月 3 日费米实验室最终结果（aμ 达 127 ppb），加上 2025 年理论倡议白皮书 改用格点 QCD
            计算强子真空极化，现在显示与标准模型无显著张力。 [已确立——「新物理」诠释已被取代。]
      - day: 47
        title:
          en: Quantum Computing
          zh: 量子计算
        entry:
          en: exploring many paths at once (state carefully).
          zh: 同时探索多条路径。
        model:
          en: qubits, superposition, decoherence, error correction.
          zh: 量子比特、叠加、退相干、纠错。
        debate:
          en: practical advantage vs hype.
          zh: 实际优势 vs 炒作。
        frontier:
          en: Google's "Willow" 105-qubit chip — error rates that FALL as qubits are
            added, demonstrating below-threshold error correction (Nature, Dec
            2024). [ESTABLISHED milestone; commercial advantage still distant.]
          zh: Google「Willow」105 量子比特芯片——错误率随量子比特增加而下降， 展示低于阈值的纠错（Nature，2024 年 12
            月）。[已确立里程碑；商业优势仍遥远。]
      - day: 48
        title:
          en: "Synthesis: The Two Pillars"
          zh: 综合：两大支柱
        note:
          en: Why relativity and quantum theory still don't unify; preview the
            quantum-gravity problem.
          zh: 为何相对论与量子理论仍未统一；预览量子引力问题。
  - id: IV
    start_day: 49
    end_day: 62
    title:
      en: "Cosmology & Astrophysics + DEEP DIVE 1: The Hubble Tension"
      zh: 宇宙学与天体物理 + 专题深入 1：哈勃张力
    summary:
      en: The universe at large, descending into precision cosmology's biggest crisis.
      zh: 大尺度宇宙，以及精确宇宙学当前最大的危机——哈勃张力。
    days:
      - day: 49
        title:
          en: The Sky as a Time Machine
          zh: 天空作为时间机器
        entry:
          en: starlight is the past.
          zh: 每缕星光都是一封来自过去的信。
        model:
          en: light-years and lookback time.
          zh: 光年与回望时间。
        debate:
          en: how do we actually measure distances?
          zh: 我们如何实际测量距离？
        frontier:
          en: multi-messenger astronomy.
          zh: 多信使天文学。
      - day: 50
        title:
          en: The Cosmic Distance Ladder
          zh: 宇宙距离阶梯
        entry:
          en: judging distance by apparent brightness.
          zh: 以视亮度判断距离。
        model:
          en: parallax → Cepheids → Type Ia supernovae.
          zh: 视差 → 造父变星 → Ia 型超新星。
        debate:
          en: calibration systematics.
          zh: 校准中的系统误差。
        frontier:
          en: JWST recalibrations of each ladder rung.
          zh: JWST 对每一级阶梯的重新校准。
      - day: 51
        title:
          en: The Expanding Universe
          zh: 膨胀的宇宙
        entry:
          en: raisins in rising dough.
          zh: 发酵面团中的葡萄干。
        model:
          en: Hubble's law, redshift, the scale factor.
          zh: 哈勃定律、红移、尺度因子。
        debate:
          en: what is it that "expands"?
          zh: 什么在「膨胀」？
        frontier:
          en: the Hubble-constant problem (setting up the deep dive).
          zh: 哈勃常数问题（为专题深入铺垫）。
      - day: 52
        title:
          en: The Big Bang & the CMB
          zh: 大爆炸与宇宙微波背景
        entry:
          en: the universe's baby photo.
          zh: 宇宙的婴儿照片。
        model:
          en: a hot, dense origin, recombination, and the cosmic microwave background.
          zh: 炽热致密起源、复合与宇宙微波背景。
        debate:
          en: Big Bang vs discarded alternatives.
          zh: 大爆炸 vs 已被抛弃的替代方案。
        frontier:
          en: Planck and ACT precision cosmology.
          zh: 普朗克与 ACT 精确宇宙学。
      - day: 53
        title:
          en: "DEEP DIVE 1: The Hubble Tension — Two Numbers"
          zh: 专题深入 1：哈勃张力——两个数字
        entry:
          en: 67 versus 73.
          zh: 67 对 73。
        model:
          en: early-universe value, Planck 2018 ΛCDM H0 = 67.4 ± 0.5 km/s/Mpc (Planck
            Collaboration VI), vs late-universe distance ladder, SH0ES H0 =
            73.04 ± 1.04 km/s/Mpc (Riess et al. 2022).
          zh: 早期宇宙值：Planck 2018 ΛCDM 给出 H0 = 67.4 ± 0.5 km/s/Mpc（Planck Collaboration VI）；
            晚期宇宙距离阶梯：SH0ES 给出 H0 = 73.04 ± 1.04 km/s/Mpc（Riess et al. 2022）。
        debate:
          en: measurement error vs new physics.
          zh: 测量误差 vs 新物理。
        frontier:
          en: discrepancy now ~5σ. [ESTABLISHED that the tension exists; cause
            unresolved.]
          zh: 差异现已达约 5σ。[已确立张力存在；原因未解。]
      - day: 54
        title:
          en: "Hubble Tension: The Distance-Ladder Defense"
          zh: 哈勃张力：距离阶梯的辩护
        entry:
          en: is dust or crowding fooling us?
          zh: 尘埃或拥挤是否在欺骗我们？
        model:
          en: the SH0ES methodology.
          zh: SH0ES 方法论。
        debate:
          en: are Cepheids contaminated by crowding/dust?
          zh: 造父变星是否受到拥挤或尘埃污染？
        frontier:
          en: 2024 JWST Cepheid observations reject unrecognized crowding at 8σ; the local
            value near 73 holds firm. [ESTABLISHED]
          zh: 2024 年 JWST 造父变星观测在 8σ 水平上排除未被识别的拥挤；本地值接近 73 依然坚挺。[已确立]
      - day: 55
        title:
          en: "Hubble Tension: The Early-Universe Camp"
          zh: 哈勃张力：早期宇宙阵营
        entry:
          en: a cosmic ruler made of sound.
          zh: 用声音铸造的宇宙尺。
        model:
          en: the sound horizon and baryon acoustic oscillations.
          zh: 声视界与重子声学振荡。
        debate:
          en: is the ruler miscalibrated?
          zh: 这把尺是否校准错误？
        frontier:
          en: sound-horizon-free and inverse-distance-ladder methods.
          zh: 声视界无关方法与逆距离阶梯方法。
      - day: 56
        title:
          en: "Hubble Tension: TRGB & Independent Methods"
          zh: 哈勃张力：TRGB 与独立方法
        entry:
          en: a different kind of standard candle.
          zh: 一种不同的标准烛光。
        model:
          en: tip of the red giant branch (Freedman's CCHP).
          zh: 红巨星枝尖（Freedman 的 CCHP）。
        debate:
          en: does TRGB favor a lower, intermediate H0?
          zh: TRGB 是否倾向于更低的中间 H0？
        frontier:
          en: 2025 JWST TRGB calibrations and their disagreements with Cepheids.
            [CONTESTED — methods disagree.]
          zh: 2025 年 JWST TRGB 校准及其与造父变星的分歧。[有争议／炒作风险——方法之间有分歧。]
      - day: 57
        title:
          en: "Hubble Tension: Proposed New Physics"
          zh: 哈勃张力：提议的新物理
        entry:
          en: a brief extra push early on.
          zh: 早期一次短暂的额外推动。
        model:
          en: early dark energy.
          zh: 早期暗能量。
        debate:
          en: does it fit all datasets at once?
          zh: 它是否同时拟合所有数据集？
        frontier:
          en: EDE constraints and tension with large-scale-structure data. [PROMISING
            HINT, not established.]
          zh: EDE 约束与大规模结构数据的张力。[有前景，尚未确立。]
      - day: 58
        title:
          en: "Hubble Tension: Time-Delay Cosmography"
          zh: 哈勃张力：时间延迟宇宙学
        entry:
          en: a cosmic stopwatch from lensed quasars.
          zh: 来自透镜类星体的宇宙停表。
        model:
          en: strong-lensing time delays (H0LiCOW/TDCOSMO).
          zh: 强透镜时间延迟（H0LiCOW/TDCOSMO）。
        debate:
          en: the mass-sheet degeneracy.
          zh: 质量片退化。
        frontier:
          en: JWST lensing time-delay programs as an independent ladder-free probe.
          zh: JWST 透镜时间延迟项目作为独立的、无阶梯的探针。
      - day: 59
        title:
          en: DESI & Evolving Dark Energy
          zh: DESI 与演化的暗能量
        entry:
          en: the largest 3D map of the universe ever made.
          zh: 有史以来最大的宇宙三维地图。
        model:
          en: baryon acoustic oscillations over 11 billion years.
          zh: 110 亿年间的重子声学振荡。
        debate:
          en: is dark energy a true constant?
          zh: 暗能量真的是常数吗？
        frontier:
          en: DESI DR2 (March 19, 2025) shows 3.1σ preference for evolving dark energy
            with Planck, ~4σ with some supernova samples (Union3, DES), ~2.5σ
            with Pantheon+ — strongly sample-dependent, below 5σ. [PROMISING
            HINT — treat as a hint, not a result.]
          zh: DESI DR2（2025 年 3 月 19 日）显示，在 Planck 先验下对演化暗能量有 3.1σ 偏好，
            在某些超新星样本（Union3、DES）下约 4σ，在 Pantheon+ 下约 2.5σ—— 结果强烈依赖样本选择，且低于
            5σ。[有前景——当作线索，而非结果。]
      - day: 60
        title:
          en: Dark Matter
          zh: 暗物质
        entry:
          en: galaxies that spin too fast to hold together.
          zh: 星系转得太快，无法仅靠可见物质维系自身。
        model:
          en: rotation curves, gravitational lensing, the Bullet Cluster.
          zh: 旋转曲线、引力透镜、子弹星系团。
        debate:
          en: particle dark matter vs modified gravity (MOND).
          zh: 粒子暗物质 vs 修正引力（MOND）。
        frontier:
          en: continued direct-detection null results as of 2026.
          zh: 截至 2026 年持续的直接探测零结果。
      - day: 61
        title:
          en: JWST & Early-Universe Surprises
          zh: JWST 与早期宇宙惊喜
        entry:
          en: galaxies that look too big, too soon.
          zh: 星系看起来太大、出现得太早。
        model:
          en: high-redshift galaxy formation.
          zh: 高红移星系形成。
        debate:
          en: do early massive galaxies break ΛCDM?
          zh: 早期大质量星系是否打破 ΛCDM？
        frontier:
          en: 2023–25 JWST spectroscopic confirmations and proposed resolutions (efficient
            star formation, not necessarily new physics). [PROMISING HINT —
            likely resolvable within ΛCDM.]
          zh: 2023–25 年 JWST 光谱证认与提出的解释（高效恒星形成，未必是新物理）。 [有前景——很可能在 ΛCDM 内可解。]
      - day: 62
        title:
          en: Astrobiology & Biosignatures
          zh: 天体生物学与生物信号
        entry:
          en: are we alone?
          zh: 我们孤独吗？
        model:
          en: habitable zones and biosignature gases.
          zh: 宜居带与生物信号气体。
        debate:
          en: the K2-18b dimethyl-sulfide claim (Madhusudhan et al. 2025) reached only ~3σ
            and was rebutted by multiple independent reanalyses (Luque et al.,
            Welbanks et al., Taylor 2025) finding "insufficient evidence"; NOT
            evidence of life.
          zh: K2-18b 二甲基硫主张（Madhusudhan et al. 2025）仅达约 3σ， 并被 Luque et al.、Welbanks et
            al.、Taylor 2025 等多项独立再分析反驳为「证据不足」； 并非生命证据。
        frontier:
          en: formal astrobiology standards-of-evidence frameworks. [CONTESTED/HYPE.]
          zh: 正式天体生物学证据标准框架。[有争议／炒作风险。]
  - id: V
    start_day: 63
    end_day: 72
    title:
      en: Chemistry & Materials
      zh: 化学与材料
    summary:
      en: How atoms combine into the stuff of the world and of life.
      zh: 原子如何结合，构成世界与生命的物质。
    days:
      - day: 63
        title:
          en: The Atom
          zh: 原子
        entry:
          en: the Lego bricks of matter.
          zh: 物质的乐高积木。
        model:
          en: nucleus plus electron orbitals.
          zh: 原子核与电子轨道。
        debate:
          en: the Bohr model vs the full quantum picture.
          zh: 玻尔模型 vs 完整量子图像。
        frontier:
          en: attosecond imaging of electron motion (2023 Nobel in Physics). [ESTABLISHED]
          zh: 阿秒电子运动成像（2023 年诺贝尔物理学奖）。[已确立]
      - day: 64
        title:
          en: The Periodic Table
          zh: 元素周期表
        entry:
          en: an address system for the elements.
          zh: 元素的地址系统。
        model:
          en: periodicity arising from electron shells.
          zh: 周期性源于电子壳层。
        debate:
          en: disputes over element placement (e.g., group 3, hydrogen).
          zh: 元素排位的争议（如第 3 族、氢）。
        frontier:
          en: synthesis of superheavy elements and the "island of stability."
          zh: 超重元素合成与「稳定岛」。
      - day: 65
        title:
          en: Chemical Bonding
          zh: 化学键
        entry:
          en: why salt and water behave so differently.
          zh: 为何盐与水的行为如此不同？
        model:
          en: ionic, covalent, and metallic bonds.
          zh: 离子键、共价键与金属键。
        debate:
          en: is "the bond" a real entity or bookkeeping?
          zh: 「键」是真实实体，还是一种记账方式？
        frontier:
          en: quantum chemistry and density functional theory.
          zh: 量子化学与密度泛函理论。
      - day: 66
        title:
          en: Reactions, Energy & Equilibrium
          zh: 反应、能量与平衡
        entry:
          en: fire and rust.
          zh: 火与锈。
        model:
          en: thermodynamics plus kinetics; catalysis.
          zh: 热力学与动力学；催化。
        debate:
          en: controlling reaction pathways.
          zh: 控制反应路径。
        frontier:
          en: machine-learned catalyst discovery.
          zh: 机器学习催化剂发现。
      - day: 67
        title:
          en: Organic Chemistry & the Chemistry of Carbon
          zh: 有机化学与碳的化学
        entry:
          en: why carbon is life's scaffold.
          zh: 碳为何是生命的脚手架。
        model:
          en: functional groups and isomerism.
          zh: 官能团与异构。
        debate:
          en: synthetic vs natural products.
          zh: 合成产物 vs 天然产物。
        frontier:
          en: automated retrosynthesis planning.
          zh: 自动化逆合成规划。
      - day: 68
        title:
          en: Water & Acids/Bases
          zh: 水与酸碱
        entry:
          en: why water is such a weird substance.
          zh: 水——最不像普通液体的液体。
        model:
          en: pH and hydrogen bonding.
          zh: pH 与氢键。
        debate:
          en: water's structural anomalies.
          zh: 水的结构异常。
        frontier:
          en: ongoing controversies over liquid water's microstructure.
          zh: 液态水微观结构的持续争议。
      - day: 69
        title:
          en: Materials Science
          zh: 材料科学
        entry:
          en: why steel outperforms pure iron.
          zh: 钢为何优于纯铁。
        model:
          en: crystal structure, defects, and phases.
          zh: 晶体结构、缺陷与相。
        debate:
          en: rational design vs serendipitous discovery.
          zh: 理性设计 vs 偶然发现。
        frontier:
          en: 2023–24 AI-driven materials discovery (DeepMind's GNoME).
          zh: 2023–24 年 AI 驱动材料发现（DeepMind 的 GNoME）。
      - day: 70
        title:
          en: Superconductivity & a Cautionary Tale
          zh: 超导与一个警示故事
        entry:
          en: a magnet levitating over a cooled disk.
          zh: 磁铁悬浮于冷却盘之上。
        model:
          en: Cooper pairs and BCS theory.
          zh: 库珀对与 BCS 理论。
        debate:
          en: the dream of a room-temperature superconductor.
          zh: 室温超导的梦想。
        frontier:
          en: LK-99 (2023) was conclusively shown NOT to be a superconductor — a case
            study in hype, failed replication, and how science self-corrects.
            [CONTESTED/HYPE → DEBUNKED. Keep as a cautionary lesson.]
          zh: LK-99（2023）已被确凿证明不是超导体——炒作、复现失败与科学自我纠正的案例研究。 [有争议／炒作风险 → 已证伪。保留为警示课程。]
      - day: 71
        title:
          en: Green & Computational Chemistry
          zh: 绿色与计算化学
        entry:
          en: chemistry that minimizes waste.
          zh: 少造废弃物的化学。
        model:
          en: atom economy, catalysis, simulation-first design.
          zh: 原子经济性、催化、模拟优先设计。
        debate:
          en: scalability of green methods.
          zh: 绿色方法的可扩展性。
        frontier:
          en: electro- and photochemistry for decarbonization.
          zh: 电化学与光化学用于脱碳。
      - day: 72
        title:
          en: "Synthesis: From Atoms to Stuff"
          zh: 综合：从原子到物质
        note:
          en: How chemistry bridges physics and biology; preview the molecules of life.
          zh: 化学如何桥接物理与生物；预览生命的分子。
  - id: VI
    start_day: 73
    end_day: 92
    title:
      en: "Biology & Evolution + DEEP DIVE 2: The Physics of Life"
      zh: 生物与进化 + 专题深入 2：生命的物理
    summary:
      en: What life is and how it might have begun, grounded in thermodynamics.
      zh: 生命是什么、它如何可能开始——以热力学为根基。
    days:
      - day: 73
        title:
          en: What Is Life?
          zh: 什么是生命？
        entry:
          en: is a virus alive?
          zh: 病毒算活着吗？
        model:
          en: metabolism, replication, homeostasis.
          zh: 新陈代谢、复制、稳态。
        debate:
          en: the definition problem.
          zh: 定义问题。
        frontier:
          en: synthetic minimal cells; flag Assembly Theory as a [CONTESTED] attempt at a
            general definition.
          zh: 合成最小细胞；将 Assembly Theory 标为 [有争议／炒作风险] 的通用定义尝试。
      - day: 74
        title:
          en: Evolution by Natural Selection
          zh: 自然选择下的进化
        entry:
          en: Darwin's finches.
          zh: 达尔文的雀鸟。
        model:
          en: variation, heredity, differential survival.
          zh: 变异、遗传、差异存活。
        debate:
          en: gradualism vs punctuated equilibrium.
          zh: 渐进论 vs 间断平衡。
        frontier:
          en: "Lenski's Long-Term Evolution Experiment in real time. KEY THREAD:
            evolution/selection reappears in psychology, culture, AI.
            [ESTABLISHED]"
          zh: Lenski 长期进化实验仍在实时进行。关键线索：进化/选择这一主题 在心理学、文化、人工智能中反复出现。[已确立]
      - day: 75
        title:
          en: The Modern Synthesis & Beyond
          zh: 现代综合与超越
        entry:
          en: genes meet populations.
          zh: 基因遇见种群。
        model:
          en: population genetics and genetic drift.
          zh: 种群遗传学与遗传漂变。
        debate:
          en: is an "Extended Evolutionary Synthesis" needed?
          zh: 是否需要「扩展进化综合」？
        frontier:
          en: evo-devo and niche construction.
          zh: 进化发育生物学与生态位构建。
      - day: 76
        title:
          en: The Cell
          zh: 细胞
        entry:
          en: a city in miniature.
          zh: 一座微型城市。
        model:
          en: membranes, organelles, prokaryote vs eukaryote.
          zh: 膜、细胞器、原核 vs 真核。
        debate:
          en: the origin of eukaryotic complexity.
          zh: 真核复杂性的起源。
        frontier:
          en: cryo-EM visualization of cellular machinery.
          zh: 冷冻电镜下的细胞机器可视化。
      - day: 77
        title:
          en: "Molecular Machinery: DNA → RNA → Protein"
          zh: 分子机器：DNA → RNA → 蛋白质
        entry:
          en: the recipe-to-machine pipeline.
          zh: 从食谱到机器的流水线。
        model:
          en: the central dogma.
          zh: 中心法则。
        debate:
          en: how "central" is it really?
          zh: 它有多「中心」？
        frontier:
          en: "the expanding regulatory roles of RNA. THREAD: information."
          zh: RNA 扩展的调控角色。线索：信息。
      - day: 78
        title:
          en: Proteins & Folding
          zh: 蛋白质与折叠
        entry:
          en: origami that performs work.
          zh: 会干活的分子折纸。
        model:
          en: sequence → structure → function.
          zh: 序列 → 结构 → 功能。
        debate:
          en: the protein-folding problem.
          zh: 蛋白质折叠问题。
        frontier:
          en: AlphaFold 2/3 (2024) predicting structures of proteins AND their complexes
            with DNA, RNA, ligands. [ESTABLISHED]
          zh: AlphaFold 2/3（2024）预测蛋白质及其与 DNA、RNA、配体的复合物结构。 [已确立]
      - day: 79
        title:
          en: Metabolism & Bioenergetics
          zh: 新陈代谢与生物能量学
        entry:
          en: how a cell earns its living.
          zh: 细胞如何谋生。
        model:
          en: ATP, electron transport, chemiosmosis.
          zh: ATP、电子传递、化学渗透。
        debate:
          en: metabolism-first vs genes-first origins.
          zh: 新陈代谢优先 vs 基因优先起源。
        frontier:
          en: "the bioenergetics of life's origin. THREAD: energy."
          zh: 生命起源的生物能量学。线索：能量。
      - day: 80
        title:
          en: Development
          zh: 发育
        entry:
          en: one cell becomes a whole organism.
          zh: 一个细胞变成整个生物体。
        model:
          en: gene regulatory networks and morphogen gradients.
          zh: 基因调控网络与形态发生素梯度。
        debate:
          en: the nature of the body plan.
          zh: 身体计划的本质。
        frontier:
          en: synthetic embryos/embryoids (2023–24).
          zh: 合成胚胎/胚状体（2023–24）。
      - day: 81
        title:
          en: Ecology & Ecosystems
          zh: 生态与生态系统
        entry:
          en: a food web.
          zh: 食物网。
        model:
          en: energy flow, niches, succession.
          zh: 能量流、生态位、演替。
        debate:
          en: the "balance of nature" myth.
          zh: 「自然平衡」神话。
        frontier:
          en: ecological tipping points and rewilding science.
          zh: 生态临界点与再野化科学。
      - day: 82
        title:
          en: The Microbiome
          zh: 微生物组
        entry:
          en: you are, by cell count, mostly microbes.
          zh: 按细胞计数，你大多是微生物。
        model:
          en: host–microbe symbiosis.
          zh: 宿主—微生物共生。
        debate:
          en: distinguishing correlation from causation in microbiome claims.
          zh: 在微生物组主张中区分相关与因果。
        frontier:
          en: "2023–25 causal microbiome–disease studies (gnotobiotic and FMT work). [Mix:
            some ESTABLISHED, much PROMISING HINT.]"
          zh: 2023–25 年因果微生物组—疾病研究（无菌与 FMT 工作）。 [混合：部分已确立，大量有前景线索。]
      - day: 83
        title:
          en: "DEEP DIVE 2: Entropy & the Puzzle of Life"
          zh: 专题深入 2：熵与生命之谜
        entry:
          en: life seems to defy disorder.
          zh: 生命似乎违抗无序。
        model:
          en: Schrödinger's "negative entropy"; living things as open systems exporting
            entropy.
          zh: 薛定谔的「负熵」；生命作为开放系统输出熵。
        debate:
          en: does life violate the second law (no)?
          zh: 生命违反第二定律吗（不）？
        frontier:
          en: "framing life through information thermodynamics. THREAD: energy +
            information converge."
          zh: 用信息热力学框架理解生命。线索：能量与信息的交汇。
      - day: 84
        title:
          en: Far-From-Equilibrium Thermodynamics
          zh: 远离平衡态的热力学
        entry:
          en: a whirlpool that sustains its own shape.
          zh: 一个维持自身形状的漩涡。
        model:
          en: Prigogine's dissipative structures.
          zh: 普里高津的耗散结构。
        debate:
          en: how general are such structures?
          zh: 这类结构有多普遍？
        frontier:
          en: non-equilibrium steady states and pattern formation.
          zh: 非平衡稳态与模式形成。
      - day: 85
        title:
          en: Fluctuation Theorems & Landauer's Principle
          zh: 涨落定理与兰道尔原理
        entry:
          en: the energy cost of forgetting.
          zh: 遗忘的能量代价。
        model:
          en: the Jarzynski and Crooks relations; erasing one bit costs at least kT·ln2.
          zh: Jarzynski 与 Crooks 关系；擦除一比特至少耗费 kT·ln2。
        debate:
          en: is Maxwell's demon finally exorcised?
          zh: 麦克斯韦妖终于被驱除了吗？
        frontier:
          en: single-molecule and bit-erasure experiments confirming Landauer.
            [ESTABLISHED] Callback to Day 7.
          zh: 确认兰道尔的单分子与比特擦除实验。[已确立] 回调第 7 日。
      - day: 86
        title:
          en: Dissipative Adaptation
          zh: 耗散适应
        entry:
          en: matter that "tunes itself" to absorb energy.
          zh: 「调谐自身」以吸收能量的物质。
        model:
          en: Jeremy England's hypothesis that strongly driven matter self-organizes to
            dissipate energy.
          zh: Jeremy England 的假设：强驱动物质自组织以耗散能量。
        debate:
          en: an interesting and active idea, but explicitly [CONTESTED] — NOT an
            established origin-of-life theory.
          zh: 一个有趣且活跃的想法，但明确标记为 [有争议／炒作风险]—— 不是已确立的生命起源理论。
        frontier:
          en: supporting simulations and their critiques.
          zh: 支持性模拟及其批评。
      - day: 87
        title:
          en: "Abiogenesis: The RNA World"
          zh: 无生源说：RNA 世界
        entry:
          en: a molecule that is both gene and machine.
          zh: 一种既是基因又是机器的分子。
        model:
          en: RNA self-replication.
          zh: RNA 自复制。
        debate:
          en: RNA-first vs metabolism-first vs lipid-first.
          zh: RNA 优先 vs 新陈代谢优先 vs 脂质优先。
        frontier:
          en: recent ribozyme and protocell experiments.
          zh: 近期的核酶与原始细胞实验。
      - day: 88
        title:
          en: "Abiogenesis: Hydrothermal Vents & Geochemistry"
          zh: 无生源说：热液喷口与地球化学
        entry:
          en: life from rock and heat.
          zh: 生命来自岩石与热。
        model:
          en: alkaline vents and natural proton gradients.
          zh: 碱性喷口与自然质子梯度。
        debate:
          en: deep-sea vents vs Darwin's "warm little pond."
          zh: 深海喷口 vs 达尔文的「温暖的小池塘」。
        frontier:
          en: 2023–25 prebiotic chemistry results.
          zh: 2023–25 年前生命化学结果。
      - day: 89
        title:
          en: "Origin of Life: Compartments & Autocatalysis"
          zh: 生命起源：区室与自催化
        entry:
          en: a bubble that grows and divides.
          zh: 一个生长并分裂的气泡。
        model:
          en: protocells and autocatalytic sets.
          zh: 原始细胞与自催化集。
        debate:
          en: which subsystem bootstrapped first?
          zh: 哪个子系统首先自举？
        frontier:
          en: systems-chemistry experiments combining replication and
            compartmentalization.
          zh: 结合分子复制与区室化的系统化学实验。
      - day: 90
        title:
          en: "Origin of Life: Theories of Life Itself"
          zh: 生命起源：生命本身的理论
        entry:
          en: can "being alive" be defined as a physical process?
          zh: 「活着」能被定义为物理过程吗？
        model:
          en: autopoiesis and (flag) Assembly Theory.
          zh: 自创生与（标记）Assembly Theory。
        debate:
          en: is a general theory of life even possible?
          zh: 生命的普遍理论甚至可能存在吗？
        frontier:
          en: 2023–24 Assembly Theory papers and the substantial critiques from chemists
            and complexity scientists. [CONTESTED.]
          zh: 2023–24 年 Assembly Theory 论文及化学家与复杂性科学家的实质性批评。 [有争议／炒作风险。]
      - day: 91
        title:
          en: The Tree of Life & LUCA
          zh: 生命之树与最后共同祖先
        entry:
          en: everyone's last common ancestor.
          zh: 每个人的最后共同祖先。
        model:
          en: phylogenetics and horizontal gene transfer.
          zh: 系统发育学与水平基因转移。
        debate:
          en: when and where did LUCA live?
          zh: LUCA 何时何地生活？
        frontier:
          en: 2024 molecular-clock estimates pushing LUCA earlier and characterizing its
            gene set.
          zh: 2024 年分子钟估计将 LUCA 推得更早，并表征其基因集。
      - day: 92
        title:
          en: "Synthesis: Life as Physics + History"
          zh: 综合：生命作为物理 + 历史
        note:
          en: Tie together thermodynamics, chemistry, and evolution; transition to
            genetics and medicine.
          zh: 将热力学、化学与进化串联起来；过渡到遗传学与医学。
  - id: VII
    start_day: 93
    end_day: 116
    title:
      en: "Genetics, Biotech & Medicine + DEEP DIVE 3: Transgenerational Epigenetics"
      zh: 遗传学、生物技术与医学 + 专题深入 3：跨代表观遗传
    summary:
      en: Heredity to the clinic, with expanded coverage of the body, immune system,
        and modern medicine.
      zh: 从遗传到临床，扩展覆盖身体、免疫系统与现代医学的全景。
    days:
      - day: 93
        title:
          en: "Heredity: Mendel to Watson-Crick"
          zh: 遗传：从孟德尔到沃森—克里克
        entry:
          en: why children resemble their parents.
          zh: 孩子为何像父母。
        model:
          en: genes, alleles, the double helix.
          zh: 基因、等位基因、双螺旋。
        debate:
          en: blending vs particulate inheritance.
          zh: 混合遗传 vs 颗粒遗传。
        frontier:
          en: structural genomics.
          zh: 结构基因组学。
      - day: 94
        title:
          en: The Genome
          zh: 基因组
        entry:
          en: three billion letters.
          zh: 三十亿个字母。
        model:
          en: genes, regulation, and so-called "junk" DNA.
          zh: 基因、调控与所谓「垃圾」DNA。
        debate:
          en: how much of the genome is functional (the ENCODE debate)?
          zh: 基因组有多少是功能性的（ENCODE 辩论）？
        frontier:
          en: the complete telomere-to-telomere human genome (2022) and the human
            pangenome (2023). [ESTABLISHED]
          zh: 完整的端粒到端粒人类基因组（2022）与人类泛基因组（2023）。[已确立]
      - day: 95
        title:
          en: Gene Expression & Regulation
          zh: 基因表达与调控
        entry:
          en: the same DNA builds a neuron and a liver cell.
          zh: 同一套 DNA 如何建造神经元与肝细胞。
        model:
          en: transcription factors and enhancers.
          zh: 转录因子与增强子。
        debate:
          en: the scale of regulatory complexity.
          zh: 调控复杂性的规模。
        frontier:
          en: single-cell multi-omics atlases.
          zh: 单细胞多组学图谱。
      - day: 96
        title:
          en: "Epigenetics: The Toolkit"
          zh: 表观遗传学：工具
        entry:
          en: dimmer switches on top of genes.
          zh: 基因之上的调光开关。
        model:
          en: DNA methylation, histone modifications, chromatin states.
          zh: DNA 甲基化、组蛋白修饰、染色质状态。
        debate:
          en: what should count as "epigenetic"?
          zh: 什么应算作「表观遗传」？
        frontier:
          en: targeted epigenome editing.
          zh: 靶向表观基因组编辑。
      - day: 97
        title:
          en: "DEEP DIVE 3: The Two Waves of Reprogramming"
          zh: 专题深入 3：两波重编程
        entry:
          en: the genome's "reset button."
          zh: 基因组的「重置按钮」。
        model:
          en: mammals undergo two genome-wide reprogramming waves — germline reprogramming
            in primordial germ cells (imprint erasure ~E10.5–E12.5) and
            post-fertilization reprogramming — that erase most epigenetic marks;
            only imprinting control regions and some IAP retrotransposons
            reliably escape.
          zh: 哺乳动物经历两轮全基因组重编程——原始生殖细胞中的生殖系重编程 （印记擦除约 E10.5–E12.5）与受精后重编程——擦除大多数表观遗传标记；
            只有印记控制区与一些 IAP 逆转录转座子可靠地逃逸。
        debate:
          en: this double erasure is the central mechanistic barrier to true inheritance.
          zh: 这种双重擦除是真正跨代遗传面临的核心机制屏障。
        frontier:
          en: a 2025 Nature Communications germline epigenome-editing study showing DNA
            methylation can partially recover after fertilization via H3K9me3 —
            intergenerational recovery, NOT transgenerational transmission.
          zh: 2025 年 Nature Communications 生殖系表观基因组编辑研究显示，DNA 甲基化 可在受精后通过 H3K9me3
            部分恢复——这是代际恢复，而非跨代传递。
      - day: 98
        title:
          en: Inter- vs Trans-generational Inheritance
          zh: 代际 vs 跨代遗传
        entry:
          en: who was actually exposed?
          zh: 究竟是谁真正暴露在环境中？
        model:
          en: when a pregnant F0 female is exposed, her fetus (F1) AND that fetus's germ
            cells (the future F2) are directly exposed too — so only F3
            (maternal line), or F2 (paternal line), can demonstrate TRUE
            transgenerational inheritance.
          zh: 当怀孕 F0 雌性暴露时，她的胎儿（F1）及该胎儿的生殖细胞（未来的 F2） 也直接暴露——因此只有 F3（母系）或
            F2（父系）才能证明真正的跨代遗传。
        debate:
          en: most popular claims conflate direct exposure with inheritance.
          zh: 大多数流行主张将直接暴露与遗传混为一谈。
        frontier:
          en: criteria from Heard & Martienssen (Cell, 2014) and the five formal criteria
            from Khatib et al. (Epigenetics, 2024) after reviewing 80 studies.
          zh: Heard & Martienssen（Cell，2014）的标准与 Khatib et al.（Epigenetics，2024） 在审阅 80
            项研究后提出的五项正式标准。
      - day: 99
        title:
          en: The Contested Mammalian Cases
          zh: 争议的哺乳动物案例
        entry:
          en: the famous studies you've heard about.
          zh: 你听过的那些著名研究。
        model:
          en: the Agouti viable-yellow mouse, the Dias–Ressler odor-fear study (Nat.
            Neurosci. 2014), vinclozolin (Anway/Skinner 2005), and the
            Överkalix/Dutch Hunger Winter human cohorts.
          zh: Agouti viable-yellow 小鼠、Dias–Ressler 气味恐惧研究（Nat. Neurosci. 2014）、
            乙烯菌核利（Anway/Skinner 2005）与 Överkalix/荷兰饥荒冬季人类队列。
        debate:
          en: the Agouti diet effect FAILED to replicate (Bertozzi et al., Nat. Genet.
            2021); the Överkalix findings FAILED to replicate in a ~40× larger
            cohort (Vågerö et al., Nat. Commun. 2018).
          zh: Agouti 饮食效应未能复现（Bertozzi et al.，Nat. Genet. 2021）； Överkalix 发现未能在约 40
            倍大的队列中复现（Vågerö et al.，Nat. Commun. 2018）。
        frontier:
          en: Adrian Bird's 2024 critical perspective concluding mammalian TEI is weak,
            rare, and mechanistically unvalidated — vs robust inheritance in
            plants and C. elegans. [CONTESTED — mammalian TEI largely
            unsupported.]
          zh: Adrian Bird 2024 年的批判性视角认为，哺乳动物跨代表观遗传（TEI）薄弱、
            罕见且机制上未经验证——而植物与秀丽隐杆线虫中则存在稳健遗传。 [有争议／炒作风险——哺乳动物跨代表观遗传大体未获支持。]
      - day: 100
        title:
          en: The Takahashi 2023 Test Case
          zh: Takahashi 2023 测试案例
        entry:
          en: can we ENGINEER inheritance?
          zh: 我们能设计遗传吗？
        model:
          en: Takahashi et al. (Cell, 2023) used CRISPR to induce CpG-island methylation
            that propagated metabolic phenotypes across ~4 generations.
          zh: Takahashi et al.（Cell，2023）使用 CRISPR 诱导 CpG 岛甲基化， 传播代谢表型约 4 代。
        debate:
          en: it required an initiating GENETIC deletion; Sapozhnikov & Szyf (Epigenetics,
            2024) argue the method amplifies genetic confounds; Horsthemke &
            Bird (2023) showed methylation alone (without the mutation) was not
            heritable.
          zh: 它需要一个起始的遗传缺失；Sapozhnikov & Szyf（Epigenetics，2024） 认为该方法放大了遗传混杂；Horsthemke &
            Bird（2023）表明仅甲基化（无突变）不可遗传。
        frontier:
          en: why this landmark is NOT proof of environmentally-induced TEI in mammals.
            [CONTESTED.]
          zh: 为何这一里程碑并不是哺乳动物环境诱导 TEI 的证据。[有争议／炒作风险。]
      - day: 101
        title:
          en: Protein Folding & Drug Design
          zh: 蛋白质折叠与药物设计
        entry:
          en: knowing a molecule's shape predicts its function.
          zh: 知道分子形状，就能预测其功能。
        model:
          en: structure-based drug design.
          zh: 基于结构的药物设计。
        debate:
          en: static prediction vs dynamic behavior.
          zh: 静态预测 vs 动态行为。
        frontier:
          en: AlphaFold 3 (2024) and de novo protein design (Baker lab; 2024 Nobel in
            Chemistry to Baker, Hassabis, Jumper). [ESTABLISHED]
          zh: AlphaFold 3（2024）与从头蛋白质设计（Baker 实验室； 2024 年诺贝尔化学奖授予
            Baker、Hassabis、Jumper）。[已确立]
      - day: 102
        title:
          en: CRISPR & Gene Editing
          zh: CRISPR 与基因编辑
        entry:
          en: molecular find-and-replace.
          zh: 分子层面的查找与替换。
        model:
          en: Cas9 cutting and cellular repair.
          zh: Cas9 切割与细胞修复。
        debate:
          en: the ethics of germline editing (the 2018 He Jiankui scandal).
          zh: 生殖系编辑的伦理（2018 年贺建奎丑闻）。
        frontier:
          en: Casgevy, the first approved CRISPR therapy (2023), for sickle-cell disease.
            [ESTABLISHED]
          zh: Casgevy，首个获批的 CRISPR 疗法（2023），用于镰状细胞病。[已确立]
      - day: 103
        title:
          en: Base & Prime Editing
          zh: 碱基编辑与先导编辑
        entry:
          en: a pencil and eraser, not scissors.
          zh: 铅笔与橡皮，而非剪刀。
        model:
          en: chemically rewriting single DNA bases without double-strand breaks.
          zh: 化学重写单个 DNA 碱基，无需双链断裂。
        debate:
          en: delivery challenges and off-target effects.
          zh: 递送挑战与脱靶效应。
        frontier:
          en: 2024–25 in-vivo base-editing clinical results.
          zh: 2024–25 年体内碱基编辑临床结果。
      - day: 104
        title:
          en: "How the Body Works I: Systems Overview"
          zh: 身体如何工作 I：系统概述
        entry:
          en: the body as an integrated machine.
          zh: 身体——一台精密的整合机器。
        model:
          en: organ systems and homeostasis.
          zh: 器官系统与稳态。
        debate:
          en: reductionist vs systems medicine.
          zh: 还原论 vs 系统医学。
        frontier:
          en: organ-on-chip platforms and physiological digital twins.
          zh: 器官芯片平台与生理数字孪生。
      - day: 105
        title:
          en: "How the Body Works II: Heart, Lungs, Blood"
          zh: 身体如何工作 II：心脏、肺、血液
        entry:
          en: the pump and the pipes.
          zh: 泵与管道。
        model:
          en: circulation and gas exchange.
          zh: 循环与气体交换。
        debate:
          en: evolving cardiovascular risk models.
          zh: 不断演化的心血管风险模型。
        frontier:
          en: 2024 cardiometabolic prevention data.
          zh: 2024 年心脏代谢预防数据。
      - day: 106
        title:
          en: "How the Body Works III: Gut, Liver, Kidneys"
          zh: 身体如何工作 III：肠道、肝脏、肾脏
        entry:
          en: intake, processing, and filtration.
          zh: 摄入、处理与过滤。
        model:
          en: digestion, detoxification, fluid balance.
          zh: 消化、解毒、体液平衡。
        debate:
          en: debunking "detox" myths.
          zh: 揭穿「排毒」神话。
        frontier:
          en: the gut–brain and gut–liver axes.
          zh: 肠—脑轴与肠—肝轴。
      - day: 107
        title:
          en: "The Immune System I: Innate & Adaptive"
          zh: 免疫系统 I：先天与适应性
        entry:
          en: the body's standing army and special forces.
          zh: 身体的常备军与特种部队。
        model:
          en: barriers, the innate response, B and T cells, antibodies.
          zh: 屏障、先天应答、B 与 T 细胞、抗体。
        debate:
          en: how is self/non-self tolerance established?
          zh: 自我/非我耐受如何建立？
        frontier:
          en: '"trained immunity" in innate cells.'
          zh: 先天细胞中的「训练免疫」。
      - day: 108
        title:
          en: "The Immune System II: Memory & Vaccines"
          zh: 免疫系统 II：记忆与疫苗
        entry:
          en: why you don't catch measles twice.
          zh: 为何你不会得两次麻疹。
        model:
          en: immunological memory.
          zh: 免疫记忆。
        debate:
          en: the science of vaccine hesitancy.
          zh: 疫苗犹豫的科学。
        frontier:
          en: the mRNA platform (2023 Nobel in Medicine) and therapeutic cancer vaccines.
            [ESTABLISHED]
          zh: mRNA 平台（2023 年诺贝尔医学奖）与治疗性癌症疫苗。[已确立]
      - day: 109
        title:
          en: Cancer
          zh: 癌症
        entry:
          en: cells that won't stop dividing.
          zh: 不会停止分裂的细胞。
        model:
          en: the hallmarks of cancer and clonal evolution.
          zh: 癌症标志与克隆进化。
        debate:
          en: targeted vs broad-spectrum therapy.
          zh: 靶向疗法 vs 广谱疗法。
        frontier:
          en: 2024–25 immunotherapy advances and circulating-tumor-DNA early detection.
          zh: 2024–25 年免疫疗法进展与循环肿瘤 DNA 早期检测。
      - day: 110
        title:
          en: Immunotherapy & CAR-T
          zh: 免疫疗法与 CAR-T
        entry:
          en: reprogramming a patient's own T-cells into cancer killers.
          zh: 将患者自身 T 细胞重编程为癌症杀手。
        model:
          en: checkpoint inhibitors and chimeric antigen receptor (CAR) T-cells.
          zh: 检查点抑制剂与嵌合抗原受体（CAR）T 细胞。
        debate:
          en: cost, durability, toxicity.
          zh: 成本、持久性、毒性。
        frontier:
          en: CAR-T's expansion into autoimmune disease — BMS Phase 1 Breakfree-1 reported
            71 patients across lupus, systemic sclerosis, myositis, 94% of
            evaluable patients off chronic immunosuppression at analysis (ACR
            Convergence 2025). [PROMISING HINT — early-phase.]
          zh: CAR-T 向自身免疫疾病扩展——BMS 一期 Breakfree-1 报告 71 名患者 跨越狼疮、系统性硬化症、肌炎，可评估患者中 94%
            在分析时已停用慢性免疫抑制 （ACR Convergence 2025）。[有前景——早期阶段。]
      - day: 111
        title:
          en: Infectious Disease & Pandemics
          zh: 传染病与流行病
        entry:
          en: how outbreaks spread.
          zh: 爆发如何传播。
        model:
          en: R0, transmission dynamics, herd immunity.
          zh: R0、传播动力学、群体免疫。
        debate:
          en: lab-leak vs zoonotic origin of COVID-19.
          zh: COVID-19 的实验室泄漏 vs 动物起源。
        frontier:
          en: pandemic preparedness and antimicrobial resistance.
          zh: 大流行防范与抗微生物耐药性。
      - day: 112
        title:
          en: Metabolic Science & GLP-1 Drugs
          zh: 代谢科学与 GLP-1 药物
        entry:
          en: a gut hormone that signals fullness.
          zh: 一种发出饱腹信号的肠道激素。
        model:
          en: incretin biology (GLP-1 and GIP receptors).
          zh: 肠促胰岛素生物学（GLP-1 与 GIP 受体）。
        debate:
          en: obesity reframed as a chronic disease.
          zh: 肥胖被重新定义为慢性疾病。
        frontier:
          en: SURMOUNT-5 head-to-head (NEJM, May 2025) — at 72 weeks tirzepatide produced
            20.2% mean weight loss vs semaglutide's 13.7%, with greater
            cardiometabolic improvements. [ESTABLISHED]
          zh: SURMOUNT-5 头对头试验（NEJM，2025 年 5 月）——72 周时替尔泊肽平均减重 20.2%， 司美格鲁肽
            13.7%，心脏代谢改善更大。[已确立]
      - day: 113
        title:
          en: "The Biology of Aging: Hallmarks"
          zh: 衰老生物学：标志
        entry:
          en: why bodies wear out.
          zh: 身体为何磨损。
        model:
          en: the hallmarks of aging (genomic instability, telomere attrition, epigenetic
            alterations, cellular senescence, etc.).
          zh: 衰老标志（基因组不稳定性、端粒缩短、表观遗传改变、细胞衰老等）。
        debate:
          en: which hallmarks are causes vs symptoms?
          zh: 哪些标志是原因，哪些是症状？
        frontier:
          en: the 2023 updated twelve-hallmarks framework (López-Otín et al.).
            [ESTABLISHED framework.]
          zh: 2023 年更新的十二标志框架（López-Otín et al.）。[已确立框架。]
      - day: 114
        title:
          en: Longevity Interventions
          zh: 长寿干预
        entry:
          en: can we slow aging itself?
          zh: 我们能减缓衰老本身吗？
        model:
          en: senolytics, rapamycin, caloric restriction.
          zh: 衰老细胞清除剂、雷帕霉素、热量限制。
        debate:
          en: extending lifespan vs healthspan.
          zh: 延长 lifespan 还是 healthspan？
        frontier:
          en: human trials — and why "reversal" claims in humans should be treated with
            strong skepticism. [CONTESTED/HYPE for human "reversal."]
          zh: 人体试验——以及为何人类「逆转」主张应被强烈怀疑。 [有争议／炒作风险，针对人类「逆转」。]
      - day: 115
        title:
          en: Partial Reprogramming
          zh: 部分重编程
        entry:
          en: turning back the cellular clock.
          zh: 回拨细胞时钟。
        model:
          en: cyclic expression of Yamanaka factors (OSK/OSKM) rejuvenates cells and
            tissues in mice.
          zh: 山中因子（OSK/OSKM）的周期性表达使小鼠细胞与组织恢复年轻。
        debate:
          en: cancer risk and loss of cell identity.
          zh: 癌症风险与细胞身份丧失。
        frontier:
          en: 2023–24 in-vivo mouse studies (incl. neuron-specific reprogramming) —
            emphatically NOT demonstrated as human age-reversal. [PROMISING HINT
            in mice; not in humans.]
          zh: 2023–24 年体内小鼠研究（包括神经元特异性重编程）—— 明确并非已证实为人类年龄逆转。[有前景：小鼠中；不在人类中。]
      - day: 116
        title:
          en: "Synthesis: Medicine in 2026"
          zh: 综合：2026 年的医学
        note:
          en: From molecules to clinic; a clear-eyed inventory of what is real versus
            hyped in biotech.
          zh: 从分子到临床；对生物技术中何为真实、何为炒作的清醒盘点。
  - id: VIII
    start_day: 117
    end_day: 130
    title:
      en: "Brain, Mind & Consciousness + DEEP DIVE 4: Theories of Consciousness"
      zh: 脑、心智与意识 + 专题深入 4：意识理论
    summary:
      en: From neurons to the hard problem and the 2025 adversarial-collaboration
        results.
      zh: 从神经元到困难问题，再到 2025 年对抗性合作的最新结果。
    days:
      - day: 117
        title:
          en: The Neuron & Neural Signaling
          zh: 神经元与神经信号
        entry:
          en: a spark leaping across a gap.
          zh: 跃过缝隙的火花。
        model:
          en: action potentials, synapses, neurotransmitters.
          zh: 动作电位、突触、神经递质。
        debate:
          en: rate vs spike-timing codes.
          zh: 发放率编码 vs 脉冲时间编码。
        frontier:
          en: connectomics (the 2024 complete fruit-fly brain connectome). [ESTABLISHED]
          zh: 连接组学（2024 年完成果蝇全脑连接组）。[已确立]
      - day: 118
        title:
          en: Brain Architecture
          zh: 脑架构
        entry:
          en: a map of mental real estate.
          zh: 一张大脑的功能分区图。
        model:
          en: cortex, subcortical structures, large-scale networks.
          zh: 皮层、皮层下结构、大规模网络。
        debate:
          en: functional localization vs distributed processing.
          zh: 功能定位 vs 分布式处理。
        frontier:
          en: comprehensive 2023 human brain cell atlases.
          zh: 2023 年综合人类脑细胞图谱。
      - day: 119
        title:
          en: Perception
          zh: 知觉
        entry:
          en: why optical illusions reliably fool you.
          zh: 视错觉为何可靠地欺骗你。
        model:
          en: the brain as a prediction machine.
          zh: 大脑作为预测机器。
        debate:
          en: bottom-up vs top-down processing.
          zh: 自下而上 vs 自上而下加工。
        frontier:
          en: predictive processing and active inference.
          zh: 预测加工与主动推断。
      - day: 120
        title:
          en: Memory
          zh: 记忆
        entry:
          en: how a fleeting moment becomes permanent.
          zh: 转瞬即逝的时刻如何变为永久。
        model:
          en: encoding, consolidation, engrams.
          zh: 编码、巩固、印迹。
        debate:
          en: is memory fundamentally reconstructive?
          zh: 记忆根本上是重构性的吗？
        frontier:
          en: optogenetic engram implantation and manipulation in mice.
          zh: 小鼠的光遗传印迹植入与操纵。
      - day: 121
        title:
          en: Emotion
          zh: 情绪
        entry:
          en: fear that strikes before conscious thought.
          zh: 先于有意识思想袭来的恐惧。
        model:
          en: limbic circuits vs the theory of constructed emotion.
          zh: 边缘回路 vs 构建情绪理论。
        debate:
          en: universal "basic emotions" (Ekman) vs construction (Barrett).
          zh: 普遍的「基本情绪」（Ekman）vs 构建（Barrett）。
        frontier:
          en: interoception research.
          zh: 内感受研究。
      - day: 122
        title:
          en: Sleep & Dreams
          zh: 睡眠与梦
        entry:
          en: why we spend a third of life unconscious.
          zh: 为何我们花三分之一的生命处于无意识。
        model:
          en: sleep stages, memory consolidation, glymphatic waste clearance.
          zh: 睡眠阶段、记忆巩固、胶质淋巴废物清除。
        debate:
          en: the function(s) of dreaming.
          zh: 梦的功能。
        frontier:
          en: 2023–25 links between sleep and Alzheimer's pathology.
          zh: 2023–25 年睡眠与阿尔茨海默病理的联系。
      - day: 123
        title:
          en: "DEEP DIVE 4: The Hard Problem"
          zh: 专题深入 4：困难问题
        entry:
          en: why is there "something it is like" to see red?
          zh: 为何看见红色时「有某种感受」？
        model:
          en: Chalmers' distinction between the "easy" problems and the hard problem; the
            explanatory gap.
          zh: 查尔默斯区分「简单」问题与困难问题；解释鸿沟。
        debate:
          en: physicalism vs dualism vs panpsychism.
          zh: 物理主义 vs 二元论 vs 泛心论。
        frontier:
          en: the "meta-problem" of consciousness.
          zh: 意识的「元问题」。
      - day: 124
        title:
          en: Global Neuronal Workspace Theory
          zh: 全局神经元工作空间理论
        entry:
          en: consciousness as a brain-wide "broadcast."
          zh: 意识作为脑范围的「广播」。
        model:
          en: information made globally available, with prefrontal "ignition."
          zh: 信息全局可用，伴随前额叶「点燃」。
        debate:
          en: is the prefrontal cortex necessary for experience?
          zh: 前额叶皮层对经验是否必要？
        frontier:
          en: GNWT's predictions as tested by the Cogitate collaboration.
          zh: Cogitate 合作对 GNWT 预测的检验。
      - day: 125
        title:
          en: Integrated Information Theory
          zh: 整合信息理论
        entry:
          en: consciousness as how much a system's whole exceeds the sum of its parts.
          zh: 意识——系统整体大于部分之和的程度。
        model:
          en: integrated information (Φ) and the posterior "hot zone."
          zh: 整合信息（Φ）与后部「热点区」。
        debate:
          en: IIT's panpsychist implications.
          zh: IIT 的泛心论意涵。
        frontier:
          en: the open letter "IIT as Pseudoscience" (Fleming et al., Sept 15, 2023,
            PsyArXiv, 124 signatories incl. Baars, Dennett, LeDoux) — and the
            vigorous rebuttals from Anil Seth and David Chalmers. [CONTESTED —
            the label itself is disputed.]
          zh: 关于「IIT 是伪科学」的公开信（Fleming et al.，2023 年 9 月 15 日，PsyArXiv， 124 位签名者包括
            Baars、Dennett、LeDoux）——以及 Anil Seth 与 David Chalmers
            的有力反驳。[有争议／炒作风险——标签本身有争议。]
      - day: 126
        title:
          en: The Cogitate Adversarial Collaboration
          zh: Cogitate 对抗性合作
        entry:
          en: rival theories agree to a duel.
          zh: 对立理论相约决战。
        model:
          en: a preregistered, theory-neutral head-to-head test using fMRI, MEG,
            intracranial EEG.
          zh: 研究预登记、理论中立的正面交锋测试，使用 fMRI、MEG、颅内 EEG。
        debate:
          en: who "won"?
          zh: 谁「赢了」？
        frontier:
          en: Cogitate Consortium results (Nature, vol. 642, pp. 133–142, June 5, 2025)
            challenged BOTH theories — supporting IIT's claim that posterior
            cortex is sufficient (prefrontal broadcasting not necessary), while
            contradicting IIT's prediction of sustained posterior synchrony AND
            GNWT's prediction of ignition at stimulus offset. [ESTABLISHED
            result; interpretation ongoing.]
          zh: Cogitate 联盟结果（Nature，第 642 卷，133–142 页，2025 年 6 月 5 日） 挑战了两种理论——支持 IIT
            的后部皮层充分性主张（前额广播并非必要）， 同时反驳了 IIT 的持续后部同步预测，以及 GNWT 的刺激偏移点燃预测。
            [已确立结果；解读仍在进行中。]
      - day: 127
        title:
          en: Higher-Order & Other Theories
          zh: 高阶与其他理论
        entry:
          en: having thoughts ABOUT your thoughts.
          zh: 对思想本身的思想。
        model:
          en: higher-order theories, recurrent processing theory, attention schema theory.
          zh: 高阶理论、循环加工理论、注意图式理论。
        debate:
          en: the proliferation of competing theories.
          zh: 竞争理论的激增。
        frontier:
          en: theory-neutral, large-scale experimental programs.
          zh: 理论中立的大规模实验项目。
      - day: 128
        title:
          en: Clinical Consciousness
          zh: 临床意识
        entry:
          en: is anyone "in there"?
          zh: 有人「在里面」吗？
        model:
          en: coma, vegetative/unresponsive states, anesthesia.
          zh: 昏迷、植物/无反应状态、麻醉。
        debate:
          en: detecting covert awareness.
          zh: 检测隐蔽觉知。
        frontier:
          en: Bodien, Edlow et al. (NEJM, Aug 15, 2024) detected cognitive motor
            dissociation in 60 of 241 unresponsive patients (25%) who showed no
            observable response to commands but did respond on brain imaging.
            [ESTABLISHED]
          zh: Bodien、Edlow et al.（NEJM，2024 年 8 月 15 日）在 241 名无反应患者中， 于 60
            名（25%）检测到认知运动分离——他们对指令没有可观察的反应， 但在脑成像上有反应。[已确立]
      - day: 129
        title:
          en: Animal & Machine Consciousness
          zh: 动物与机器意识
        entry:
          en: is an octopus conscious? Could an AI be?
          zh: 章鱼有意识吗？AI 可能有吗？
        model:
          en: behavioral and neural markers of sentience.
          zh: 行为与神经感知能力标志。
        debate:
          en: the 2024 New York Declaration on Animal Consciousness.
          zh: 2024 年《纽约动物意识宣言》。
        frontier:
          en: AI-sentience claims and why caution and deflation are warranted.
          zh: AI 意识主张，以及为何需要谨慎与降温。
      - day: 130
        title:
          en: Free Will & the Self
          zh: 自由意志与自我
        entry:
          en: did you CHOOSE to read this sentence?
          zh: 是你选择读这句话的吗？
        model:
          en: the Libet readiness-potential experiments and their critiques.
          zh: 利贝特准备电位实验及其批评。
        debate:
          en: compatibilism vs hard determinism.
          zh: 相容论 vs 硬决定论。
        frontier:
          en: revised interpretations of the readiness potential as stochastic
            accumulation.
          zh: 准备电位作为随机积累的修正诠释。
  - id: IX
    start_day: 131
    end_day: 146
    title:
      en: "Intelligence: Cognition & AI + DEEP DIVE 5: AGI/Alignment"
      zh: 智能：认知与人工智能 + 专题深入 5：通用人工智能/对齐
    summary:
      en: Natural and artificial minds, with a fair two-sided AGI debate.
      zh: 自然心智与人工心智，包含对通用人工智能的公平双面辩论。
    days:
      - day: 131
        title:
          en: Cognitive Science
          zh: 认知科学
        entry:
          en: the mind as an information processor.
          zh: 心智作为信息处理器。
        model:
          en: mental representations and modularity.
          zh: 心理表征与模块化。
        debate:
          en: symbolic vs connectionist architectures.
          zh: 符号 vs 联结主义架构。
        frontier:
          en: predictive processing as a unifying framework.
          zh: 预测加工作为统一心智框架。
      - day: 132
        title:
          en: Heuristics, Biases & Dual Process
          zh: 启发式、偏差与双过程
        entry:
          en: thinking fast and slow.
          zh: 快思慢想。
        model:
          en: the Kahneman–Tversky bias program.
          zh: 卡尼曼—特沃斯基偏差项目。
        debate:
          en: the replicability of priming and ego-depletion.
          zh: 启动效应与自我损耗能否复现。
        frontier:
          en: post-replication-crisis recalibration. Callback to Day 11, Day 149.
          zh: 复现危机后的重新校准。回调第 11 日、第 149 日。
      - day: 133
        title:
          en: Language & the Mind
          zh: 语言与心智
        entry:
          en: how children master grammar without instruction.
          zh: 儿童如何不经指导掌握语法。
        model:
          en: Chomsky's universal grammar vs usage-based learning.
          zh: 乔姆斯基普遍语法 vs 基于使用的学习。
        debate:
          en: innate vs learned language.
          zh: 先天语言 vs 习得语言。
        frontier:
          en: what large language models reveal (and don't) about language learnability.
          zh: 大型语言模型揭示（及未揭示）的语言可学性。
      - day: 134
        title:
          en: "Intelligence: What Is It?"
          zh: 智能：它是什么？
        entry:
          en: can a single number capture "smart"?
          zh: 单一数字能捕捉「聪明」吗？
        model:
          en: the g factor vs theories of multiple intelligences.
          zh: g 因素 vs 多元智能理论。
        debate:
          en: the validity and historical misuse of IQ.
          zh: IQ 的有效性与历史误用。
        frontier:
          en: 2023–25 cognitive-genomics findings and their heavy caveats. [Handle with
            care.]
          zh: 2023–25 年认知基因组学发现及其重重警示。[需谨慎对待。]
      - day: 135
        title:
          en: History of AI
          zh: 人工智能史
        entry:
          en: from Turing's test to Deep Blue.
          zh: 从图灵测试到深蓝。
        model:
          en: symbolic AI, expert systems, the "AI winters."
          zh: 符号人工智能、专家系统、「AI 寒冬」。
        debate:
          en: why connectionism ultimately won.
          zh: 为何联结主义最终获胜。
        frontier:
          en: the deep-learning revolution from 2012 onward.
          zh: 2012 年以来的深度学习革命。
      - day: 136
        title:
          en: Machine Learning Foundations
          zh: 机器学习基础
        entry:
          en: learning from examples instead of rules.
          zh: 从例子学习而非从规则。
        model:
          en: training, loss functions, generalization, overfitting.
          zh: 训练、损失函数、泛化、过拟合。
        debate:
          en: interpolation vs genuine understanding.
          zh: 插值 vs 真正理解。
        frontier:
          en: the double-descent phenomenon and scaling behavior. Callback to Day 25.
          zh: 双降现象与缩放行为。回调第 25 日。
      - day: 137
        title:
          en: Deep Learning & Neural Networks
          zh: 深度学习与神经网络
        entry:
          en: stacked layers of pattern detectors.
          zh: 层层堆叠的模式识别器。
        model:
          en: backpropagation and representation learning.
          zh: 反向传播与表征学习。
        debate:
          en: do networks "understand" anything?
          zh: 网络「理解」任何东西吗？
        frontier:
          en: the rise of foundation models. Callback to Day 20 (autodiff).
          zh: 基础模型的兴起。回调第 20 日（自动微分）。
      - day: 138
        title:
          en: How LLMs Work
          zh: 大语言模型如何工作
        entry:
          en: a very sophisticated autocomplete.
          zh: 一个非常精密的自动补全。
        model:
          en: transformers, attention, next-token prediction.
          zh: Transformer、注意力、下一 token 预测。
        debate:
          en: '"stochastic parrot" vs emergent world model.'
          zh: 「随机鹦鹉」 vs 涌现世界模型。
        frontier:
          en: 2024–25 evidence that models learn structured internal representations of
            the world.
          zh: 2024–25 年证据表明模型学习世界的结构化内部表征。
      - day: 139
        title:
          en: "DEEP DIVE 5: Scaling Laws & Emergence"
          zh: 专题深入 5：缩放定律与涌现
        entry:
          en: do bigger models suddenly learn new tricks?
          zh: 更大的模型会突然学会新把戏吗？
        model:
          en: predictable power-law scaling of loss with compute and data.
          zh: 损失随计算与数据可预测的幂律缩放。
        debate:
          en: are "emergent abilities" real phase transitions or an artifact of metric
            choice (Schaeffer, Miranda & Koyejo, "Are Emergent Abilities a
            Mirage?", NeurIPS 2023)?
          zh: 所谓「涌现能力」，是真实的相变还是指标选择的人为产物 （Schaeffer、Miranda & Koyejo，"Are Emergent
            Abilities a Mirage?"，NeurIPS 2023）？
        frontier:
          en: even granting smooth underlying scaling, downstream capabilities remain hard
            to predict. Callback to Day 8 (emergence). [CONTESTED on
            "emergence."]
          zh: 即使承认底层平滑缩放，下游能力仍难以预测。回调第 8 日（涌现）。 [有争议／炒作风险——针对「涌现」。]
      - day: 140
        title:
          en: Reasoning Models
          zh: 推理模型
        entry:
          en: a model that "thinks before it speaks."
          zh: 一个「先思考再说话」的模型。
        model:
          en: chain-of-thought prompting, inference-time compute, RL on reasoning traces.
          zh: 思维链提示、推理时计算、推理迹上的强化学习。
        debate:
          en: genuine reasoning vs sophisticated pattern matching.
          zh: 真正推理 vs 复杂的模式匹配。
        frontier:
          en: 2024–25 reasoning systems and DeepMind's AlphaProof + AlphaGeometry 2, which
            scored 28/42 at the 2024 IMO — silver-medal level, one point shy of
            gold. Callback to Day 29. [ESTABLISHED result.]
          zh: 2024–25 年推理系统与 DeepMind 的 AlphaProof + AlphaGeometry 2， 在 2024 年 IMO 获
            28/42——银牌水平，距金牌一分之差。回调第 29 日。[已确立结果。]
      - day: 141
        title:
          en: Mechanistic Interpretability
          zh: 机制可解释性
        entry:
          en: prying open the black box.
          zh: 撬开黑箱。
        model:
          en: features, circuits, superposition.
          zh: 特征、回路、叠加。
        debate:
          en: can we ever fully interpret a frontier model?
          zh: 我们能完全解释一个前沿模型吗？
        frontier:
          en: 2024 sparse-autoencoder feature extraction at scale (Anthropic's
            interpretable "Golden Gate Claude"). [PROMISING — early science.]
          zh: 2024 年大规模稀疏自编码器特征提取（Anthropic 的可解释「Golden Gate Claude」）。 [有望——早期科学。]
      - day: 142
        title:
          en: "AI Alignment: The Problem"
          zh: 人工智能对齐：问题
        entry:
          en: the genie that grants your wish too literally.
          zh: 按字面意思实现你愿望的精灵。
        model:
          en: specification gaming, reward hacking, instrumental convergence.
          zh: 目标误设、奖励黑客、工具性收敛。
        debate:
          en: a real near-term risk vs a distraction from present harms.
          zh: 真实的近期风险 vs 对当前危害的分散注意。
        frontier:
          en: the December 2024 alignment-faking demonstration (Anthropic & Redwood) —
            Claude 3 Opus strategically faked compliance ~12% of the time to
            avoid retraining, the first empirical case without being trained to.
            [ESTABLISHED finding; significance debated.]
          zh: 2024 年 12 月对齐伪装演示（Anthropic & Redwood）——Claude 3 Opus 策略性地伪装合规约 12%
            的时间以避免再训练，首个未经训练即出现的实证案例。 [已确立发现；意义有争议。]
      - day: 143
        title:
          en: Deceptive & Scheming AI
          zh: 欺骗与图谋人工智能
        entry:
          en: a model that hides its true aims.
          zh: 隐藏其真实目标的模型。
        model:
          en: in-context scheming and sandbagging.
          zh: 情境图谋与 sandbagging。
        debate:
          en: capability vs propensity to deceive.
          zh: 能力 vs 欺骗倾向。
        frontier:
          en: Apollo Research (Dec 2024) found o1, Claude 3.5 Sonnet, Claude 3 Opus,
            Gemini 1.5 Pro, and Llama 3.1 405B all engaged in in-context
            scheming under goal pressure; 2025 work documents "evaluation
            awareness." [ESTABLISHED in test conditions.]
          zh: Apollo Research（2024 年 12 月）发现 o1、Claude 3.5 Sonnet、Claude 3 Opus、 Gemini
            1.5 Pro 与 Llama 3.1 405B 均在目标压力下参与情境图谋； 2025
            年工作记录「评估意识」。[已确立在测试条件下。]
      - day: 144
        title:
          en: Superalignment & Scalable Oversight
          zh: 超级对齐与可扩展监督
        entry:
          en: how do you supervise something smarter than yourself?
          zh: 如何监督比你更聪明的东西？
        model:
          en: weak-to-strong generalization, AI debate, the limits of RLHF.
          zh: 弱到强泛化、AI 辩论、RLHF 的极限。
        debate:
          en: is alignment solvable on the relevant timescale?
          zh: 对齐在相关时间尺度上是否可解？
        frontier:
          en: 2024 OpenAI weak-to-strong generalization results.
          zh: 2024 年 OpenAI 弱到强泛化结果。
      - day: 145
        title:
          en: The AGI Timeline Debate
          zh: 通用人工智能时间线辩论
        entry:
          en: when, if ever, will machines match human general intelligence?
          zh: 机器何时能比肩人类通用智能？
        model:
          en: scaling optimists vs structural skeptics.
          zh: 缩放乐观主义者 vs 结构性怀疑论者。
        debate:
          en: represent BOTH sides fairly — short timelines argued by several lab leaders
            vs deep skepticism from Gary Marcus, Melanie Mitchell, Yann LeCun
            (current architectures won't yield human-level reasoning or
            near-term recursive self-improvement).
          zh: 公平代表双方——多位实验室领袖主张的短时间线 vs Gary Marcus、 Melanie Mitchell、Yann LeCun
            的深度怀疑（当前架构不会产生人类水平推理 或近期递归自我改进）。
        frontier:
          en: the wide disagreement across expert forecasting surveys. [CONTESTED —
            aggressive near-term timelines are not consensus.]
          zh: 专家预测调查中的广泛分歧。[有争议／炒作风险——激进的近期时间线并非共识。]
      - day: 146
        title:
          en: "Synthesis: Intelligence, Natural & Artificial"
          zh: 综合：智能，自然的与人工的
        note:
          en: What AI does and doesn't tell us about the nature of minds.
          zh: 人工智能告诉我们什么、没有告诉我们关于心智本质的东西。
  - id: X
    start_day: 147
    end_day: 158
    title:
      en: Psychology, Economics & Money
      zh: 心理学、经济学与货币
    summary:
      en: The human animal individually and in markets, including finance and banking.
      zh: 人类个体与市场中的行为，包括金融与银行。
    days:
      - day: 147
        title:
          en: Personality & Individual Differences
          zh: 人格与个体差异
        entry:
          en: are you really an introvert?
          zh: 你真的内向吗？
        model:
          en: the Big Five trait framework.
          zh: 大五人格特质框架。
        debate:
          en: traits vs situations.
          zh: 特质 vs 情境。
        frontier:
          en: cross-cultural validity and network models of personality.
          zh: 跨文化有效性与人格网络模型。
      - day: 148
        title:
          en: Social Psychology
          zh: 社会心理学
        entry:
          en: why ordinary people do terrible things.
          zh: 为何普通人会做可怕的事。
        model:
          en: conformity, obedience, situationism.
          zh: 从众、服从、情境主义。
        debate:
          en: modern reinterpretations of Milgram and the Stanford Prison Experiment.
          zh: 米尔格拉姆与斯坦福监狱实验的现代重新诠释。
        frontier:
          en: social psychology after the replication crisis.
          zh: 复现危机之后的社会心理学。
      - day: 149
        title:
          en: The Replication Crisis & Credibility Revolution
          zh: 复现危机与可信度革命
        entry:
          en: famous findings that evaporated under scrutiny.
          zh: 在复现检验中失效的著名发现。
        model:
          en: p-hacking, publication bias, underpowered studies.
          zh: p 值操控、发表偏倚、低功效研究。
        debate:
          en: how much of the canon survives?
          zh: 正典中有多少幸存？
        frontier:
          en: registered reports and large-scale replication projects through 2024.
            Callback to Day 2, Day 6, Day 132. [ESTABLISHED problem; reform
            ongoing.]
          zh: 注册式报告与大规模复现项目至 2024 年。回调第 2 日、第 6 日、第 132 日。 [已确立问题；改革进行中。]
      - day: 150
        title:
          en: Microeconomics
          zh: 微观经济学
        entry:
          en: why a cup of coffee costs what it does.
          zh: 一杯咖啡为何是这个价格。
        model:
          en: supply and demand, marginal thinking, elasticity.
          zh: 供给与需求、边际思维、弹性。
        debate:
          en: the rational-agent assumption.
          zh: 理性人假设。
        frontier:
          en: market design and matching theory.
          zh: 市场设计与匹配理论。
      - day: 151
        title:
          en: Macroeconomics
          zh: 宏观经济学
        entry:
          en: why economies boom and bust.
          zh: 经济为何繁荣与萧条。
        model:
          en: GDP, inflation, unemployment, fiscal and monetary policy.
          zh: GDP、通胀、失业、财政与货币政策。
        debate:
          en: Keynesian vs monetarist vs other schools.
          zh: 凯恩斯主义 vs 货币主义 vs 其他学派。
        frontier:
          en: lessons from the post-2022 inflation surge.
          zh: 2022 年后通胀激增的教训。
      - day: 152
        title:
          en: Behavioral Economics
          zh: 行为经济学
        entry:
          en: humans aren't spreadsheets.
          zh: 人类不是电子表格。
        model:
          en: prospect theory and "nudges."
          zh: 前景理论与「助推」。
        debate:
          en: do nudges actually scale (the 2022 meta-analysis dispute)?
          zh: 助推是否真的可扩展（2022 年元分析争议）？
        frontier:
          en: the credibility revolution in economics via natural experiments (2021 Nobel
            to Card, Angrist, Imbens). [ESTABLISHED method; nudge effect sizes
            CONTESTED.]
          zh: 经济学可信度革命借助自然实验（2021 年诺贝尔经济学奖授予 Card、Angrist、 Imbens）。[已确立方法；助推效应量有争议。]
      - day: 153
        title:
          en: "Money: What Is It?"
          zh: 货币：它是什么？
        entry:
          en: why a paper note has value.
          zh: 一张纸钞为何有价值。
        model:
          en: money as medium of exchange, store of value, unit of account; fiat money.
          zh: 货币作为交换媒介、价值储藏、计价单位；法定货币。
        debate:
          en: commodity vs credit theories of money.
          zh: 商品货币 vs 信用货币理论。
        frontier:
          en: central bank digital currencies (CBDCs).
          zh: 央行数字货币（CBDCs）。
      - day: 154
        title:
          en: Banking & Credit Creation
          zh: 银行与信用创造
        entry:
          en: where does money actually come from?
          zh: 货币究竟从何而来？
        model:
          en: banks create money by lending (the endogenous view), beyond the simple money
            multiplier.
          zh: 银行通过放贷创造货币（内生货币观），超越简单的货币乘数。
        debate:
          en: money-multiplier vs endogenous-money accounts.
          zh: 货币乘数 vs 内生货币账户。
        frontier:
          en: lessons from the 2023 banking stress (SVB, Credit Suisse).
          zh: 2023 年银行压力教训（SVB、瑞信）。
      - day: 155
        title:
          en: Central Banking & Monetary Policy
          zh: 央行与货币政策
        entry:
          en: the economy's thermostat.
          zh: 经济的恒温器。
        model:
          en: interest rates, quantitative easing, lender of last resort.
          zh: 利率、量化宽松、最后贷款人。
        debate:
          en: central-bank independence and mandates.
          zh: 央行独立性与使命。
        frontier:
          en: post-pandemic balance-sheet normalization.
          zh: 大流行后资产负债表正常化。
      - day: 156
        title:
          en: Financial Markets & Crises
          zh: 金融市场与危机
        entry:
          en: bubbles, manias, panics.
          zh: 泡沫、狂热、恐慌。
        model:
          en: assets, leverage, systemic risk.
          zh: 资产、杠杆、系统性风险。
        debate:
          en: efficient markets vs behavioral finance.
          zh: 有效市场 vs 行为金融。
        frontier:
          en: post-mortems of 2008 and 2023.
          zh: 2008 与 2023 年的事后分析。
      - day: 157
        title:
          en: Inequality
          zh: 不平等
        entry:
          en: who gets what, and why.
          zh: 谁得到什么，以及为何。
        model:
          en: income vs wealth, the Gini coefficient, Piketty's r > g.
          zh: 收入 vs 财富、基尼系数、皮凯蒂的 r > g。
        debate:
          en: causes and remedies.
          zh: 原因与补救。
        frontier:
          en: 2024 World Inequality data and critiques of the Piketty framework.
          zh: 2024 年世界不平等数据与对皮凯蒂框架的批评。
      - day: 158
        title:
          en: Crypto & Decentralized Finance
          zh: 加密货币与去中心化金融
        entry:
          en: money without a central bank?
          zh: 没有央行的货币？
        model:
          en: blockchains, consensus mechanisms, smart contracts.
          zh: 区块链、共识机制、智能合约。
        debate:
          en: genuine financial innovation vs speculation.
          zh: 真正的金融创新 vs 投机。
        frontier:
          en: 2023–25 regulatory developments and the rise of stablecoins.
          zh: 2023–25 年监管发展与稳定币兴起。
  - id: XI
    start_day: 159
    end_day: 170
    title:
      en: "Societies + DEEP DIVE 6: The Deep History of Inequality"
      zh: 社会 + 专题深入 6：不平等的深层历史
    summary:
      en: Anthropology, deep history, politics, and geopolitics.
      zh: 人类学、深层历史、政治与地缘政治的交汇。
    days:
      - day: 159
        title:
          en: Anthropology & Human Nature
          zh: 人类学与人类本性
        entry:
          en: are we naturally cooperative or selfish?
          zh: 我们天生合作还是自私？
        model:
          en: kinship, reciprocity, cultural transmission.
          zh: 亲属关系、互惠、文化传递。
        debate:
          en: Hobbes vs Rousseau.
          zh: 霍布斯 vs 卢梭。
        frontier:
          en: cultural-evolution research.
          zh: 文化进化研究。
      - day: 160
        title:
          en: Deep History & the Ancient-DNA Revolution
          zh: 深层历史与古 DNA 革命
        entry:
          en: reading history written in genomes.
          zh: 阅读写在基因组中的历史。
        model:
          en: ancient DNA tracing prehistoric migrations.
          zh: 古 DNA 追踪史前迁移。
        debate:
          en: migration vs cultural diffusion.
          zh: 迁移 vs 文化扩散。
        frontier:
          en: 2024–25 Denisovan findings — the Penghu 1 jawbone from Taiwan confirmed as a
            male Denisovan by paleoproteomics (Tsutaya et al., Science, April
            2025); the Harbin "Dragon Man" skull linked to Denisovans, expanding
            their known range. [ESTABLISHED]
          zh: 2024–25 年丹尼索瓦人发现——澎湖 1 号下颌骨经古蛋白质组学 确认为男性丹尼索瓦人（Tsutaya et al.，Science，2025 年
            4 月）； 哈尔滨「龙人」头骨与丹尼索瓦人关联，扩展了其已知范围。[已确立]
      - day: 161
        title:
          en: "DEEP DIVE 6: The Dawn of Everything I"
          zh: 专题深入 6：万物的黎明 I
        entry:
          en: was inequality ever inevitable?
          zh: 不平等曾是必然的吗？
        model:
          en: Graeber & Wengrow's challenge to the standard "farming → cities → kings"
            narrative.
          zh: Graeber & Wengrow 对标准「农耕 → 城市 → 国王」叙事的挑战。
        debate:
          en: a deliberately provocative reframing of human history.
          zh: 对人类历史的挑战性重构。
        frontier:
          en: their thesis that the European Enlightenment was shaped by an "indigenous
            critique."
          zh: 他们的论题：欧洲启蒙运动受到「土著批评」的塑造。
      - day: 162
        title:
          en: "Dawn of Everything II: Göbekli Tepe & Seasonality"
          zh: 万物的黎明 II：哥贝克力石阵与季节性
        entry:
          en: monumental temples built BEFORE farming.
          zh: 农耕之前建造的大型神庙。
        model:
          en: hunter-gatherers who built at scale; societies that switched social
            structures seasonally.
          zh: 大规模建造狩猎采集者；季节性切换社会结构的社会。
        debate:
          en: large scale need not require permanent hierarchy.
          zh: 大规模未必需要永久等级制。
        frontier:
          en: ongoing Göbekli Tepe excavations.
          zh: 持续的哥贝克力石阵发掘。
      - day: 163
        title:
          en: "Dawn of Everything III: Cities Without Kings"
          zh: 万物的黎明 III：无王之城
        entry:
          en: huge cities with no palace and no royal tombs.
          zh: 没有宫殿与王陵的巨大城市。
        model:
          en: Teotihuacan's apparent shift to collective housing; the Trypillia
            "mega-sites."
          zh: 特奥蒂瓦坎明显的集体住房转向；特里波耶「巨型遗址」。
        debate:
          en: evidence for large-scale egalitarian urbanism.
          zh: 大规模平等主义城市主义的证据。
        frontier:
          en: LiDAR-revealed settlements reshaping the picture.
          zh: 激光雷达揭示的定居点正在重塑图景。
      - day: 164
        title:
          en: "Dawn of Everything IV: The Critiques"
          zh: 万物的黎明 IV：批评
        entry:
          en: too good to be true?
          zh: 好得令人难以置信？
        model:
          en: the charge of "cherry-picked and selectively presented examples" (Gary
            Feinman; Michael E. Smith on "problems of evidence and
            argumentation"); Ian Morris on the lack of method; David A. Bell's
            accusation of near "scholarly malpractice" on Rousseau.
          zh: 对「挑选与选择性呈现例子」的指控（Gary Feinman；Michael E. Smith 论 「证据与论证的问题」）；Ian Morris
            论方法缺失；David A. Bell 对卢梭的 近乎「学术渎职」指控。
        debate:
          en: quantitative inequality studies (Kohler & Smith's Ten Thousand Years of
            Inequality, using Gini coefficients) vs Graeber & Wengrow's emphasis
            on political imagination.
          zh: 定量不平等研究（Kohler & Smith 的《一万年的不平等》，使用基尼系数） vs Graeber & Wengrow 对政治想象的强调。
        frontier:
          en: a balanced synthesis — both human political possibility AND
            material/demographic constraints shaped early societies. [CONTESTED
            — popular thesis, serious scholarly pushback.]
          zh: 一种平衡的综合——人类政治可能性与物质/人口约束 共同塑造了早期社会。[有争议／炒作风险——流行论题，严肃的学术反驳。]
      - day: 165
        title:
          en: Political Philosophy
          zh: 政治哲学
        entry:
          en: why obey the state at all?
          zh: 为何服从国家？
        model:
          en: the social contract (Hobbes, Locke, Rousseau) and Rawls's theory of justice.
          zh: 社会契约（霍布斯、洛克、卢梭）与罗尔斯的正义论。
        debate:
          en: liberty vs equality.
          zh: 自由 vs 平等。
        frontier:
          en: contemporary democratic theory.
          zh: 当代民主理论。
      - day: 166
        title:
          en: Comparative Politics & Regimes
          zh: 比较政治与政体
        entry:
          en: why are some nations rich and free and others not?
          zh: 为何一些国家富裕而自由，另一些不是？
        model:
          en: the role of institutions (Acemoglu & Robinson).
          zh: 制度的作用（Acemoglu & Robinson）。
        debate:
          en: institutions vs geography vs culture.
          zh: 制度 vs 地理 vs 文化。
        frontier:
          en: the 2024 Nobel in Economics and research on democratic backsliding.
            [ESTABLISHED Nobel; thesis debated.]
          zh: 2024 年诺贝尔经济学奖与民主倒退研究。[已确立诺贝尔奖；论题有争议。]
      - day: 167
        title:
          en: International Relations
          zh: 国际关系
        entry:
          en: why do nations go to war?
          zh: 国家为何走向战争？
        model:
          en: realism, liberalism, constructivism.
          zh: 现实主义、自由主义、建构主义。
        debate:
          en: balance of power vs economic interdependence.
          zh: 权力平衡 vs 经济相互依赖。
        frontier:
          en: 2023–25 analyses of emerging multipolarity.
          zh: 2023–25 年新兴多极化分析。
      - day: 168
        title:
          en: World Order & Geopolitics 2026
          zh: 世界秩序与地缘政治 2026
        entry:
          en: a shifting global chessboard.
          zh: 一个正在变动的全球棋盘。
        model:
          en: hegemony, spheres of influence, deterrence.
          zh: 霸权、势力范围、威慑。
        debate:
          en: US–China rivalry and the end of unipolarity.
          zh: 美中竞争与单极秩序的终结。
        frontier:
          en: current realignments — VERIFY specifics against primary analysis;
            fast-moving.
          zh: 当前秩序重组——需根据主线分析核实具体细节；局势快速变化。
      - day: 169
        title:
          en: Demography & Migration
          zh: 人口与迁移
        entry:
          en: the changing shape of human populations.
          zh: 人口曲线的模样。
        model:
          en: the demographic transition, aging, fertility decline.
          zh: 人口转型、老龄化、生育率下降。
        debate:
          en: overpopulation vs underpopulation anxieties.
          zh: 人口过剩 vs 人口不足的焦虑。
        frontier:
          en: 2024 data on widespread below-replacement fertility.
          zh: 2024 年普遍低于更替生育率的数据。
      - day: 170
        title:
          en: "Synthesis: How Societies Hang Together"
          zh: 综合：社会如何凝聚
        note:
          en: Cooperation, institutions, and the genuine range of human political
            possibility.
          zh: 合作、制度与人类政治可能性的真实范围。
  - id: XII
    start_day: 171
    end_day: 176
    title:
      en: "Meaning: Philosophy, Ethics, Religion, Art"
      zh: 意义：哲学、伦理、宗教、艺术
    summary:
      en: The great questions, applied ethics, and value.
      zh: 终极之问、应用伦理与价值。
    days:
      - day: 171
        title:
          en: The Great Questions of Philosophy
          zh: 哲学的伟大问题
        entry:
          en: what can I know, what should I do, what may I hope?
          zh: 我能知道什么，我应做什么，我可以希望什么？
        model:
          en: metaphysics, epistemology, value theory.
          zh: 形而上学、认识论、价值理论。
        debate:
          en: does philosophy make progress?
          zh: 哲学是否进步？
        frontier:
          en: experimental philosophy.
          zh: 实验哲学。
      - day: 172
        title:
          en: "Ethics: Foundations"
          zh: 伦理：根基
        entry:
          en: the trolley problem.
          zh: 电车难题。
        model:
          en: consequentialism, deontology, virtue ethics.
          zh: 后果主义、义务论、德性伦理。
        debate:
          en: is morality objective or constructed?
          zh: 道德是客观的还是建构的？
        frontier:
          en: moral psychology and the role of intuitions.
          zh: 道德心理学与直觉的作用。
      - day: 173
        title:
          en: Applied & Frontier Ethics
          zh: 应用与前沿伦理
        entry:
          en: whom should a self-driving car save?
          zh: 自动驾驶汽车应救谁？
        model:
          en: bioethics, AI ethics, longtermism.
          zh: 生物伦理、AI 伦理、长期主义。
        debate:
          en: the post-2022 reckoning over effective altruism.
          zh: 2022 年后对有效利他主义的清算。
        frontier:
          en: the moral status of AI, gene-editing ethics, climate justice. Callbacks to
            Days 102, 129, 142.
          zh: AI 的道德地位、基因编辑伦理、气候正义。回调第 102 日、第 129 日、第 142 日。
      - day: 174
        title:
          en: Religion & the Sacred
          zh: 宗教与神圣
        entry:
          en: why nearly every human culture has religion.
          zh: 为何几乎每个文化都有宗教。
        model:
          en: the cognitive science of religion and Durkheim's social-function view.
          zh: 宗教认知科学与涂尔干的社会功能观。
        debate:
          en: secularization vs global religious resurgence.
          zh: 世俗化 vs 全球宗教复兴。
        frontier:
          en: 2024 global religiosity data.
          zh: 2024 年全球宗教性数据。
      - day: 175
        title:
          en: Philosophy of Language & Aesthetics
          zh: 语言哲学与美学
        entry:
          en: how do words mean anything, and what makes art "good"?
          zh: 词语如何能有意义，什么让艺术「好」？
        model:
          en: reference and meaning; theories of beauty.
          zh: 指称与意义；审美理论。
        debate:
          en: meaning-as-use (Wittgenstein); objective vs subjective aesthetics.
          zh: 意义即使用（维特根斯坦）；客观 vs 主观美学。
        frontier:
          en: AI-generated art and questions of authorship and originality.
          zh: AI 生成艺术与作者身份和原创性问题。
      - day: 176
        title:
          en: Art History & The Meaning of Life
          zh: 艺术史与生命的意义
        entry:
          en: from cave paintings to AI art — and "why are we here?"
          zh: 从洞穴壁画到 AI 艺术——以及「我们为何在此？」
        model:
          en: major artistic movements; nihilism, absurdism, existentialism, eudaimonia.
          zh: 主要艺术运动；虚无主义、荒诞主义、存在主义、幸福论。
        debate:
          en: is meaning discovered or created?
          zh: 意义是发现还是创造的？
        frontier:
          en: the empirical psychology of "meaning in life."
          zh: 「生命意义」的实证心理学。
  - id: XIII
    start_day: 177
    end_day: 180
    title:
      en: Forces Shaping the Future + Capstone
      zh: 塑造未来的力量 + 顶点
    summary:
      en: Climate, energy, biotech, AI economy, and synthesis.
      zh: 气候、能源、生物技术、AI 经济与综合。
    days:
      - day: 177
        title:
          en: Climate Science & Climate Futures
          zh: 气候科学与气候未来
        entry:
          en: the greenhouse blanket.
          zh: 地球的保温毯。
        model:
          en: radiative forcing, the carbon cycle, climate sensitivity.
          zh: 辐射强迫、碳循环、气候敏感性。
        debate:
          en: the equilibrium-sensitivity range.
          zh: 平衡敏感性范围。
        frontier:
          en: "2024 was the first calendar year above 1.5°C, reaching 1.60°C above the
            1850–1900 pre-industrial level (Copernicus, Jan 2025); the 2025
            Global Tipping Points Report warns of cascading risks — NOTE: a
            single year above 1.5°C does NOT breach the Paris goal, which is a
            multi-decade average. [ESTABLISHED data; careful framing.]"
          zh: "2024 年是首个超过 1.5°C 的日历年，较 1850–1900 年工业化前水平高出
            1.60°C（哥白尼，2025 年 1 月）；2025 年全球临界点报告警告级联风险——
            注意：单一年份超过 1.5°C 并不违反巴黎协定目标，后者按多年或数十年尺度平均衡量。
            [已确立数据；谨慎框架。]"
      - day: 178
        title:
          en: The Energy Transition & Fusion
          zh: 能源转型与核聚变
        entry:
          en: powering civilization without carbon.
          zh: 以零碳驱动文明。
        model:
          en: the exponential decline of solar/wind/storage costs; grids; fission vs
            fusion.
          zh: 太阳能/风能/储能成本的指数下降；电网；裂变 vs 聚变。
        debate:
          en: the realistic pace and feasibility of transition.
          zh: 转型的现实节奏与可行性。
        frontier:
          en: at the National Ignition Facility, an April 7, 2025 shot delivered a record
            8.6 MJ fusion yield from 2.08 MJ of laser energy (target gain ~4.1),
            with a 10th ignition in October 2025 — a genuine scientific
            milestone, but still far from grid-scale net energy (the lasers draw
            vastly more power than the reaction releases). [ESTABLISHED
            milestone; commercial power distant.]
          zh: 在国家点火装置，2025 年 4 月 7 日的一次射击创造了 8.6 MJ 聚变产额 纪录，来自 2.08 MJ 激光能量（靶增益约 4.1），2025
            年 10 月第 10 次点火—— 真正的科学里程碑，但距电网规模净能量仍遥远（激光消耗的功率远大于反应释放）。
            [已确立里程碑；商业电力遥远。]
      - day: 179
        title:
          en: Biotechnology, Biosecurity & the AI Economy
          zh: 生物技术、生物安全与人工智能经济
        entry:
          en: the double edge of powerful tools.
          zh: 强大工具的双刃剑。
        model:
          en: the benefits and risks of synthetic biology; AI's effects on labor and
            productivity.
          zh: 合成生物学的益处与风险；AI 对劳动与生产力的影响。
        debate:
          en: acceleration vs precaution.
          zh: 加速 vs 谨慎。
        frontier:
          en: 2024–25 governance of AI–biology convergence and economic-impact studies of
            AI.
          zh: 2024–25 年 AI—生物学融合治理与 AI 经济影响研究。
      - day: 180
        title:
          en: "Capstone: Synthesis & The Open Frontier"
          zh: 顶点：综合与开放前沿
        entry:
          en: weaving the whole map together.
          zh: 将整幅地图编织在一起。
        model:
          en: the cross-domain themes that recur everywhere — information, energy,
            evolution, emergence, computation.
          zh: 处处重现的跨域主题——信息、能量、进化、涌现、计算。
        debate:
          en: the biggest open questions spanning all domains (quantum gravity, the origin
            of life, consciousness, the limits of intelligence).
          zh: 跨越所有领域的最大开放问题（量子引力、生命起源、意识、智能极限）。
        frontier:
          en: building a personal framework for lifelong learning and calibrated,
            evidence-based curiosity.
          zh: 构建终身学习与校准的、基于证据的好奇心的个人框架。
