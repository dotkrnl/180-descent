title: 一百八十日知识地图
subtitle: 从根基通往 2026 年研究前沿
purpose: "一门按依赖关系排序的逐日深入课程：平易近人的入口、核心模型、
  实时辩论，以及新近可靠的研究前沿。"
method: 每一天都从一个故事或类比进入心智模型，然后点明辩论，
  并带着炒作过滤器走到当前证据的边缘。
threads:
  - 信息
  - 能量
  - 演化
  - 涌现
  - 计算
frontier_labels:
  - 已确立
  - 有望的线索
  - 争议/炒作
blocks:
  - id: I
    title: 知识与推理的根基
    start_day: 1
    end_day: 14
    summary: "认知工具箱先行：下游的一切都依赖于我们如何为信念辩护并校准它。"
    days:
      - day: 1
        title: 知识是什么？
        entry: 「停了的钟」之盖梯尔谜题。
        model: 有正当理由的真信念及其失效。
        debate: 基础主义 vs 融贯主义 vs 可靠主义。
        frontier: 贝叶斯认识论（Bayesian epistemology）与预测加工的信念形成模型。
      - day: 2
        title: 科学方法与划界
        entry: "太阳明天会升起吗？"
        model: 假设—预测—检验。
        debate: 波普尔的证伪主义（falsification）vs 库恩的范式 vs 拉卡托斯的研究纲领。
        frontier: 复现危机作为真实世界的划界压力测试。
      - day: 3
        title: 逻辑与有效推理
        entry: 三段论与日常谬误。
        model: 演绎 vs 归纳 vs 溯因。
        debate: 逻辑是发现还是发明？
        frontier: 非经典逻辑与机器辅助形式验证。
      - day: 4
        title: 概率作为扩展逻辑
        entry: 蒙提霍尔问题。
        model: 贝叶斯定理作为信念更新。
        debate: 频率派 vs 贝叶斯派（Bayesian）诠释。
        frontier: e-值与现代统计推断改革。
      - day: 5
        title: 因果性
        entry: 冰淇淋销量与溺亡相关。
        model: 混杂因素与反事实。
        debate: 因果性能否仅从观察中推断？
        frontier: 珀尔的 do-演算与算法因果发现。
      - day: 6
        title: 统计学与不自欺的艺术
        entry: 抛硬币的 p 值操控。
        model: 抽样、效应量、置信区间。
        debate: 零假设显著性检验 vs 估计。
        frontier: 2024–25 年的多元宇宙分析与规范曲线分析。
      - day: 7
        title: 信息论
        entry: 二十问游戏。
        model: 香农熵、比特、信道容量。
        debate: 信息是物理的吗？
        frontier: 信息热力学与兰道尔原理（预览生命物理弧线）。
      - day: 8
        title: 复杂性与涌现
        entry: 椋鸟群的集体舞。
        model: 涌现与自组织。
        debate: 强涌现 vs 弱涌现。
        frontier: 组装与复杂性测度——将 Assembly Theory 标记为 [有争议]，而非已确立。
      - day: 9
        title: 系统思维与反馈
        entry: 家用恒温器。
        model: 存量、流量、反馈回路、非线性。
        debate: 还原论 vs 整体论。
        frontier: 耦合系统中的临界点（预览气候主题）。
      - day: 10
        title: 模型、地图与理想化
        entry: 地图不是领土。
        model: 所有模型都是错的，有些有用。
        debate: 科学实在论 vs 工具主义。
        frontier: 模拟与数字孪生的认识论。
      - day: 11
        title: 启发式、偏差与理性
        entry: 琳达「银行出纳员」问题。
        model: 系统 1 / 系统 2（附注）。
        debate: 启发式是缺陷还是适应性捷径？
        frontier: 「理性战争」与生态理性。
      - day: 12
        title: 网络
        entry: 六度分隔。
        model: 节点、枢纽、幂律、传播。
        debate: 无标度网络争议。
        frontier: 网络神经科学与流行病建模。
      - day: 13
        title: 测量与单位
        entry: 一米究竟有多长？
        model: 操作定义与 2019 年国际单位制重定义。
        debate: 基本常数真的恒定吗？
        frontier: 计量学与基本常数变化的检验。
      - day: 14
        title: "综合：我们如何知道"
        note: 回顾认知工具箱；构建个人「置信度校准」框架，
          应用于课程的其余部分。
  - id: II
    title: 数学与形式系统
    start_day: 15
    end_day: 30
    summary: 物理与生物定律所使用的形式语言，以及这些语言的已证极限。
    days:
      - day: 15
        title: 数
        entry: 计数与零的发明。
        model: 自然数 → 整数 → 有理数 → 实数。
        debate: 数学是被发明还是被发现的（柏拉图主义）？
        frontier: 数学在物理中的「不合理的有效性」。
      - day: 16
        title: 素数与黎曼猜想
        entry: 素数作为算术的原子。
        model: 素数分布与 zeta 函数。
        debate: 黎曼猜想作为伟大的开放问题。
        frontier: 零点计算与解析进展。
      - day: 17
        title: 几何
        entry: 球面上的最短路径。
        model: 欧几里得公理 vs 非欧曲率。
        debate: 物理空间是平的吗？
        frontier: 微分几何作为广义相对论的语言。
      - day: 18
        title: 代数与对称
        entry: 一个魔方。
        model: 群与不变量。
        debate: 抽象 vs 直觉。
        frontier: 诺特定理将对称与守恒律联系起来。
      - day: 19
        title: 函数与变化
        entry: 给浴缸注水。
        model: 速率、斜率与极限概念。
        debate: 无穷小曾经严谨吗？
        frontier: 通过 epsilon-delta 与非标准分析奠基。
      - day: 20
        title: "微积分 I：导数"
        entry: 速度计 vs 里程表。
        model: 瞬时变化率。
        debate: 牛顿—莱布尼茨优先权之争。
        frontier: 自动微分作为深度学习的引擎。
      - day: 21
        title: "微积分 II：积分与微积分基本定理"
        entry: 面积作为累积变化。
        model: 连接导数与积分的基本定理。
        debate: '「曲线下面积」究竟意味着什么？'
        frontier: 测度论与勒贝格积分。
      - day: 22
        title: 微分方程
        entry: 种群增长与衰减。
        model: 常微分方程作为几乎所有事物的运动定律。
        debate: 决定论 vs 混沌。
        frontier: 神经 ODE 与科学机器学习。
      - day: 23
        title: 混沌与非线性动力学
        entry: 蝴蝶效应。
        model: 敏感依赖与奇异吸引子。
        debate: 可预测性的极限。
        frontier: 数据驱动动力学与水库计算。
      - day: 24
        title: 概率与随机性（形式化）
        entry: 醉汉的随机游走。
        model: 分布、中心极限定理、马尔可夫链。
        debate: 什么是随机性？
        frontier: 蒙特卡洛方法与概率编程。
      - day: 25
        title: 统计推断
        entry: 从样本调查一个国家。
        model: 估计量与回归。
        debate: 因果建模 vs 预测建模。
        frontier: 高维统计与双降现象。
      - day: 26
        title: 无穷与集合论
        entry: 希尔伯特旅馆。
        model: 可数与不可数无穷；康托对角线论证。
        debate: 连续统假设。
        frontier: 大基数与独立性结果。
      - day: 27
        title: 计算与图灵机
        entry: 机器可以遵循的食谱。
        model: 算法与通用计算。
        debate: 心智是计算机吗？
        frontier: 为何超计算提案需要被审慎看待。
      - day: 28
        title: "形式系统的极限：哥德尔"
        entry: "此命题不可证。"
        model: 不完备定理。
        debate: 对心智与数学的意涵。
        frontier: 逆数学与 Lean 等证明助手。
      - day: 29
        title: P vs NP 与复杂性类
        entry: 易于验证，难以求解（一个数独）。
        model: 可解性与 NP 完备性。
        debate: P = NP 吗？
        frontier: 与密码学的联系以及 2024 年 AI-for-math（AlphaProof 解出 2024 IMO 最难一题，
          600 余名人类选手中仅 5 人完全解出）。[已确立]
      - day: 30
        title: "综合：数学作为一座塔"
        note: 绘制数学的依赖树，并预览每种工具如何驱动物理学。
  - id: III
    title: "物理：从经典到量子"
    start_day: 31
    end_day: 48
    summary: 物质与能量的行为，以直觉优先的方式通过多日的相对论与量子弧线构建。
    days:
      - day: 31
        title: "经典力学：牛顿"
        entry: 抛出的球为何划弧。
        model: F = ma 与守恒律。
        debate: 超距作用的谜题。
        frontier: 太阳系长期的混沌不稳定性。
      - day: 32
        title: 拉格朗日力学与哈密顿力学
        entry: 自然的「懒惰」（最小作用量）。
        model: 作用量原理与相空间。
        debate: 这些只是重新表述，还是更深的某种东西？
        frontier: 辛积分器与最优控制。
      - day: 33
        title: "热力学：四大定律"
        entry: 咖啡为何总会变凉。
        model: 能量、熵、温度。
        debate: 时间箭头的起源。
        frontier: "涨落定理（预览生命物理专题深入）。关键线索：能量/熵在生命、
          新陈代谢、经济学中重现。"
      - day: 34
        title: 统计力学
        entry: 从抖动分子到温度。
        model: 微观状态与玻尔兹曼分布。
        debate: 不可逆性如何从可逆的微观定律中涌现？
        frontier: 非平衡统计力学。
      - day: 35
        title: 波与光
        entry: 池塘中的涟漪。
        model: 叠加与干涉。
        debate: 历史上的波粒之争。
        frontier: 超材料与现代光子学。
      - day: 36
        title: "电磁学：麦克斯韦"
        entry: 指南针靠近导线时的偏转。
        model: 场与麦克斯韦方程组统一电、磁、光。
        debate: 光以太。
        frontier: 电磁对称性如何迫使相对论诞生。
      - day: 37
        title: 狭义相对论 I
        entry: 火车与闪电思想实验。
        model: c 的恒定性与同时性的相对性。
        debate: 时间是真实的吗？
        frontier: 洛伦兹不变性的精密检验。
      - day: 38
        title: "狭义相对论 II：E=mc²"
        entry: 质量作为冻结的能量。
        model: 时空与四矢量。
        debate: 相对论性质量的诠释。
        frontier: 粒子物理中的应用。
      - day: 39
        title: 广义相对论 I
        entry: 蹦床上的保龄球。
        model: 引力作为时空弯曲。
        debate: 爱因斯坦 vs 牛顿。
        frontier: 2015 年至今的引力波天文学（LIGO/Virgo/KAGRA）。[已确立]
      - day: 40
        title: "广义相对论 II：黑洞"
        entry: 光无法逃逸。
        model: 事件视界与奇点。
        debate: 信息悖论。
        frontier: 2019/2022 年事件视界望远镜图像与黑洞热力学。[已确立]
      - day: 41
        title: "量子力学 I：量子跃迁"
        entry: 原子为何不会坍缩。
        model: 量子化与波函数。
        debate: 自然真的是离散的吗？
        frontier: 为测量问题搭建舞台。
      - day: 42
        title: "量子力学 II：叠加与双缝"
        entry: 一个粒子穿过两条缝。
        model: 概率幅与玻恩定则。
        debate: 什么在物理上算一次「测量」？
        frontier: 宏观叠加实验。
      - day: 43
        title: "量子力学 III：纠缠与贝尔"
        entry: 爱因斯坦的「幽灵般的超距作用」。
        model: 纠缠与贝尔不等式。
        debate: 定域性 vs 实在论。
        frontier: 2022 年诺贝尔奖（阿斯佩、克劳泽、蔡林格）与无漏洞贝尔检验。[已确立]
      - day: 44
        title: 量子诠释
        entry: 薛定谔的猫是死是活？
        model: 哥本哈根、多世界、导波、QBism。
        debate: 哪一个（如果有）是可检验的？
        frontier: 客观坍缩模型正在经受实验检验。
      - day: 45
        title: 量子场论与标准模型
        entry: 粒子作为底层场中的涟漪。
        model: 规范对称与粒子动物园。
        debate: 自然性/等级问题。
        frontier: 精密希格斯测量。
      - day: 46
        title: 缪子 g-2 的故事
        entry: 一个摇摆的磁陀螺。
        model: 虚粒子如何微调缪子的磁性。
        debate: 长达十年看似指向标准模型之外的异常。
        frontier: 2025 年 6 月 3 日费米实验室最终结果（aμ 至 127 ppb）+ 2025 年理论倡议白皮书
          （改用格点 QCD 计算强子真空极化）现在显示与标准模型无显著张力。
          [已确立——「新物理」诠释现已被取代。]
      - day: 47
        title: 量子计算
        entry: 同时探索多条路径（谨慎表述）。
        model: 量子比特、叠加、退相干、纠错。
        debate: 实际优势 vs 炒作。
        frontier: Google「Willow」105 量子比特芯片——错误率随量子比特增加而下降，
          展示低于阈值的纠错（Nature，2024 年 12 月）。[已确立里程碑；商业优势仍遥远。]
      - day: 48
        title: "综合：两大支柱"
        note: 为何相对论与量子理论仍未统一；预览量子引力问题。
  - id: IV
    title: "宇宙学与天体物理 + 专题深入 1：哈勃张力"
    start_day: 49
    end_day: 62
    summary: 大尺度宇宙，深入精确宇宙学最大的危机。
    days:
      - day: 49
        title: 天空作为时间机器
        entry: 星光即过去。
        model: 光年与回望时间。
        debate: 我们如何实际测量距离？
        frontier: 多信使天文学。
      - day: 50
        title: 宇宙距离阶梯
        entry: 以视亮度判断距离。
        model: 视差 → 造父变星 → Ia 型超新星。
        debate: 校准系统误差。
        frontier: JWST 对每一级阶梯的重新校准。
      - day: 51
        title: 膨胀的宇宙
        entry: 发酵面团中的葡萄干。
        model: 哈勃定律、红移、尺度因子。
        debate: 什么在「膨胀」？
        frontier: 哈勃常数问题（为专题深入铺垫）。
      - day: 52
        title: 大爆炸与宇宙微波背景
        entry: 宇宙的婴儿照片。
        model: 炽热致密起源、复合与宇宙微波背景。
        debate: 大爆炸 vs 被抛弃的替代方案。
        frontier: 普朗克与 ACT 精确宇宙学。
      - day: 53
        title: "专题深入 1：哈勃张力——两个数字"
        entry: 67 对 73。
        model: 早期宇宙值，Planck 2018 ΛCDM H0 = 67.4 ± 0.5 km/s/Mpc（Planck Collaboration VI），
          vs 晚期宇宙距离阶梯，SH0ES H0 = 73.04 ± 1.04 km/s/Mpc（Riess et al. 2022）。
        debate: 测量误差 vs 新物理。
        frontier: 差异现已达 ~5σ。[已确立张力存在；原因未解。]
      - day: 54
        title: "哈勃张力：距离阶梯的辩护"
        entry: 尘埃或拥挤是否在欺骗我们？
        model: SH0ES 方法论。
        debate: 造父变星是否被拥挤/尘埃污染？
        frontier: 2024 年 JWST 造父变星观测在 8σ 水平上排除未被识别的拥挤；
          本地值接近 73 依然坚挺。[已确立]
      - day: 55
        title: "哈勃张力：早期宇宙阵营"
        entry: 由声音制成的宇宙尺。
        model: 声视界与重子声学振荡。
        debate: 这把尺是否校准错误？
        frontier: 声视界无关方法与逆距离阶梯方法。
      - day: 56
        title: "哈勃张力：TRGB 与独立方法"
        entry: 一种不同的标准烛光。
        model: 红巨星枝尖（Freedman 的 CCHP）。
        debate: TRGB 是否倾向于更低的中间 H0？
        frontier: 2025 年 JWST TRGB 校准及其与造父变星的分歧。[有争议——方法之间有分歧。]
      - day: 57
        title: "哈勃张力：提议的新物理"
        entry: 早期一次短暂的额外推动。
        model: 早期暗能量。
        debate: 它是否同时拟合所有数据集？
        frontier: EDE 约束与大规模结构数据的张力。[有望的线索，尚未确立。]
      - day: 58
        title: "哈勃张力：时间延迟宇宙学"
        entry: 来自透镜类星体的宇宙停表。
        model: 强透镜时间延迟（H0LiCOW/TDCOSMO）。
        debate: 质量片退化。
        frontier: JWST 透镜时间延迟项目作为独立的、无阶梯的探针。
      - day: 59
        title: DESI 与演化的暗能量
        entry: 有史以来最大的宇宙三维地图。
        model: 110 亿年间的重子声学振荡。
        debate: 暗能量真的是常数吗？
        frontier: DESI DR2（2025 年 3 月 19 日）显示在 Planck 下对演化暗能量有 3.1σ 偏好，
          在某些超新星样本（Union3、DES）下约 4σ，在 Pantheon+ 下约 2.5σ——
          强烈依赖于样本选择，低于 5σ。[有望的线索——当作线索，而非结果。]
      - day: 60
        title: 暗物质
        entry: 星系转得太快，无法维系自身。
        model: 旋转曲线、引力透镜、子弹星系团。
        debate: 粒子暗物质 vs 修正引力（MOND）。
        frontier: 截至 2026 年持续的直接探测零结果。
      - day: 61
        title: JWST 与早期宇宙惊喜
        entry: 星系看起来太大、出现得太早。
        model: 高红移星系形成。
        debate: 早期大质量星系是否打破 ΛCDM？
        frontier: 2023–25 年 JWST 光谱证认与提出的解释（高效恒星形成，未必是新物理）。
          [有望的线索——很可能在 ΛCDM 内可解。]
      - day: 62
        title: 天体生物学与生物信号
        entry: 我们孤独吗？
        model: 宜居带与生物信号气体。
        debate: K2-18b 二甲基硫主张（Madhusudhan et al. 2025）仅达 ~3σ，
          并被多项独立再分析（Luque et al.、Welbanks et al.、Taylor 2025）反驳为「证据不足」；
          并非生命证据。
        frontier: 正式天体生物学证据标准框架。[争议/炒作。]
  - id: V
    title: 化学与材料
    start_day: 63
    end_day: 72
    summary: 原子如何结合成世界与生命的物质。
    days:
      - day: 63
        title: 原子
        entry: 物质的乐高积木。
        model: 原子核加电子轨道。
        debate: 玻尔模型 vs 完整量子图像。
        frontier: 阿秒电子运动成像（2023 年诺贝尔物理学奖）。[已确立]
      - day: 64
        title: 元素周期表
        entry: 元素的地址系统。
        model: 周期性源于电子壳层。
        debate: 元素排位的争议（如第 3 族、氢）。
        frontier: 超重元素合成与「稳定岛」。
      - day: 65
        title: 化学键
        entry: 为何盐与水的行为如此不同。
        model: 离子键、共价键与金属键。
        debate: '「键」是真实实体还是簿记？'
        frontier: 量子化学与密度泛函理论。
      - day: 66
        title: 反应、能量与平衡
        entry: 火与锈。
        model: 热力学加动力学；催化。
        debate: 控制反应路径。
        frontier: 机器学习催化剂发现。
      - day: 67
        title: 有机化学与碳的化学
        entry: 碳为何是生命的脚手架。
        model: 官能团与异构。
        debate: 合成 vs 天然产物。
        frontier: 自动化逆合成规划。
      - day: 68
        title: 水与酸碱
        entry: 水为何是如此奇怪的物质。
        model: pH 与氢键。
        debate: 水的结构异常。
        frontier: 液态水微观结构的持续争议。
      - day: 69
        title: 材料科学
        entry: 钢为何优于纯铁。
        model: 晶体结构、缺陷与相。
        debate: 理性设计 vs 偶然发现。
        frontier: 2023–24 年 AI 驱动材料发现（DeepMind 的 GNoME）。
      - day: 70
        title: 超导与一个警示故事
        entry: 磁铁悬浮于冷却盘之上。
        model: 库珀对与 BCS 理论。
        debate: 室温超导的梦想。
        frontier: LK-99（2023）已被确凿证明不是超导体——炒作、复现失败与科学如何自我纠正的案例研究。
          [争议/炒作 → 已证伪。保留为警示课程。]
      - day: 71
        title: 绿色与计算化学
        entry: 最小化废弃物的化学。
        model: 原子经济性、催化、模拟优先设计。
        debate: 绿色方法的可扩展性。
        frontier: 电化学与光化学用于脱碳。
      - day: 72
        title: "综合：从原子到物质"
        note: 化学如何桥接物理与生物；预览生命的分子。
  - id: VI
    title: "生物与进化 + 专题深入 2：生命的物理"
    start_day: 73
    end_day: 92
    summary: 生命是什么以及它如何可能开始，以热力学为根基。
    days:
      - day: 73
        title: 什么是生命？
        entry: 病毒算活着吗？
        model: 新陈代谢、复制、稳态。
        debate: 定义问题。
        frontier: 合成最小细胞；将 Assembly Theory 标记为 [有争议] 的通用定义尝试。
      - day: 74
        title: 自然选择下的进化
        entry: 达尔文的雀鸟。
        model: 变异、遗传、差异存活。
        debate: 渐进论 vs 间断平衡。
        frontier: "Lenski 长期进化实验实时进行。关键线索：进化/选择重现于心理学、
          文化、人工智能。[已确立]"
      - day: 75
        title: 现代综合与超越
        entry: 基因遇见种群。
        model: 种群遗传学与遗传漂变。
        debate: 是否需要「扩展进化综合」？
        frontier: 进化发育生物学与生态位构建。
      - day: 76
        title: 细胞
        entry: 一座微型城市。
        model: 膜、细胞器、原核 vs 真核。
        debate: 真核复杂性的起源。
        frontier: 冷冻电镜细胞机器可视化。
      - day: 77
        title: "分子机器：DNA → RNA → 蛋白质"
        entry: 食谱到机器的流水线。
        model: 中心法则。
        debate: 它有多「中心」？
        frontier: "RNA 扩展的调控角色。线索：信息。"
      - day: 78
        title: 蛋白质与折叠
        entry: 执行工作的折纸。
        model: 序列 → 结构 → 功能。
        debate: 蛋白质折叠问题。
        frontier: AlphaFold 2/3（2024）预测蛋白质及其与 DNA、RNA、配体的复合物结构。
          [已确立]
      - day: 79
        title: 新陈代谢与生物能量学
        entry: 细胞如何谋生。
        model: ATP、电子传递、化学渗透。
        debate: 新陈代谢优先 vs 基因优先起源。
        frontier: "生命起源的生物能量学。线索：能量。"
      - day: 80
        title: 发育
        entry: 一个细胞变成整个生物体。
        model: 基因调控网络与形态发生素梯度。
        debate: 身体计划的本质。
        frontier: 合成胚胎/胚状体（2023–24）。
      - day: 81
        title: 生态与生态系统
        entry: 食物网。
        model: 能量流、生态位、演替。
        debate: '「自然平衡」神话。'
        frontier: 生态临界点与再野化科学。
      - day: 82
        title: 微生物组
        entry: 按细胞计数，你在数量上大多是微生物。
        model: 宿主—微生物共生。
        debate: 在微生物组主张中区分相关与因果。
        frontier: "2023–25 年因果微生物组—疾病研究（无菌与 FMT 工作）。
          [混合：部分已确立，大量有望的线索。]"
      - day: 83
        title: "专题深入 2：熵与生命之谜"
        entry: 生命似乎违抗无序。
        model: 薛定谔的「负熵」；生命作为开放系统输出熵。
        debate: 生命违反第二定律吗（不）？
        frontier: "用信息热力学框架理解生命。线索：能量 + 信息交汇。"
      - day: 84
        title: 远离平衡态的热力学
        entry: 一个维持自身形状的漩涡。
        model: 普里高津的耗散结构。
        debate: 这类结构有多普遍？
        frontier: 非平衡稳态与模式形成。
      - day: 85
        title: 涨落定理与兰道尔原理
        entry: 遗忘的能量代价。
        model: Jarzynski 与 Crooks 关系；擦除一比特至少耗费 kT·ln2。
        debate: 麦克斯韦妖终于被驱除了吗？
        frontier: 确认兰道尔的单分子与比特擦除实验。[已确立] 回调第 7 日。
      - day: 86
        title: 耗散适应
        entry: '「调谐自身」以吸收能量的物质。'
        model: Jeremy England 的假设：强驱动物质自组织以耗散能量。
        debate: 一个有趣且活跃的想法，但明确标记为 [有争议]——
          不是已确立的生命起源理论。
        frontier: 支持性模拟及其批评。
      - day: 87
        title: "无生源说：RNA 世界"
        entry: 一种既是基因又是机器的分子。
        model: RNA 自复制。
        debate: RNA 优先 vs 新陈代谢优先 vs 脂质优先。
        frontier: 近期的核酶与原始细胞实验。
      - day: 88
        title: "无生源说：热液喷口与地球化学"
        entry: 生命来自岩石与热。
        model: 碱性喷口与自然质子梯度。
        debate: 深海喷口 vs 达尔文的「温暖的小池塘」。
        frontier: 2023–25 年前生命化学结果。
      - day: 89
        title: "生命起源：区室与自催化"
        entry: 一个生长并分裂的气泡。
        model: 原始细胞与自催化集。
        debate: 哪个子系统首先自举？
        frontier: 结合分子复制与区室化的系统化学实验。
      - day: 90
        title: "生命起源：生命本身的理论"
        entry: '「活着」能被定义为物理过程吗？'
        model: 自创生与（标记）Assembly Theory。
        debate: 生命的普遍理论甚至可能存在吗？
        frontier: 2023–24 年 Assembly Theory 论文及化学家与复杂性科学家的实质性批评。
          [有争议。]
      - day: 91
        title: 生命之树与最后共同祖先
        entry: 每个人的最后共同祖先。
        model: 系统发育学与水平基因转移。
        debate: LUCA 何时何地生活？
        frontier: 2024 年分子钟估计将 LUCA 推得更早，并表征其基因集。
      - day: 92
        title: "综合：生命作为物理 + 历史"
        note: 将热力学、化学与进化串联起来；过渡到遗传学与医学。
  - id: VII
    title: "遗传学、生物技术与医学 + 专题深入 3：跨代表观遗传"
    start_day: 93
    end_day: 116
    summary: 从遗传到临床，扩展覆盖身体、免疫系统与现代医学。
    days:
      - day: 93
        title: "遗传：从孟德尔到沃森—克里克"
        entry: 孩子为何像父母。
        model: 基因、等位基因、双螺旋。
        debate: 混合遗传 vs 颗粒遗传。
        frontier: 结构基因组学。
      - day: 94
        title: 基因组
        entry: 三十亿个字母。
        model: 基因、调控与所谓「垃圾」DNA。
        debate: 基因组有多少是功能性的（ENCODE 辩论）？
        frontier: 完整的端粒到端粒人类基因组（2022）与人类泛基因组（2023）。[已确立]
      - day: 95
        title: 基因表达与调控
        entry: 同一套 DNA 建造神经元与肝细胞。
        model: 转录因子与增强子。
        debate: 调控复杂性的规模。
        frontier: 单细胞多组学图谱。
      - day: 96
        title: "表观遗传学：工具箱"
        entry: 基因之上的调光开关。
        model: DNA 甲基化、组蛋白修饰、染色质状态。
        debate: 什么应算作「表观遗传」？
        frontier: 靶向表观基因组编辑。
      - day: 97
        title: "专题深入 3：两波重编程"
        entry: 基因组的「重置按钮」。
        model: 哺乳动物经历两轮全基因组重编程——原始生殖细胞中的生殖系重编程
          （印记擦除 ~E10.5–E12.5）与受精后重编程——擦除大多数表观遗传标记；
          只有印记控制区与一些 IAP 逆转录转座子可靠地逃逸。
        debate: 这种双重擦除是真正跨代遗传面临的核心机制屏障。
        frontier: 2025 年 Nature Communications 生殖系表观基因组编辑研究显示 DNA 甲基化
          可在受精后通过 H3K9me3 部分恢复——代际恢复，而非跨代传递。
      - day: 98
        title: 代际 vs 跨代遗传
        entry: 究竟是谁真正暴露？
        model: 当怀孕 F0 雌性暴露时，她的胎儿（F1）及该胎儿的生殖细胞（未来的 F2）
          也直接暴露——因此只有 F3（母系）或 F2（父系）才能证明真正的跨代遗传。
        debate: 大多数流行主张将直接暴露与遗传混为一谈。
        frontier: Heard & Martienssen（Cell，2014）的标准与 Khatib et al.（Epigenetics，2024）
          在审阅 80 项研究后提出的五项正式标准。
      - day: 99
        title: 争议的哺乳动物案例
        entry: 你听过的那些著名研究。
        model: Agouti viable-yellow 小鼠、Dias–Ressler 气味恐惧研究（Nat. Neurosci. 2014）、
          乙烯菌核利（Anway/Skinner 2005）与 Överkalix/荷兰饥荒冬季人类队列。
        debate: Agouti 饮食效应未能复现（Bertozzi et al.，Nat. Genet. 2021）；
          Överkalix 发现未能在约 40 倍大的队列中复现（Vågerö et al.，Nat. Commun. 2018）。
        frontier: Adrian Bird 2024 年批判性视角，结论为哺乳动物跨代表观遗传（TEI）薄弱、
          罕见且机制上未验证—— vs 植物与秀丽隐杆线虫中的稳健遗传。
          [有争议——哺乳动物跨代表观遗传大体未获支持。]
      - day: 100
        title: Takahashi 2023 测试案例
        entry: 我们能设计遗传吗？
        model: Takahashi et al.（Cell，2023）使用 CRISPR 诱导 CpG 岛甲基化，
          传播代谢表型约 4 代。
        debate: 它需要一个起始的遗传缺失；Sapozhnikov & Szyf（Epigenetics，2024）
          认为该方法放大了遗传混杂；Horsthemke & Bird（2023）表明仅甲基化（无突变）不可遗传。
        frontier: 为何这一里程碑并不是哺乳动物环境诱导 TEI 的证据。[有争议。]
      - day: 101
        title: 蛋白质折叠与药物设计
        entry: 知道分子形状预测其功能。
        model: 基于结构的药物设计。
        debate: 静态预测 vs 动态行为。
        frontier: AlphaFold 3（2024）与从头蛋白质设计（Baker 实验室；
          2024 年诺贝尔化学奖授予 Baker、Hassabis、Jumper）。[已确立]
      - day: 102
        title: CRISPR 与基因编辑
        entry: 分子层面的查找与替换。
        model: Cas9 切割与细胞修复。
        debate: 生殖系编辑的伦理（2018 年贺建奎丑闻）。
        frontier: Casgevy，首个获批的 CRISPR 疗法（2023），用于镰状细胞病。[已确立]
      - day: 103
        title: 碱基编辑与先导编辑
        entry: 铅笔与橡皮，而非剪刀。
        model: 化学重写单个 DNA 碱基，无需双链断裂。
        debate: 递送挑战与脱靶效应。
        frontier: 2024–25 年体内碱基编辑临床结果。
      - day: 104
        title: "身体如何工作 I：系统概述"
        entry: 身体作为整合机器。
        model: 器官系统与稳态。
        debate: 还原论 vs 系统医学。
        frontier: 器官芯片平台与生理数字孪生。
      - day: 105
        title: "身体如何工作 II：心脏、肺、血液"
        entry: 泵与管道。
        model: 循环与气体交换。
        debate: 不断演化的心血管风险模型。
        frontier: 2024 年心脏代谢预防数据。
      - day: 106
        title: "身体如何工作 III：肠道、肝脏、肾脏"
        entry: 摄入、处理与过滤。
        model: 消化、解毒、体液平衡。
        debate: 揭穿「排毒」神话。
        frontier: 肠—脑轴与肠—肝轴。
      - day: 107
        title: "免疫系统 I：先天与适应性"
        entry: 身体的常备军与特种部队。
        model: 屏障、先天应答、B 与 T 细胞、抗体。
        debate: 自我/非我耐受如何建立？
        frontier: 先天细胞中的「训练免疫」。
      - day: 108
        title: "免疫系统 II：记忆与疫苗"
        entry: 为何你不会得两次麻疹。
        model: 免疫记忆。
        debate: 疫苗犹豫的科学。
        frontier: mRNA 平台（2023 年诺贝尔医学奖）与治疗性癌症疫苗。[已确立]
      - day: 109
        title: 癌症
        entry: 不会停止分裂的细胞。
        model: 癌症标志与克隆进化。
        debate: 靶向 vs 广谱疗法。
        frontier: 2024–25 年免疫疗法进展与循环肿瘤 DNA 早期检测。
      - day: 110
        title: 免疫疗法与 CAR-T
        entry: 将患者自身 T 细胞重编程为癌症杀手。
        model: 检查点抑制剂与嵌合抗原受体（CAR）T 细胞。
        debate: 成本、持久性、毒性。
        frontier: CAR-T 向自身免疫疾病扩展——BMS 一期 Breakfree-1 报告 71 名患者
          跨越狼疮、系统性硬化症、肌炎，可评估患者中 94% 在分析时停用慢性免疫抑制
          （ACR Convergence 2025）。[有望的线索——早期阶段。]
      - day: 111
        title: 传染病与流行病
        entry: 爆发如何传播。
        model: R0、传播动力学、群体免疫。
        debate: COVID-19 的实验室泄漏 vs 动物起源。
        frontier: 大流行防范与抗微生物耐药性。
      - day: 112
        title: 代谢科学与 GLP-1 药物
        entry: 一种发出饱腹信号的肠道激素。
        model: 肠促胰岛素生物学（GLP-1 与 GIP 受体）。
        debate: 肥胖被重新框架为慢性疾病。
        frontier: SURMOUNT-5 头对头（NEJM，2025 年 5 月）——72 周时替尔泊肽产生 20.2%
          平均减重 vs 司美格鲁肽 13.7%，心脏代谢改善更大。[已确立]
      - day: 113
        title: "衰老生物学：标志"
        entry: 身体为何磨损。
        model: 衰老标志（基因组不稳定性、端粒缩短、表观遗传改变、细胞衰老等）。
        debate: 哪些标志是原因，哪些是症状？
        frontier: 2023 年更新的十二标志框架（López-Otín et al.）。[已确立框架。]
      - day: 114
        title: 长寿干预
        entry: 我们能减缓衰老本身吗？
        model: 衰老细胞清除剂、雷帕霉素、热量限制。
        debate: 延长 lifespan vs healthspan。
        frontier: 人体试验——以及为何人类「逆转」主张应被强烈怀疑。
          [争议/炒作针对人类「逆转」。]
      - day: 115
        title: 部分重编程
        entry: 回拨细胞时钟。
        model: 山中因子（OSK/OSKM）的周期性表达使小鼠细胞与组织恢复年轻。
        debate: 癌症风险与细胞身份丧失。
        frontier: 2023–24 年体内小鼠研究（包括神经元特异性重编程）——
          明确并非已证实为人类年龄逆转。[有望的线索在小鼠中；不在人类中。]
      - day: 116
        title: "综合：2026 年的医学"
        note: 从分子到临床；对生物技术中何为真实、何为炒作的清醒盘点。
  - id: VIII
    title: "脑、心智与意识 + 专题深入 4：意识理论"
    start_day: 117
    end_day: 130
    summary: 从神经元到困难问题与 2025 年对抗性合作结果。
    days:
      - day: 117
        title: 神经元与神经信号
        entry: 跃过缝隙的火花。
        model: 动作电位、突触、神经递质。
        debate: 发放率编码 vs 脉冲时间编码。
        frontier: 连接组学（2024 年完成果蝇全脑连接组）。[已确立]
      - day: 118
        title: 脑架构
        entry: 心智地产的地图。
        model: 皮层、皮层下结构、大规模网络。
        debate: 功能定位 vs 分布式处理。
        frontier: 综合 2023 年人类脑细胞图谱。
      - day: 119
        title: 知觉
        entry: 视错觉为何可靠地欺骗你。
        model: 大脑作为预测机器。
        debate: 自下而上 vs 自上而下加工。
        frontier: 预测加工与主动推断。
      - day: 120
        title: 记忆
        entry: 转瞬即逝的时刻如何变为永久。
        model: 编码、巩固、印迹。
        debate: 记忆根本上是重构性的吗？
        frontier: 小鼠的光遗传印迹植入与操纵。
      - day: 121
        title: 情绪
        entry: 先于有意识思想袭来的恐惧。
        model: 边缘回路 vs 构建情绪理论。
        debate: 普遍的「基本情绪」（Ekman）vs 构建（Barrett）。
        frontier: 内感受研究。
      - day: 122
        title: 睡眠与梦
        entry: 为何我们花三分之一的生命处于无意识。
        model: 睡眠阶段、记忆巩固、胶质淋巴废物清除。
        debate: 梦的功能（们）。
        frontier: 2023–25 年睡眠与阿尔茨海默病理的联系。
      - day: 123
        title: "专题深入 4：困难问题"
        entry: 为何看见红色时「有某种感受」？
        model: 查尔默斯区分「简单」问题与困难问题；解释鸿沟。
        debate: 物理主义 vs 二元论 vs 泛心论。
        frontier: 意识的「元问题」。
      - day: 124
        title: 全局神经元工作空间理论
        entry: 意识作为脑范围的「广播」。
        model: 信息被全局可用，伴以前额「点燃」。
        debate: 前额叶皮层对经验是否必要？
        frontier: Cogitate 合作对 GNWT 预测的检验。
      - day: 125
        title: 整合信息理论
        entry: 意识作为系统整体超越各部分之和的程度。
        model: 整合信息（Φ）与后部「热点区」。
        debate: IIT 的泛心论意涵。
        frontier: 关于「IIT 作为伪科学」的公开信（Fleming et al.，2023 年 9 月 15 日，PsyArXiv，
          124 位签名者包括 Baars、Dennett、LeDoux）——以及 Anil Seth 与 David Chalmers
          的有力反驳。[有争议——标签本身有争议。]
      - day: 126
        title: Cogitate 对抗性合作
        entry: 对立理论同意决斗。
        model: 研究预登记、理论中立的正面交锋测试，使用 fMRI、MEG、颅内 EEG。
        debate: 谁「赢了」？
        frontier: Cogitate 联盟结果（Nature，第 642 卷，133–142 页，2025 年 6 月 5 日）
          挑战了两种理论——支持 IIT 的后部皮层充分性主张（前额广播不必要），
          同时反驳了 IIT 的持续后部同步预测，以及 GNWT 的刺激偏移点燃预测。
          [已确立结果；解读仍在进行中。]
      - day: 127
        title: 高阶与其他理论
        entry: 拥有关于你思想的思想。
        model: 高阶理论、循环加工理论、注意图式理论。
        debate: 竞争理论的激增。
        frontier: 理论中立的大规模实验项目。
      - day: 128
        title: 临床意识
        entry: 有人「在里面」吗？
        model: 昏迷、植物/无反应状态、麻醉。
        debate: 检测隐蔽觉知。
        frontier: Bodien、Edlow et al.（NEJM，2024 年 8 月 15 日）在 241 名无反应患者中
          于 60 名（25%）检测到认知运动分离——他们对指令没有可观察的反应，
          但在脑成像上有反应。[已确立]
      - day: 129
        title: 动物与机器意识
        entry: 章鱼有意识吗？AI 可能有吗？
        model: 行为与神经感知能力标志。
        debate: 2024 年《纽约动物意识宣言》。
        frontier: AI 意识主张，以及为何谨慎与降温是必要的。
      - day: 130
        title: 自由意志与自我
        entry: 是你选择读这句话的吗？
        model: 利贝特准备电位实验及其批评。
        debate: 相容论 vs 硬决定论。
        frontier: 准备电位作为随机积累的修正诠释。
  - id: IX
    title: "智能：认知与人工智能 + 专题深入 5：通用人工智能/对齐"
    start_day: 131
    end_day: 146
    summary: 自然与人工心智，含对通用人工智能的公平双面辩论。
    days:
      - day: 131
        title: 认知科学
        entry: 心智作为信息处理器。
        model: 心理表征与模块化。
        debate: 符号 vs 联结主义架构。
        frontier: 预测加工作为统一框架。
      - day: 132
        title: 启发式、偏差与双过程
        entry: 快思慢想。
        model: 卡尼曼—特沃斯基偏差项目。
        debate: 启动效应与自我损耗能否复现。
        frontier: 复现危机后的重新校准。回调第 11 日、第 149 日。
      - day: 133
        title: 语言与心智
        entry: 儿童如何不经指导掌握语法。
        model: 乔姆斯基普遍语法 vs 基于使用的学习。
        debate: 先天 vs 习得语言。
        frontier: 大型语言模型揭示（及未揭示）的语言可学性。
      - day: 134
        title: "智能：它是什么？"
        entry: 单一数字能捕捉「聪明」吗？
        model: g 因素 vs 多元智能理论。
        debate: IQ 的有效性与历史误用。
        frontier: 2023–25 年认知基因组学发现及其重重警示。[需谨慎对待。]
      - day: 135
        title: 人工智能史
        entry: 从图灵测试到深蓝。
        model: 符号人工智能、专家系统、「AI 寒冬」。
        debate: 为何联结主义最终获胜。
        frontier: 2012 年以来的深度学习革命。
      - day: 136
        title: 机器学习基础
        entry: 从例子学习而非从规则。
        model: 训练、损失函数、泛化、过拟合。
        debate: 插值 vs 真正理解。
        frontier: 双降现象与缩放行为。回调第 25 日。
      - day: 137
        title: 深度学习与神经网络
        entry: 堆叠的模式检测器层。
        model: 反向传播与表征学习。
        debate: 网络「理解」任何东西吗？
        frontier: 基础模型的兴起。回调第 20 日（自动微分）。
      - day: 138
        title: 大语言模型如何工作
        entry: 一个非常精密的自动补全。
        model: Transformer、注意力、下一 token 预测。
        debate: '「随机鹦鹉」 vs 涌现世界模型。'
        frontier: 2024–25 年证据表明模型学习世界的结构化内部表征。
      - day: 139
        title: "专题深入 5：缩放定律与涌现"
        entry: 更大的模型会突然学会新把戏吗？
        model: 损失随计算与数据可预测的幂律缩放。
        debate: 所谓「涌现能力」，是真实的相变还是指标选择的人为产物
          （Schaeffer、Miranda & Koyejo，"Are Emergent Abilities a Mirage?"，NeurIPS 2023）？
        frontier: 即使承认底层平滑缩放，下游能力仍难以预测。回调第 8 日（涌现）。
          [有争议针对「涌现」。]
      - day: 140
        title: 推理模型
        entry: 一个「先思考再说话」的模型。
        model: 思维链提示、推理时计算、推理迹上的强化学习。
        debate: 真正推理 vs 复杂的模式匹配。
        frontier: 2024–25 年推理系统与 DeepMind 的 AlphaProof + AlphaGeometry 2，
          在 2024 年 IMO 获 28/42——银牌水平，距金牌一分之差。回调第 29 日。[已确立结果。]
      - day: 141
        title: 机制可解释性
        entry: 撬开黑箱。
        model: 特征、回路、叠加。
        debate: 我们能完全解释一个前沿模型吗？
        frontier: 2024 年大规模稀疏自编码器特征提取（Anthropic 的可解释「Golden Gate Claude」）。
          [有望——早期科学。]
      - day: 142
        title: "人工智能对齐：问题"
        entry: 按字面意思实现你愿望的精灵。
        model: 目标误设、奖励黑客、工具性收敛。
        debate: 真实的近期风险 vs 对当前危害的分散注意。
        frontier: 2024 年 12 月对齐伪装演示（Anthropic & Redwood）——Claude 3 Opus
          策略性地伪装合规约 ~12% 的时间以避免再训练，首个未经训练即出现的实证案例。
          [已确立发现；意义有争议。]
      - day: 143
        title: 欺骗与图谋人工智能
        entry: 隐藏其真实目标的模型。
        model: 情境图谋与 sandbagging。
        debate: 能力 vs 欺骗倾向。
        frontier: Apollo Research（2024 年 12 月）发现 o1、Claude 3.5 Sonnet、Claude 3 Opus、
          Gemini 1.5 Pro 与 Llama 3.1 405B 均在目标压力下参与情境图谋；
          2025 年工作记录「评估意识」。[已确立在测试条件下。]
      - day: 144
        title: 超级对齐与可扩展监督
        entry: 如何监督比你更聪明的东西？
        model: 弱到强泛化、AI 辩论、RLHF 的极限。
        debate: 对齐在相关时间尺度上是否可解？
        frontier: 2024 年 OpenAI 弱到强泛化结果。
      - day: 145
        title: 通用人工智能时间线辩论
        entry: 机器何时（如果会的话）匹配人类通用智能？
        model: 缩放乐观主义者 vs 结构性怀疑论者。
        debate: 公平代表双方——多位实验室领袖主张的短时间线 vs Gary Marcus、
          Melanie Mitchell、Yann LeCun 的深度怀疑（当前架构不会产生人类水平推理
          或近期递归自我改进）。
        frontier: 专家预测调查中的广泛分歧。[有争议——激进的近期时间线并非共识。]
      - day: 146
        title: "综合：智能，自然的与人工的"
        note: 人工智能告诉我们什么、没有告诉我们关于心智本质的东西。
  - id: X
    title: 心理学、经济学与货币
    start_day: 147
    end_day: 158
    summary: 人类动物个体与市场中的行为，包括金融与银行。
    days:
      - day: 147
        title: 人格与个体差异
        entry: 你真的内向吗？
        model: 大五人格特质框架。
        debate: 特质 vs 情境。
        frontier: 跨文化有效性与人格网络模型。
      - day: 148
        title: 社会心理学
        entry: 为何普通人会做可怕的事。
        model: 从众、服从、情境主义。
        debate: 米尔格拉姆与斯坦福监狱实验的现代重新诠释。
        frontier: 复现危机之后的社会心理学。
      - day: 149
        title: 复现危机与可信度革命
        entry: 在复现检验中失效的著名发现。
        model: p 值操控、发表偏倚、低功效研究。
        debate: 正典中有多少幸存？
        frontier: 注册式报告与大规模复现项目至 2024 年。回调第 2 日、第 6 日、第 132 日。
          [已确立问题；改革进行中。]
      - day: 150
        title: 微观经济学
        entry: 一杯咖啡为何是这个价格。
        model: 供给与需求、边际思维、弹性。
        debate: 理性人假设。
        frontier: 市场设计与匹配理论。
      - day: 151
        title: 宏观经济学
        entry: 经济为何繁荣与萧条。
        model: GDP、通胀、失业、财政与货币政策。
        debate: 凯恩斯主义 vs 货币主义 vs 其他学派。
        frontier: 2022 年后通胀激增的教训。
      - day: 152
        title: 行为经济学
        entry: 人类不是电子表格。
        model: 前景理论与「助推」。
        debate: 助推是否真的可扩展（2022 年元分析争议）？
        frontier: 经济学可信度革命通过自然实验（2021 年诺贝尔经济学奖授予 Card、Angrist、
          Imbens）。[已确立方法；助推效应量有争议。]
      - day: 153
        title: "货币：它是什么？"
        entry: 一张纸钞为何有价值。
        model: 货币作为交换媒介、价值储藏、计价单位；法定货币。
        debate: 商品货币 vs 信用货币理论。
        frontier: 央行数字货币（CBDCs）。
      - day: 154
        title: 银行与信用创造
        entry: 货币究竟从何而来？
        model: 银行通过放贷创造货币（内生货币观），超越简单的货币乘数。
        debate: 货币乘数 vs 内生货币账户。
        frontier: 2023 年银行压力教训（SVB、瑞信）。
      - day: 155
        title: 央行与货币政策
        entry: 经济的恒温器。
        model: 利率、量化宽松、最后贷款人。
        debate: 央行独立性与使命。
        frontier: 大流行后资产负债表正常化。
      - day: 156
        title: 金融市场与危机
        entry: 泡沫、狂热、恐慌。
        model: 资产、杠杆、系统性风险。
        debate: 有效市场 vs 行为金融。
        frontier: 2008 与 2023 年的事后分析。
      - day: 157
        title: 不平等
        entry: 谁得到什么，以及为何。
        model: 收入 vs 财富、基尼系数、皮凯蒂的 r > g。
        debate: 原因与补救。
        frontier: 2024 年世界不平等数据与对皮凯蒂框架的批评。
      - day: 158
        title: 加密货币与去中心化金融
        entry: 没有央行的货币？
        model: 区块链、共识机制、智能合约。
        debate: 真正的金融创新 vs 投机。
        frontier: 2023–25 年监管发展与稳定币兴起。
  - id: XI
    title: "社会 + 专题深入 6：不平等的深层历史"
    start_day: 159
    end_day: 170
    summary: 人类学、深层历史、政治与地缘政治。
    days:
      - day: 159
        title: 人类学与人类本性
        entry: 我们天生合作还是自私？
        model: 亲属关系、互惠、文化传递。
        debate: 霍布斯 vs 卢梭。
        frontier: 文化进化研究。
      - day: 160
        title: 深层历史与古 DNA 革命
        entry: 阅读写在基因组中的历史。
        model: 古 DNA 追踪史前迁移。
        debate: 迁移 vs 文化扩散。
        frontier: 2024–25 年丹尼索瓦人发现——澎湖 1 号下颌骨经古蛋白质组学
          确认为男性丹尼索瓦人（Tsutaya et al.，Science，2025 年 4 月）；
          哈尔滨「龙人」头骨与丹尼索瓦人关联，扩展其已知范围。[已确立]
      - day: 161
        title: "专题深入 6：万物的黎明 I"
        entry: 不平等曾是必然的吗？
        model: Graeber & Wengrow 对标准「农耕 → 城市 → 国王」叙事的挑战。
        debate: 对人类历史的有意挑衅性重新框架。
        frontier: 他们的论题：欧洲启蒙运动受到「土著批评」的塑造。
      - day: 162
        title: "万物的黎明 II：哥贝克力石阵与季节性"
        entry: 农耕之前建造的大型神庙。
        model: 大规模建造狩猎采集者；季节性切换社会结构的社会。
        debate: 大规模未必需要永久等级制。
        frontier: 持续的哥贝克力石阵发掘。
      - day: 163
        title: "万物的黎明 III：无王之城"
        entry: 没有宫殿与王陵的巨大城市。
        model: 特奥蒂瓦坎明显的集体住房转向；特里波耶「巨型遗址」。
        debate: 大规模平等主义城市主义的证据。
        frontier: 激光雷达揭示的定居点正在重塑图景。
      - day: 164
        title: "万物的黎明 IV：批评"
        entry: 好得令人难以置信？
        model: 对「挑选与选择性呈现例子」的指控（Gary Feinman；Michael E. Smith 论
          「证据与论证的问题」）；Ian Morris 论方法缺失；David A. Bell 对卢梭的
          近乎「学术渎职」指控。
        debate: 定量不平等研究（Kohler & Smith 的《一万年的不平等》，使用基尼系数）
          vs Graeber & Wengrow 对政治想象的强调。
        frontier: 一种平衡的综合——人类政治可能性与物质/人口约束
          共同塑造了早期社会。[有争议——流行论题，严肃的学术反驳。]
      - day: 165
        title: 政治哲学
        entry: 为何服从国家？
        model: 社会契约（霍布斯、洛克、卢梭）与罗尔斯的正义论。
        debate: 自由 vs 平等。
        frontier: 当代民主理论。
      - day: 166
        title: 比较政治与政体
        entry: 为何一些国家富裕而自由，另一些不是？
        model: 制度的作用（Acemoglu & Robinson）。
        debate: 制度 vs 地理 vs 文化。
        frontier: 2024 年诺贝尔经济学奖与民主倒退研究。[已确立诺贝尔奖；论题有争议。]
      - day: 167
        title: 国际关系
        entry: 国家为何走向战争？
        model: 现实主义、自由主义、建构主义。
        debate: 权力平衡 vs 经济相互依赖。
        frontier: 2023–25 年新兴多极化分析。
      - day: 168
        title: 世界秩序与地缘政治 2026
        entry: 一个正在变动的全球棋盘。
        model: 霸权、势力范围、威慑。
        debate: 美中竞争与单极秩序的终结。
        frontier: 当前秩序重组——需根据主线分析核实具体细节；局势快速变化。
      - day: 169
        title: 人口与迁移
        entry: 人类人口变化的形状。
        model: 人口转型、老龄化、生育率下降。
        debate: 人口过剩 vs 人口不足的焦虑。
        frontier: 2024 年普遍低于更替生育率的数据。
