        title: 生物技术、生物安全与人工智能经济
        entry: 强大工具的双刃。
        model: 合成生物学的益处与风险；AI 对劳动与生产力的影响。
        debate: 加速 vs 谨慎。
        frontier: 2024–25 年 AI—生物学融合治理与 AI 经济影响研究。
      - day: 180
        title: "顶点：综合与开放前沿"
        entry: 将整幅地图编织在一起。
        model: 处处重现的跨域主题——信息、能量、进化、涌现、计算。
        debate: 跨越所有领域的最大开放问题（量子引力、生命起源、意识、智能极限）。
        frontier: 构建终身学习与校准的、基于证据的好奇心的个人框架。
