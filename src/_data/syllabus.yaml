          in test conditions.]
      - day: 144
        title: Superalignment & Scalable Oversight
        entry: how do you supervise something smarter than yourself?
        model: weak-to-strong generalization, AI debate, the limits of RLHF.
        debate: is alignment solvable on the relevant timescale?
        frontier: 2024 OpenAI weak-to-strong generalization results.
      - day: 145
        title: The AGI Timeline Debate
        entry: when, if ever, will machines match human general intelligence?
        model: scaling optimists vs structural skeptics.
        debate: represent BOTH sides fairly — short timelines argued by several lab leaders vs deep skepticism from Gary Marcus,
          Melanie Mitchell, Yann LeCun (current architectures won't yield human-level reasoning or near-term recursive
          self-improvement).
        frontier: the wide disagreement across expert forecasting surveys. [CONTESTED — aggressive near-term timelines are not
          consensus.]
      - day: 146
        title: "Synthesis: Intelligence, Natural & Artificial"
        note: What AI does and doesn't tell us about the nature of minds.
