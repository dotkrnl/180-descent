title: The 180-Day Map of Knowledge
subtitle: Foundations to the 2026 research frontier
purpose: "A dependency-ordered course of daily descents: accessible entry point, core model, live debate, and recent
  trustworthy research frontier."
method: Each day moves from a story or analogy into a mental model, then names the debate and walks to the edge of
  current evidence with a hype filter.
threads:
  - information
  - energy
  - evolution
  - emergence
  - computation
frontier_labels:
  - established
  - promising hint
  - contested/hype
blocks:
  - id: I
    title: Foundations of Knowledge & Reasoning
    start_day: 1
    end_day: 14
    summary: "The epistemic toolkit comes first: everything downstream depends on knowing how we justify and calibrate belief."
    days:
      - day: 1
        title: What Is Knowledge?
        entry: the "stopped clock" Gettier puzzle.
        model: justified true belief and its failures.
        debate: foundationalism vs coherentism vs reliabilism.
        frontier: Bayesian epistemology and predictive-processing accounts of belief formation.
      - day: 2
        title: The Scientific Method & Demarcation
        entry: '"Will the sun rise tomorrow?"'
        model: hypothesis–prediction–test.
        debate: Popper's falsification vs Kuhn's paradigms vs Lakatos's research programs.
        frontier: the replication crisis as a real-world demarcation stress test.
      - day: 3
        title: Logic & Valid Inference
        entry: syllogisms and everyday fallacies.
        model: deduction vs induction vs abduction.
        debate: is logic discovered or invented?
        frontier: non-classical logics and machine-checked formal verification.
      - day: 4
        title: Probability as Extended Logic
        entry: the Monty Hall problem.
        model: Bayes' theorem as belief updating.
        debate: frequentist vs Bayesian interpretations.
        frontier: e-values and the modern reform of statistical inference.
      - day: 5
        title: Causation
        entry: ice cream sales and drowning correlate.
        model: confounders and counterfactuals.
        debate: can causation be inferred from observation alone?
        frontier: Pearl's do-calculus and algorithmic causal discovery.
      - day: 6
        title: Statistics & the Art of Not Fooling Yourself
        entry: p-hacking a coin flip.
        model: sampling, effect sizes, confidence intervals.
        debate: null-hypothesis testing vs estimation.
        frontier: 2024–25 multiverse and specification-curve analyses.
      - day: 7
        title: Information Theory
        entry: the game of 20 questions.
        model: Shannon entropy, bits, channel capacity.
        debate: is information physical?
        frontier: information thermodynamics and Landauer's principle (previewing the physics-of-life arc).
      - day: 8
        title: Complexity & Emergence
        entry: a murmuration of starlings.
        model: emergence and self-organization.
        debate: strong vs weak emergence.
        frontier: assembly and complexity measures — flag Assembly Theory as [CONTESTED], not established.
      - day: 9
        title: Systems Thinking & Feedback
        entry: a household thermostat.
        model: stocks, flows, feedback loops, nonlinearity.
        debate: reductionism vs holism.
        frontier: tipping points in coupled systems (previewing climate).
      - day: 10
        title: Models, Maps & Idealization
        entry: '"the map is not the territory."'
        model: all models are wrong, some are useful.
        debate: scientific realism vs instrumentalism.
        frontier: the epistemology of simulations and digital twins.
      - day: 11
        title: Heuristics, Biases & Rationality
        entry: the Linda "bank teller" problem.
        model: System 1/System 2 (with caveats).
        debate: are heuristics flaws or adaptive shortcuts?
        frontier: the "rationality wars" and ecological rationality.
      - day: 12
        title: Networks
        entry: six degrees of separation.
        model: nodes, hubs, power laws, contagion.
        debate: the scale-free network controversy.
        frontier: network neuroscience and epidemic modeling.
      - day: 13
        title: Measurement & Units
        entry: how long is a meter, really?
        model: operational definitions and the 2019 SI redefinition.
        debate: are the constants truly constant?
        frontier: metrology and tests of fundamental-constant variation.
      - day: 14
        title: "Synthesis: How We Know"
        note: Review the epistemic toolkit; build a personal "confidence calibration" framework to apply for the rest of the
          course.
  - id: II
    title: Mathematics & Formal Systems
    start_day: 15
    end_day: 30
    summary: The formal languages in which physical and biological law are written, plus the proven limits of those languages.
    days:
      - day: 15
        title: Number
        entry: counting and the invention of zero.
        model: naturals → integers → rationals → reals.
        debate: is mathematics invented or discovered (Platonism)?
        frontier: the "unreasonable effectiveness" of mathematics in physics.
      - day: 16
        title: Prime Numbers & the Riemann Hypothesis
        entry: primes as the atoms of arithmetic.
        model: prime distribution and the zeta function.
        debate: RH as the great open problem.
        frontier: recent computational and analytic progress on zeros.
      - day: 17
        title: Geometry
        entry: the shortest path on a globe.
        model: Euclidean axioms vs non-Euclidean curvature.
        debate: is physical space flat?
        frontier: differential geometry as the language of general relativity.
      - day: 18
        title: Algebra & Symmetry
        entry: a Rubik's cube.
        model: groups and invariants.
        debate: abstraction vs intuition.
        frontier: Noether's theorem linking symmetry to conservation laws.
      - day: 19
        title: Functions & Change
        entry: filling a bathtub.
        model: rates, slopes, and the concept of a limit.
        debate: were infinitesimals ever rigorous?
        frontier: foundations via epsilon-delta and nonstandard analysis.
      - day: 20
        title: "Calculus I: The Derivative"
        entry: speedometer vs odometer.
        model: instantaneous rate of change.
        debate: the Newton–Leibniz priority dispute.
        frontier: automatic differentiation as the engine of deep learning.
      - day: 21
        title: "Calculus II: The Integral & FTC"
        entry: area as accumulated change.
        model: the Fundamental Theorem linking derivative and integral.
        debate: what does "area under a curve" really mean?
        frontier: measure theory and Lebesgue integration.
      - day: 22
        title: Differential Equations
        entry: population growth and decay.
        model: ODEs as the laws of motion for nearly everything.
        debate: determinism vs chaos.
        frontier: neural ODEs and scientific machine learning.
      - day: 23
        title: Chaos & Nonlinear Dynamics
        entry: the butterfly effect.
        model: sensitive dependence and strange attractors.
        debate: the limits of predictability.
        frontier: data-driven dynamics and reservoir computing.
      - day: 24
        title: Probability & Randomness (Formal)
        entry: the drunkard's random walk.
        model: distributions, the central limit theorem, Markov chains.
        debate: what is randomness?
        frontier: Monte Carlo methods and probabilistic programming.
      - day: 25
        title: Statistics for Inference
        entry: polling a nation from a sample.
        model: estimators and regression.
        debate: causal vs predictive modeling.
        frontier: high-dimensional statistics and the double-descent phenomenon.
      - day: 26
        title: Infinity & Set Theory
        entry: Hilbert's Hotel.
        model: countable vs uncountable infinities; Cantor's diagonal argument.
        debate: the continuum hypothesis.
        frontier: large cardinals and independence results.
      - day: 27
        title: Computation & Turing Machines
        entry: a recipe a machine can follow.
        model: algorithm and universal computation.
        debate: is the mind a computer?
        frontier: why hypercomputation proposals are viewed skeptically.
      - day: 28
        title: "The Limits of Formal Systems: Gödel"
        entry: '"this statement is unprovable."'
        model: the incompleteness theorems.
        debate: their implications for mind and mathematics.
        frontier: reverse mathematics and proof assistants like Lean.
      - day: 29
        title: P vs NP & Complexity Classes
        entry: easy to check, hard to solve (a sudoku).
        model: tractability and NP-completeness.
        debate: does P = NP?
        frontier: links to cryptography and 2024 AI-for-math (AlphaProof solved the hardest 2024 IMO problem, which only 5 of
          600+ human contestants fully solved). [ESTABLISHED]
      - day: 30
        title: "Synthesis: Math as a Tower"
        note: Map the dependency tree of mathematics and preview how each tool powers physics.
  - id: III
    title: "Physics: Classical to Quantum"
    start_day: 31
    end_day: 48
    summary: The behavior of matter and energy, built intuition-first through multi-day relativity and quantum arcs.
    days:
      - day: 31
        title: "Classical Mechanics: Newton"
        entry: why a thrown ball arcs.
        model: F = ma and conservation laws.
        debate: the puzzle of action-at-a-distance.
        frontier: chaotic long-term instability of the solar system.
      - day: 32
        title: Lagrangian & Hamiltonian Mechanics
        entry: nature's "laziness" (least action).
        model: action principles and phase space.
        debate: are these mere reformulations or something deeper?
        frontier: symplectic integrators and optimal control.
      - day: 33
        title: "Thermodynamics: The Four Laws"
        entry: why coffee always cools.
        model: energy, entropy, temperature.
        debate: the origin of the arrow of time.
        frontier: "fluctuation theorems (previewing the physics-of-life deep dive). KEY THREAD: energy/entropy reappears in
          life, metabolism, economics."
      - day: 34
        title: Statistical Mechanics
        entry: from jiggling molecules to temperature.
        model: microstates and the Boltzmann distribution.
        debate: how does irreversibility emerge from reversible microscopic laws?
        frontier: non-equilibrium statistical mechanics.
      - day: 35
        title: Waves & Light
        entry: ripples in a pond.
        model: superposition and interference.
        debate: the historical wave-vs-particle dispute.
        frontier: metamaterials and modern photonics.
      - day: 36
        title: "Electromagnetism: Maxwell"
        entry: a compass needle deflecting near a wire.
        model: fields and Maxwell's equations unifying electricity, magnetism, and light.
        debate: the luminiferous ether.
        frontier: why electromagnetic symmetry forced relativity.
      - day: 37
        title: Special Relativity I
        entry: the train-and-lightning thought experiment.
        model: the constancy of c and the relativity of simultaneity.
        debate: is time real?
        frontier: precision tests of Lorentz invariance.
      - day: 38
        title: "Special Relativity II: E=mc²"
        entry: mass as frozen energy.
        model: spacetime and four-vectors.
        debate: interpretations of relativistic mass.
        frontier: applications in particle physics.
      - day: 39
        title: General Relativity I
        entry: a bowling ball on a trampoline.
        model: gravity as the curvature of spacetime.
        debate: Einstein vs Newton.
        frontier: gravitational-wave astronomy from 2015 to today (LIGO/Virgo/KAGRA). [ESTABLISHED]
      - day: 40
        title: "General Relativity II: Black Holes"
        entry: light that cannot escape.
        model: event horizons and singularities.
        debate: the information paradox.
        frontier: the 2019/2022 Event Horizon Telescope images and black-hole thermodynamics. [ESTABLISHED]
      - day: 41
        title: "Quantum Mechanics I: The Quantum Leap"
        entry: why atoms don't collapse.
        model: quantization and the wavefunction.
        debate: was nature really discrete?
        frontier: setting up the measurement problem.
      - day: 42
        title: "Quantum Mechanics II: Superposition & the Double Slit"
        entry: one particle through two slits.
        model: probability amplitudes and the Born rule.
        debate: what physically counts as a "measurement"?
        frontier: macroscopic superposition experiments.
      - day: 43
        title: "Quantum Mechanics III: Entanglement & Bell"
        entry: Einstein's "spooky action at a distance."
        model: entanglement and Bell inequalities.
        debate: locality vs realism.
        frontier: the 2022 Nobel (Aspect, Clauser, Zeilinger) and loophole-free Bell tests. [ESTABLISHED]
      - day: 44
        title: Quantum Interpretations
        entry: is Schrödinger's cat alive or dead?
        model: Copenhagen, Many-Worlds, pilot-wave, QBism.
        debate: which (if any) is testable?
        frontier: objective-collapse models under experimental test.
      - day: 45
        title: Quantum Field Theory & the Standard Model
        entry: particles as ripples in underlying fields.
        model: gauge symmetry and the particle zoo.
        debate: the naturalness/hierarchy problem.
        frontier: precision Higgs measurements.
      - day: 46
        title: The Muon g-2 Story
        entry: a wobbling magnetic top.
        model: how virtual particles tweak the muon's magnetism.
        debate: the decade-long anomaly that seemed to point beyond the Standard Model.
        frontier: the June 3, 2025 Fermilab final result (aμ to 127 ppb) + the 2025 Theory Initiative white paper (switched to
          lattice-QCD for hadronic vacuum polarization) now show NO significant tension with the Standard Model.
          [ESTABLISHED — "new physics" interpretation now SUPERSEDED.]
      - day: 47
        title: Quantum Computing
        entry: exploring many paths at once (state carefully).
        model: qubits, superposition, decoherence, error correction.
        debate: practical advantage vs hype.
        frontier: Google's "Willow" 105-qubit chip — error rates that FALL as qubits are added, demonstrating below-threshold
          error correction (Nature, Dec 2024). [ESTABLISHED milestone; commercial advantage still distant.]
      - day: 48
        title: "Synthesis: The Two Pillars"
        note: Why relativity and quantum theory still don't unify; preview the quantum-gravity problem.
  - id: IV
    title: "Cosmology & Astrophysics + DEEP DIVE 1: The Hubble Tension"
    start_day: 49
    end_day: 62
    summary: The universe at large, descending into precision cosmology's biggest crisis.
    days:
      - day: 49
        title: The Sky as a Time Machine
        entry: starlight is the past.
        model: light-years and lookback time.
        debate: how do we actually measure distances?
        frontier: multi-messenger astronomy.
      - day: 50
        title: The Cosmic Distance Ladder
        entry: judging distance by apparent brightness.
        model: parallax → Cepheids → Type Ia supernovae.
        debate: calibration systematics.
        frontier: JWST recalibrations of each ladder rung.
      - day: 51
        title: The Expanding Universe
        entry: raisins in rising dough.
        model: Hubble's law, redshift, the scale factor.
        debate: what is it that "expands"?
        frontier: the Hubble-constant problem (setting up the deep dive).
      - day: 52
        title: The Big Bang & the CMB
        entry: the universe's baby photo.
        model: a hot, dense origin, recombination, and the cosmic microwave background.
        debate: Big Bang vs discarded alternatives.
        frontier: Planck and ACT precision cosmology.
      - day: 53
        title: "DEEP DIVE 1: The Hubble Tension — Two Numbers"
        entry: 67 versus 73.
        model: early-universe value, Planck 2018 ΛCDM H0 = 67.4 ± 0.5 km/s/Mpc (Planck Collaboration VI), vs late-universe
          distance ladder, SH0ES H0 = 73.04 ± 1.04 km/s/Mpc (Riess et al. 2022).
        debate: measurement error vs new physics.
        frontier: discrepancy now ~5σ. [ESTABLISHED that the tension exists; cause unresolved.]
      - day: 54
        title: "Hubble Tension: The Distance-Ladder Defense"
        entry: is dust or crowding fooling us?
        model: the SH0ES methodology.
        debate: are Cepheids contaminated by crowding/dust?
        frontier: 2024 JWST Cepheid observations reject unrecognized crowding at 8σ; the local value near 73 holds firm.
          [ESTABLISHED]
      - day: 55
        title: "Hubble Tension: The Early-Universe Camp"
        entry: a cosmic ruler made of sound.
        model: the sound horizon and baryon acoustic oscillations.
        debate: is the ruler miscalibrated?
        frontier: sound-horizon-free and inverse-distance-ladder methods.
      - day: 56
        title: "Hubble Tension: TRGB & Independent Methods"
        entry: a different kind of standard candle.
        model: tip of the red giant branch (Freedman's CCHP).
        debate: does TRGB favor a lower, intermediate H0?
        frontier: 2025 JWST TRGB calibrations and their disagreements with Cepheids. [CONTESTED — methods disagree.]
      - day: 57
        title: "Hubble Tension: Proposed New Physics"
        entry: a brief extra push early on.
        model: early dark energy.
        debate: does it fit all datasets at once?
        frontier: EDE constraints and tension with large-scale-structure data. [PROMISING HINT, not established.]
      - day: 58
        title: "Hubble Tension: Time-Delay Cosmography"
        entry: a cosmic stopwatch from lensed quasars.
        model: strong-lensing time delays (H0LiCOW/TDCOSMO).
        debate: the mass-sheet degeneracy.
        frontier: JWST lensing time-delay programs as an independent ladder-free probe.
      - day: 59
        title: DESI & Evolving Dark Energy
        entry: the largest 3D map of the universe ever made.
        model: baryon acoustic oscillations over 11 billion years.
        debate: is dark energy a true constant?
        frontier: DESI DR2 (March 19, 2025) shows 3.1σ preference for evolving dark energy with Planck, ~4σ with some supernova
          samples (Union3, DES), ~2.5σ with Pantheon+ — strongly sample-dependent, below 5σ. [PROMISING HINT — treat as
          a hint, not a result.]
      - day: 60
        title: Dark Matter
        entry: galaxies that spin too fast to hold together.
        model: rotation curves, gravitational lensing, the Bullet Cluster.
        debate: particle dark matter vs modified gravity (MOND).
        frontier: continued direct-detection null results as of 2026.
      - day: 61
        title: JWST & Early-Universe Surprises
        entry: galaxies that look too big, too soon.
        model: high-redshift galaxy formation.
        debate: do early massive galaxies break ΛCDM?
        frontier: 2023–25 JWST spectroscopic confirmations and proposed resolutions (efficient star formation, not necessarily
          new physics). [PROMISING HINT — likely resolvable within ΛCDM.]
      - day: 62
        title: Astrobiology & Biosignatures
        entry: are we alone?
        model: habitable zones and biosignature gases.
        debate: the K2-18b dimethyl-sulfide claim (Madhusudhan et al. 2025) reached only ~3σ and was rebutted by multiple
          independent reanalyses (Luque et al., Welbanks et al., Taylor 2025) finding "insufficient evidence"; NOT
          evidence of life.
        frontier: formal astrobiology standards-of-evidence frameworks. [CONTESTED/HYPE.]
  - id: V
    title: Chemistry & Materials
    start_day: 63
    end_day: 72
    summary: How atoms combine into the stuff of the world and of life.
    days:
      - day: 63
        title: The Atom
        entry: the Lego bricks of matter.
        model: nucleus plus electron orbitals.
        debate: the Bohr model vs the full quantum picture.
        frontier: attosecond imaging of electron motion (2023 Nobel in Physics). [ESTABLISHED]
      - day: 64
        title: The Periodic Table
        entry: an address system for the elements.
        model: periodicity arising from electron shells.
        debate: disputes over element placement (e.g., group 3, hydrogen).
        frontier: synthesis of superheavy elements and the "island of stability."
      - day: 65
        title: Chemical Bonding
        entry: why salt and water behave so differently.
        model: ionic, covalent, and metallic bonds.
        debate: is "the bond" a real entity or bookkeeping?
        frontier: quantum chemistry and density functional theory.
      - day: 66
        title: Reactions, Energy & Equilibrium
        entry: fire and rust.
        model: thermodynamics plus kinetics; catalysis.
        debate: controlling reaction pathways.
        frontier: machine-learned catalyst discovery.
      - day: 67
        title: Organic Chemistry & the Chemistry of Carbon
        entry: why carbon is life's scaffold.
        model: functional groups and isomerism.
        debate: synthetic vs natural products.
        frontier: automated retrosynthesis planning.
      - day: 68
        title: Water & Acids/Bases
        entry: why water is such a weird substance.
        model: pH and hydrogen bonding.
        debate: water's structural anomalies.
        frontier: ongoing controversies over liquid water's microstructure.
      - day: 69
        title: Materials Science
        entry: why steel outperforms pure iron.
        model: crystal structure, defects, and phases.
        debate: rational design vs serendipitous discovery.
        frontier: 2023–24 AI-driven materials discovery (DeepMind's GNoME).
      - day: 70
        title: Superconductivity & a Cautionary Tale
        entry: a magnet levitating over a cooled disk.
        model: Cooper pairs and BCS theory.
        debate: the dream of a room-temperature superconductor.
        frontier: LK-99 (2023) was conclusively shown NOT to be a superconductor — a case study in hype, failed replication, and
          how science self-corrects. [CONTESTED/HYPE → DEBUNKED. Keep as a cautionary lesson.]
      - day: 71
        title: Green & Computational Chemistry
        entry: chemistry that minimizes waste.
        model: atom economy, catalysis, simulation-first design.
        debate: scalability of green methods.
        frontier: electro- and photochemistry for decarbonization.
      - day: 72
        title: "Synthesis: From Atoms to Stuff"
        note: How chemistry bridges physics and biology; preview the molecules of life.
  - id: VI
    title: "Biology & Evolution + DEEP DIVE 2: The Physics of Life"
    start_day: 73
    end_day: 92
    summary: What life is and how it might have begun, grounded in thermodynamics.
    days:
      - day: 73
        title: What Is Life?
        entry: is a virus alive?
        model: metabolism, replication, homeostasis.
        debate: the definition problem.
        frontier: synthetic minimal cells; flag Assembly Theory as a [CONTESTED] attempt at a general definition.
      - day: 74
        title: Evolution by Natural Selection
        entry: Darwin's finches.
        model: variation, heredity, differential survival.
        debate: gradualism vs punctuated equilibrium.
        frontier: "Lenski's Long-Term Evolution Experiment in real time. KEY THREAD: evolution/selection reappears in
          psychology, culture, AI. [ESTABLISHED]"
      - day: 75
        title: The Modern Synthesis & Beyond
        entry: genes meet populations.
        model: population genetics and genetic drift.
        debate: is an "Extended Evolutionary Synthesis" needed?
        frontier: evo-devo and niche construction.
      - day: 76
        title: The Cell
        entry: a city in miniature.
        model: membranes, organelles, prokaryote vs eukaryote.
        debate: the origin of eukaryotic complexity.
        frontier: cryo-EM visualization of cellular machinery.
      - day: 77
        title: "Molecular Machinery: DNA → RNA → Protein"
        entry: the recipe-to-machine pipeline.
        model: the central dogma.
        debate: how "central" is it really?
        frontier: "the expanding regulatory roles of RNA. THREAD: information."
      - day: 78
        title: Proteins & Folding
        entry: origami that performs work.
        model: sequence → structure → function.
        debate: the protein-folding problem.
        frontier: AlphaFold 2/3 (2024) predicting structures of proteins AND their complexes with DNA, RNA, ligands.
          [ESTABLISHED]
      - day: 79
        title: Metabolism & Bioenergetics
        entry: how a cell earns its living.
        model: ATP, electron transport, chemiosmosis.
        debate: metabolism-first vs genes-first origins.
        frontier: "the bioenergetics of life's origin. THREAD: energy."
      - day: 80
        title: Development
        entry: one cell becomes a whole organism.
        model: gene regulatory networks and morphogen gradients.
        debate: the nature of the body plan.
        frontier: synthetic embryos/embryoids (2023–24).
      - day: 81
        title: Ecology & Ecosystems
        entry: a food web.
        model: energy flow, niches, succession.
        debate: the "balance of nature" myth.
        frontier: ecological tipping points and rewilding science.
      - day: 82
        title: The Microbiome
        entry: you are, by cell count, mostly microbes.
        model: host–microbe symbiosis.
        debate: distinguishing correlation from causation in microbiome claims.
        frontier: "2023–25 causal microbiome–disease studies (gnotobiotic and FMT work). [Mix: some ESTABLISHED, much PROMISING
          HINT.]"
      - day: 83
        title: "DEEP DIVE 2: Entropy & the Puzzle of Life"
        entry: life seems to defy disorder.
        model: Schrödinger's "negative entropy"; living things as open systems exporting entropy.
        debate: does life violate the second law (no)?
        frontier: "framing life through information thermodynamics. THREAD: energy + information converge."
      - day: 84
        title: Far-From-Equilibrium Thermodynamics
        entry: a whirlpool that sustains its own shape.
        model: Prigogine's dissipative structures.
        debate: how general are such structures?
        frontier: non-equilibrium steady states and pattern formation.
      - day: 85
        title: Fluctuation Theorems & Landauer's Principle
        entry: the energy cost of forgetting.
        model: the Jarzynski and Crooks relations; erasing one bit costs at least kT·ln2.
        debate: is Maxwell's demon finally exorcised?
        frontier: single-molecule and bit-erasure experiments confirming Landauer. [ESTABLISHED] Callback to Day 7.
      - day: 86
        title: Dissipative Adaptation
        entry: matter that "tunes itself" to absorb energy.
        model: Jeremy England's hypothesis that strongly driven matter self-organizes to dissipate energy.
        debate: an interesting and active idea, but explicitly [CONTESTED] — NOT an established origin-of-life theory.
        frontier: supporting simulations and their critiques.
      - day: 87
        title: "Abiogenesis: The RNA World"
        entry: a molecule that is both gene and machine.
        model: RNA self-replication.
        debate: RNA-first vs metabolism-first vs lipid-first.
        frontier: recent ribozyme and protocell experiments.
      - day: 88
        title: "Abiogenesis: Hydrothermal Vents & Geochemistry"
        entry: life from rock and heat.
        model: alkaline vents and natural proton gradients.
        debate: deep-sea vents vs Darwin's "warm little pond."
        frontier: 2023–25 prebiotic chemistry results.
      - day: 89
        title: "Origin of Life: Compartments & Autocatalysis"
        entry: a bubble that grows and divides.
        model: protocells and autocatalytic sets.
        debate: which subsystem bootstrapped first?
        frontier: systems-chemistry experiments combining replication and compartmentalization.
      - day: 90
        title: "Origin of Life: Theories of Life Itself"
        entry: can "being alive" be defined as a physical process?
        model: autopoiesis and (flag) Assembly Theory.
        debate: is a general theory of life even possible?
        frontier: 2023–24 Assembly Theory papers and the substantial critiques from chemists and complexity scientists.
          [CONTESTED.]
      - day: 91
        title: The Tree of Life & LUCA
        entry: everyone's last common ancestor.
        model: phylogenetics and horizontal gene transfer.
        debate: when and where did LUCA live?
        frontier: 2024 molecular-clock estimates pushing LUCA earlier and characterizing its gene set.
      - day: 92
        title: "Synthesis: Life as Physics + History"
        note: Tie together thermodynamics, chemistry, and evolution; transition to genetics and medicine.
  - id: VII
    title: "Genetics, Biotech & Medicine + DEEP DIVE 3: Transgenerational Epigenetics"
    start_day: 93
    end_day: 116
    summary: Heredity to the clinic, with expanded coverage of the body, immune system, and modern medicine.
    days:
      - day: 93
        title: "Heredity: Mendel to Watson-Crick"
        entry: why children resemble their parents.
        model: genes, alleles, the double helix.
        debate: blending vs particulate inheritance.
        frontier: structural genomics.
      - day: 94
        title: The Genome
        entry: three billion letters.
        model: genes, regulation, and so-called "junk" DNA.
        debate: how much of the genome is functional (the ENCODE debate)?
        frontier: the complete telomere-to-telomere human genome (2022) and the human pangenome (2023). [ESTABLISHED]
      - day: 95
        title: Gene Expression & Regulation
        entry: the same DNA builds a neuron and a liver cell.
        model: transcription factors and enhancers.
        debate: the scale of regulatory complexity.
        frontier: single-cell multi-omics atlases.
      - day: 96
        title: "Epigenetics: The Toolkit"
        entry: dimmer switches on top of genes.
        model: DNA methylation, histone modifications, chromatin states.
        debate: what should count as "epigenetic"?
        frontier: targeted epigenome editing.
      - day: 97
        title: "DEEP DIVE 3: The Two Waves of Reprogramming"
        entry: the genome's "reset button."
        model: mammals undergo two genome-wide reprogramming waves — germline reprogramming in primordial germ cells (imprint
          erasure ~E10.5–E12.5) and post-fertilization reprogramming — that erase most epigenetic marks; only imprinting
          control regions and some IAP retrotransposons reliably escape.
        debate: this double erasure is the central mechanistic barrier to true inheritance.
        frontier: a 2025 Nature Communications germline epigenome-editing study showing DNA methylation can partially recover
          after fertilization via H3K9me3 — intergenerational recovery, NOT transgenerational transmission.
      - day: 98
        title: Inter- vs Trans-generational Inheritance
        entry: who was actually exposed?
        model: when a pregnant F0 female is exposed, her fetus (F1) AND that fetus's germ cells (the future F2) are directly
          exposed too — so only F3 (maternal line), or F2 (paternal line), can demonstrate TRUE transgenerational
          inheritance.
        debate: most popular claims conflate direct exposure with inheritance.
        frontier: criteria from Heard & Martienssen (Cell, 2014) and the five formal criteria from Khatib et al. (Epigenetics,
          2024) after reviewing 80 studies.
      - day: 99
        title: The Contested Mammalian Cases
        entry: the famous studies you've heard about.
        model: the Agouti viable-yellow mouse, the Dias–Ressler odor-fear study (Nat. Neurosci. 2014), vinclozolin
          (Anway/Skinner 2005), and the Överkalix/Dutch Hunger Winter human cohorts.
        debate: the Agouti diet effect FAILED to replicate (Bertozzi et al., Nat. Genet. 2021); the Överkalix findings FAILED to
          replicate in a ~40× larger cohort (Vågerö et al., Nat. Commun. 2018).
        frontier: Adrian Bird's 2024 critical perspective concluding mammalian TEI is weak, rare, and mechanistically
          unvalidated — vs robust inheritance in plants and C. elegans. [CONTESTED — mammalian TEI largely unsupported.]
      - day: 100
        title: The Takahashi 2023 Test Case
        entry: can we ENGINEER inheritance?
        model: Takahashi et al. (Cell, 2023) used CRISPR to induce CpG-island methylation that propagated metabolic phenotypes
          across ~4 generations.
        debate: it required an initiating GENETIC deletion; Sapozhnikov & Szyf (Epigenetics, 2024) argue the method amplifies
          genetic confounds; Horsthemke & Bird (2023) showed methylation alone (without the mutation) was not heritable.
        frontier: why this landmark is NOT proof of environmentally-induced TEI in mammals. [CONTESTED.]
      - day: 101
        title: Protein Folding & Drug Design
        entry: knowing a molecule's shape predicts its function.
        model: structure-based drug design.
        debate: static prediction vs dynamic behavior.
        frontier: AlphaFold 3 (2024) and de novo protein design (Baker lab; 2024 Nobel in Chemistry to Baker, Hassabis, Jumper).
          [ESTABLISHED]
      - day: 102
        title: CRISPR & Gene Editing
        entry: molecular find-and-replace.
        model: Cas9 cutting and cellular repair.
        debate: the ethics of germline editing (the 2018 He Jiankui scandal).
        frontier: Casgevy, the first approved CRISPR therapy (2023), for sickle-cell disease. [ESTABLISHED]
      - day: 103
        title: Base & Prime Editing
        entry: a pencil and eraser, not scissors.
        model: chemically rewriting single DNA bases without double-strand breaks.
        debate: delivery challenges and off-target effects.
        frontier: 2024–25 in-vivo base-editing clinical results.
      - day: 104
        title: "How the Body Works I: Systems Overview"
        entry: the body as an integrated machine.
        model: organ systems and homeostasis.
        debate: reductionist vs systems medicine.
        frontier: organ-on-chip platforms and physiological digital twins.
      - day: 105
        title: "How the Body Works II: Heart, Lungs, Blood"
        entry: the pump and the pipes.
        model: circulation and gas exchange.
        debate: evolving cardiovascular risk models.
        frontier: 2024 cardiometabolic prevention data.
      - day: 106
        title: "How the Body Works III: Gut, Liver, Kidneys"
        entry: intake, processing, and filtration.
        model: digestion, detoxification, fluid balance.
        debate: debunking "detox" myths.
        frontier: the gut–brain and gut–liver axes.
      - day: 107
        title: "The Immune System I: Innate & Adaptive"
        entry: the body's standing army and special forces.
        model: barriers, the innate response, B and T cells, antibodies.
        debate: how is self/non-self tolerance established?
        frontier: '"trained immunity" in innate cells.'
      - day: 108
        title: "The Immune System II: Memory & Vaccines"
        entry: why you don't catch measles twice.
        model: immunological memory.
        debate: the science of vaccine hesitancy.
        frontier: the mRNA platform (2023 Nobel in Medicine) and therapeutic cancer vaccines. [ESTABLISHED]
      - day: 109
        title: Cancer
        entry: cells that won't stop dividing.
        model: the hallmarks of cancer and clonal evolution.
        debate: targeted vs broad-spectrum therapy.
        frontier: 2024–25 immunotherapy advances and circulating-tumor-DNA early detection.
      - day: 110
        title: Immunotherapy & CAR-T
        entry: reprogramming a patient's own T-cells into cancer killers.
        model: checkpoint inhibitors and chimeric antigen receptor (CAR) T-cells.
        debate: cost, durability, toxicity.
        frontier: CAR-T's expansion into autoimmune disease — BMS Phase 1 Breakfree-1 reported 71 patients across lupus,
          systemic sclerosis, myositis, 94% of evaluable patients off chronic immunosuppression at analysis (ACR
          Convergence 2025). [PROMISING HINT — early-phase.]
      - day: 111
        title: Infectious Disease & Pandemics
        entry: how outbreaks spread.
        model: R0, transmission dynamics, herd immunity.
        debate: lab-leak vs zoonotic origin of COVID-19.
        frontier: pandemic preparedness and antimicrobial resistance.
      - day: 112
        title: Metabolic Science & GLP-1 Drugs
        entry: a gut hormone that signals fullness.
        model: incretin biology (GLP-1 and GIP receptors).
        debate: obesity reframed as a chronic disease.
        frontier: SURMOUNT-5 head-to-head (NEJM, May 2025) — at 72 weeks tirzepatide produced 20.2% mean weight loss vs
          semaglutide's 13.7%, with greater cardiometabolic improvements. [ESTABLISHED]
      - day: 113
        title: "The Biology of Aging: Hallmarks"
        entry: why bodies wear out.
        model: the hallmarks of aging (genomic instability, telomere attrition, epigenetic alterations, cellular senescence,
          etc.).
        debate: which hallmarks are causes vs symptoms?
        frontier: the 2023 updated twelve-hallmarks framework (López-Otín et al.). [ESTABLISHED framework.]
      - day: 114
        title: Longevity Interventions
        entry: can we slow aging itself?
        model: senolytics, rapamycin, caloric restriction.
        debate: extending lifespan vs healthspan.
        frontier: human trials — and why "reversal" claims in humans should be treated with strong skepticism. [CONTESTED/HYPE
          for human "reversal."]
      - day: 115
        title: Partial Reprogramming
        entry: turning back the cellular clock.
        model: cyclic expression of Yamanaka factors (OSK/OSKM) rejuvenates cells and tissues in mice.
        debate: cancer risk and loss of cell identity.
        frontier: 2023–24 in-vivo mouse studies (incl. neuron-specific reprogramming) — emphatically NOT demonstrated as human
          age-reversal. [PROMISING HINT in mice; not in humans.]
      - day: 116
        title: "Synthesis: Medicine in 2026"
        note: From molecules to clinic; a clear-eyed inventory of what is real versus hyped in biotech.
  - id: VIII
    title: "Brain, Mind & Consciousness + DEEP DIVE 4: Theories of Consciousness"
    start_day: 117
    end_day: 130
    summary: From neurons to the hard problem and the 2025 adversarial-collaboration results.
    days:
      - day: 117
        title: The Neuron & Neural Signaling
        entry: a spark leaping across a gap.
        model: action potentials, synapses, neurotransmitters.
        debate: rate vs spike-timing codes.
        frontier: connectomics (the 2024 complete fruit-fly brain connectome). [ESTABLISHED]
      - day: 118
        title: Brain Architecture
        entry: a map of mental real estate.
        model: cortex, subcortical structures, large-scale networks.
        debate: functional localization vs distributed processing.
        frontier: comprehensive 2023 human brain cell atlases.
      - day: 119
        title: Perception
        entry: why optical illusions reliably fool you.
        model: the brain as a prediction machine.
        debate: bottom-up vs top-down processing.
        frontier: predictive processing and active inference.
      - day: 120
        title: Memory
        entry: how a fleeting moment becomes permanent.
        model: encoding, consolidation, engrams.
        debate: is memory fundamentally reconstructive?
        frontier: optogenetic engram implantation and manipulation in mice.
      - day: 121
        title: Emotion
        entry: fear that strikes before conscious thought.
        model: limbic circuits vs the theory of constructed emotion.
        debate: universal "basic emotions" (Ekman) vs construction (Barrett).
        frontier: interoception research.
      - day: 122
        title: Sleep & Dreams
        entry: why we spend a third of life unconscious.
        model: sleep stages, memory consolidation, glymphatic waste clearance.
        debate: the function(s) of dreaming.
        frontier: 2023–25 links between sleep and Alzheimer's pathology.
      - day: 123
        title: "DEEP DIVE 4: The Hard Problem"
        entry: why is there "something it is like" to see red?
        model: Chalmers' distinction between the "easy" problems and the hard problem; the explanatory gap.
        debate: physicalism vs dualism vs panpsychism.
        frontier: the "meta-problem" of consciousness.
      - day: 124
        title: Global Neuronal Workspace Theory
        entry: consciousness as a brain-wide "broadcast."
        model: information made globally available, with prefrontal "ignition."
        debate: is the prefrontal cortex necessary for experience?
        frontier: GNWT's predictions as tested by the Cogitate collaboration.
      - day: 125
        title: Integrated Information Theory
        entry: consciousness as how much a system's whole exceeds the sum of its parts.
        model: integrated information (Φ) and the posterior "hot zone."
        debate: IIT's panpsychist implications.
        frontier: the open letter "IIT as Pseudoscience" (Fleming et al., Sept 15, 2023, PsyArXiv, 124 signatories incl. Baars,
          Dennett, LeDoux) — and the vigorous rebuttals from Anil Seth and David Chalmers. [CONTESTED — the label itself
          is disputed.]
      - day: 126
        title: The Cogitate Adversarial Collaboration
        entry: rival theories agree to a duel.
        model: a preregistered, theory-neutral head-to-head test using fMRI, MEG, intracranial EEG.
        debate: who "won"?
        frontier: Cogitate Consortium results (Nature, vol. 642, pp. 133–142, June 5, 2025) challenged BOTH theories —
          supporting IIT's claim that posterior cortex is sufficient (prefrontal broadcasting not necessary), while
          contradicting IIT's prediction of sustained posterior synchrony AND GNWT's prediction of ignition at stimulus
          offset. [ESTABLISHED result; interpretation ongoing.]
      - day: 127
        title: Higher-Order & Other Theories
        entry: having thoughts ABOUT your thoughts.
        model: higher-order theories, recurrent processing theory, attention schema theory.
        debate: the proliferation of competing theories.
        frontier: theory-neutral, large-scale experimental programs.
      - day: 128
        title: Clinical Consciousness
        entry: is anyone "in there"?
        model: coma, vegetative/unresponsive states, anesthesia.
        debate: detecting covert awareness.
        frontier: Bodien, Edlow et al. (NEJM, Aug 15, 2024) detected cognitive motor dissociation in 60 of 241 unresponsive
          patients (25%) who showed no observable response to commands but did respond on brain imaging. [ESTABLISHED]
      - day: 129
        title: Animal & Machine Consciousness
        entry: is an octopus conscious? Could an AI be?
        model: behavioral and neural markers of sentience.
        debate: the 2024 New York Declaration on Animal Consciousness.
        frontier: AI-sentience claims and why caution and deflation are warranted.
      - day: 130
        title: Free Will & the Self
        entry: did you CHOOSE to read this sentence?
        model: the Libet readiness-potential experiments and their critiques.
        debate: compatibilism vs hard determinism.
        frontier: revised interpretations of the readiness potential as stochastic accumulation.
