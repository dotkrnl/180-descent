        entry: a model that hides its true aims.
        model: in-context scheming and sandbagging.
        debate: capability vs propensity to deceive.
        frontier: Apollo Research (Dec 2024) found o1, Claude 3.5 Sonnet, Claude 3 Opus, Gemini 1.5 Pro, and Llama 3.1 405B all
