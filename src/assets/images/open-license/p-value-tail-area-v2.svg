<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460">
  <metadata>Adapted from "P-value in statistical significance testing" by Repapetilto and Chen-Pan Liao, CC BY-SA 3.0.</metadata>
  <rect width="800" height="460" fill="#fffaf0"/>
  <rect x="34" y="30" width="732" height="386" rx="8" fill="#fffaf0" stroke="#d8ceb9" stroke-width="2"/>
  <text x="64" y="72" fill="#0f6f78" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="20" font-weight="700" letter-spacing="1.2">P-VALUE = SHADED TAIL</text>
  <text x="64" y="106" fill="#2b2823" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="17" font-weight="700">P(data | null), not P(null | data)</text>

  <line x1="112" y1="352" x2="690" y2="352" stroke="#2b2823" stroke-width="2.5"/>
  <path d="M690 352 L672 342 L672 362 Z" fill="#2b2823"/>
  <line x1="112" y1="352" x2="112" y2="166" stroke="#2b2823" stroke-width="2.5"/>
  <path d="M112 166 L102 186 L122 186 Z" fill="#2b2823"/>

  <path d="M126 351 C188 351 226 336 270 292 C314 248 336 200 404 200 C472 200 496 248 540 292 C584 336 624 351 676 351" fill="none" stroke="#2b2823" stroke-width="5" stroke-linecap="round"/>
  <path d="M542 292 C584 336 624 351 676 351 L542 351 Z" fill="#0f8b54" fill-opacity=".32" stroke="#0f8b54" stroke-width="2"/>
  <path d="M542 292 C584 336 624 351 676 351" fill="none" stroke="#0f8b54" stroke-width="4" stroke-linecap="round"/>
  <line x1="542" y1="178" x2="542" y2="362" stroke="#a33a32" stroke-width="2.5" stroke-dasharray="7 6"/>
  <circle cx="542" cy="352" r="6" fill="#a33a32"/>

  <text x="404" y="178" fill="#2b2823" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="14">null model</text>
  <line x1="404" y1="186" x2="404" y2="198" stroke="#2b2823" stroke-width="2"/>
  <text x="542" y="154" fill="#a33a32" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="14" font-weight="700">observed result</text>
  <text x="612" y="250" fill="#0f8b54" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="18" font-weight="700">p-value</text>
  <text x="402" y="388" fill="#4d4740" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13">results at least this extreme under the null model</text>
</svg>
