<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460">
  <metadata>Dark-mode adaptation from "P-value in statistical significance testing" by Repapetilto and Chen-Pan Liao, CC BY-SA 3.0.</metadata>
  <rect width="800" height="460" fill="#101922"/>
  <rect x="34" y="30" width="732" height="386" rx="8" fill="#131d24" stroke="#34444d" stroke-width="2"/>
  <text x="64" y="72" fill="#6ecbd3" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="20" font-weight="700" letter-spacing="1.2">p 值 = 阴影尾部</text>
  <text x="64" y="106" fill="#e9e4d6" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="17" font-weight="700">P(数据 | 零模型)，不是 P(零模型 | 数据)</text>

  <line x1="112" y1="352" x2="690" y2="352" stroke="#e9e4d6" stroke-width="2.5"/>
  <path d="M690 352 L672 342 L672 362 Z" fill="#e9e4d6"/>
  <line x1="112" y1="352" x2="112" y2="166" stroke="#e9e4d6" stroke-width="2.5"/>
  <path d="M112 166 L102 186 L122 186 Z" fill="#e9e4d6"/>

  <path d="M126 351 C188 351 226 336 270 292 C314 248 336 200 404 200 C472 200 496 248 540 292 C584 336 624 351 676 351" fill="none" stroke="#e9e4d6" stroke-width="5" stroke-linecap="round"/>
  <path d="M542 292 C584 336 624 351 676 351 L542 351 Z" fill="#5cbd84" fill-opacity=".24" stroke="#5cbd84" stroke-width="2"/>
  <path d="M542 292 C584 336 624 351 676 351" fill="none" stroke="#5cbd84" stroke-width="4" stroke-linecap="round"/>
  <line x1="542" y1="178" x2="542" y2="362" stroke="#dd6a60" stroke-width="2.5" stroke-dasharray="7 6"/>
  <circle cx="542" cy="352" r="6" fill="#dd6a60"/>

  <text x="404" y="178" fill="#e9e4d6" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="14">零模型</text>
  <line x1="404" y1="186" x2="404" y2="198" stroke="#e9e4d6" stroke-width="2"/>
  <text x="542" y="154" fill="#dd6a60" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="14" font-weight="700">观察结果</text>
  <text x="612" y="250" fill="#5cbd84" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="18" font-weight="700">p 值</text>
  <text x="402" y="388" fill="#a6b4ba" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13">零模型下至少如此极端的结果</text>
</svg>
