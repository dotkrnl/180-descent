<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520">
  <metadata>Adapted from "P-value in statistical significance testing" by Repapetilto and Chen-Pan Liao, CC BY-SA 3.0.</metadata>
  <rect width="800" height="520" fill="#f7f3ea"/>
  <rect x="28" y="24" width="744" height="144" rx="8" fill="#fffaf0" stroke="#2b2823" stroke-width="2"/>
  <text x="54" y="60" fill="#2b2823" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="18" font-weight="700">Do not transpose the conditional</text>
  <text x="54" y="100" fill="#2b2823" font-family="Fraunces, Georgia, serif" font-size="26" font-weight="700">P(data | null) is not P(null | data)</text>
  <text x="54" y="134" fill="#4d4740" font-family="Newsreader, Georgia, serif" font-size="18">A p-value asks how surprising the data would be if the null model were true.</text>
  <text x="54" y="156" fill="#4d4740" font-family="Newsreader, Georgia, serif" font-size="18">It is not the probability that the null model is true after seeing the data.</text>

  <line x1="94" y1="440" x2="720" y2="440" stroke="#2b2823" stroke-width="3"/>
  <path d="M720 440 L700 429 L700 451 Z" fill="#2b2823"/>
  <line x1="122" y1="442" x2="122" y2="236" stroke="#2b2823" stroke-width="3"/>
  <path d="M122 236 L111 258 L133 258 Z" fill="#2b2823"/>
  <text x="390" y="462" fill="#2b2823" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="15">possible results under the null model</text>
  <text x="68" y="355" fill="#2b2823" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="15" transform="rotate(-90 68 355)">probability density</text>

  <path d="M130 439 C185 439 210 428 245 392 C282 354 306 266 378 266 C450 266 478 354 516 392 C552 428 578 439 632 439" fill="none" stroke="#111" stroke-width="7" stroke-linecap="round"/>
  <path d="M514 392 C552 428 578 439 632 439 L514 439 Z" fill="#0f8b54" fill-opacity=".28" stroke="#0f8b54" stroke-width="2"/>
  <path d="M514 392 C552 428 578 439 632 439" fill="none" stroke="#0f8b54" stroke-width="5"/>
  <line x1="514" y1="276" x2="514" y2="450" stroke="#a33a32" stroke-width="2.5" stroke-dasharray="7 6"/>
  <circle cx="514" cy="440" r="7" fill="#a33a32"/>

  <text x="382" y="230" fill="#2b2823" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="15">more likely</text>
  <path d="M382 238 L382 257" stroke="#2b2823" stroke-width="2"/>
  <path d="M382 257 L374 246 L390 246 Z" fill="#2b2823"/>
  <text x="514" y="250" fill="#a33a32" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="15" font-weight="700">observed statistic</text>
  <path d="M500 258 L486 286" stroke="#a33a32" stroke-width="2"/>
  <path d="M486 286 L486 273 L497 279 Z" fill="#a33a32"/>
  <text x="602" y="322" fill="#0f8b54" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="18" font-weight="700">p-value</text>
  <text x="602" y="348" fill="#0f8b54" font-family="Newsreader, Georgia, serif" font-size="17">tail area at least</text>
  <text x="602" y="370" fill="#0f8b54" font-family="Newsreader, Georgia, serif" font-size="17">this extreme</text>
  <path d="M588 374 C548 374 540 400 532 424" fill="none" stroke="#0f8b54" stroke-width="2.5"/>
  <path d="M532 424 L529 410 L542 417 Z" fill="#0f8b54"/>

  <line x1="176" y1="420" x2="212" y2="420" stroke="#2b2823" stroke-width="2"/>
  <line x1="176" y1="420" x2="176" y2="434" stroke="#2b2823" stroke-width="2"/>
  <line x1="212" y1="420" x2="212" y2="434" stroke="#2b2823" stroke-width="2"/>
  <text x="196" y="392" fill="#4d4740" text-anchor="middle" font-family="Newsreader, Georgia, serif" font-size="17">unlikely</text>
  <text x="196" y="413" fill="#4d4740" text-anchor="middle" font-family="Newsreader, Georgia, serif" font-size="17">under null</text>

  <rect x="176" y="472" width="448" height="38" rx="17" fill="#efe7d4" stroke="#d2c3a8"/>
  <text x="400" y="488" fill="#2b2823" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12">Small p-value = data surprising under this model.</text>
  <text x="400" y="503" fill="#2b2823" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12">It is not the model's posterior probability.</text>
</svg>
