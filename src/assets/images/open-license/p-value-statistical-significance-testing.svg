<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520">
  <metadata>Adapted from "P-value in statistical significance testing" by Repapetilto and Chen-Pan Liao, CC BY-SA 3.0.</metadata>
  <rect width="800" height="520" fill="#f7f3ea"/>
  <rect x="34" y="32" width="732" height="430" rx="8" fill="#fffaf0" stroke="#d8ceb9" stroke-width="2"/>
  <text x="64" y="72" fill="#0f6f78" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="18" font-weight="700" letter-spacing="1.4">P-VALUE AS TAIL AREA</text>
  <text x="64" y="108" fill="#2b2823" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="18" font-weight="700">P(data this extreme | null model)</text>
  <text x="64" y="134" fill="#4d4740" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="14">not P(null model | data)</text>

  <line x1="104" y1="394" x2="704" y2="394" stroke="#2b2823" stroke-width="2.4"/>
  <path d="M704 394 L686 384 L686 404 Z" fill="#2b2823"/>
  <line x1="104" y1="394" x2="104" y2="182" stroke="#2b2823" stroke-width="2.4"/>
  <path d="M104 182 L94 202 L114 202 Z" fill="#2b2823"/>
  <text x="404" y="431" fill="#4d4740" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13">possible results if the null model were true</text>
  <text x="66" y="296" fill="#4d4740" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" transform="rotate(-90 66 296)">probability density</text>

  <path d="M118 393 C180 393 218 377 262 328 C306 280 326 226 404 226 C482 226 502 280 546 328 C590 377 628 393 690 393" fill="none" stroke="#2b2823" stroke-width="5" stroke-linecap="round"/>
  <path d="M548 328 C590 377 628 393 690 393 L548 393 Z" fill="#0f8b54" fill-opacity=".30" stroke="#0f8b54" stroke-width="2"/>
  <path d="M548 328 C590 377 628 393 690 393" fill="none" stroke="#0f8b54" stroke-width="4" stroke-linecap="round"/>
  <line x1="548" y1="205" x2="548" y2="404" stroke="#a33a32" stroke-width="2.4" stroke-dasharray="7 6"/>
  <circle cx="548" cy="394" r="6" fill="#a33a32"/>

  <text x="404" y="196" fill="#2b2823" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13">null model curve</text>
  <line x1="404" y1="204" x2="404" y2="222" stroke="#2b2823" stroke-width="1.8"/>
  <text x="548" y="184" fill="#a33a32" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" font-weight="700">observed statistic</text>
  <text x="618" y="282" fill="#0f8b54" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="16" font-weight="700">p-value</text>
  <text x="618" y="306" fill="#0f8b54" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13">area this extreme</text>
  <text x="618" y="326" fill="#0f8b54" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13">or more extreme</text>
</svg>
